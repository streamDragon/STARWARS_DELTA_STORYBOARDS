<!doctype html>
<html lang="en">
<head>

<title>STARWARS_DELTA Cutscene Preview CURRENT</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#090b12;color:#eef3ff;--line:#30384d;--panel:#101624;--muted:#9ca9c0;--ok:#6fdb96;--warn:#ffcf66;--blue:#6f8aff}*{box-sizing:border-box}body{margin:0;background:#090b12;color:#eef3ff}header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:flex-start;position:sticky;top:0;z-index:30;background:#090b12f2;backdrop-filter:blur(8px)}h1{font-size:18px;margin:0}.badge{font-size:10px;background:#2d5cff;color:#fff;border-radius:6px;padding:3px 6px;margin-left:6px}.sub{font-size:11px;color:var(--muted);margin-top:4px}.status{font-size:10px;color:var(--warn);margin-top:4px}.status.ready{color:var(--ok)}.controls{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #404a63;background:#171d2a;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:800;text-decoration:none}.btn.primary{background:#2d5cff;border-color:#2d5cff}.btn.test{background:#25322a;border-color:#42664c}.btn:disabled{opacity:.45;cursor:not-allowed}main{max-width:1660px;margin:auto;padding:14px}.drop{border:2px dashed #3d4760;border-radius:12px;padding:12px;text-align:center;color:#aab6c9;margin-bottom:12px;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px}.stageWrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0b1020}.stageHead{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid #283146;background:#0d1321}.stage{position:relative;aspect-ratio:16/9;background:radial-gradient(circle at 50% 45%,#15213a,#05070e 72%);overflow:hidden}.bg{position:absolute;inset:0;width:100%;height:100%;z-index:1}.world{position:absolute;inset:0;z-index:3}.obj{position:absolute;object-fit:contain;filter:drop-shadow(0 12px 20px #000b)}.actor{bottom:4%;height:55%;width:22%}.vehicle{top:31%;height:18%;width:27%}.fx{top:12%;height:20%;width:20%;mix-blend-mode:screen}.prop{bottom:13%;height:20%;width:18%}.slot0{left:7%}.slot1{left:39%}.slot2{right:7%}.ph{position:absolute;border:1px dashed #f1bf5688;background:#111827dc;border-radius:10px;padding:8px;color:#f0ce83;font-size:10px}.ph.actor{bottom:5%;height:38%;width:18%}.ph.vehicle{top:33%;height:15%;width:22%}.ph.fx{top:14%;height:16%;width:18%}.ph.prop{bottom:14%;height:15%;width:15%}.shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 56%,#000e);z-index:10}.hud{position:absolute;left:14px;right:14px;bottom:12px;z-index:12;text-shadow:0 2px 8px #000}.title{font-size:18px;font-weight:900}.meta{font-size:11px;color:#c6cede;margin-top:3px}.intent{font-size:12px;margin-top:7px;max-width:950px}.dialogue{margin-top:8px;display:grid;gap:5px;max-width:950px}.line{background:#05070be8;border:1px solid #404a63;border-radius:8px;padding:7px 10px}.speaker{font-size:11px;font-weight:800;color:#9fb4ff}.emotion{font-size:10px;color:#f4c86f;margin-left:6px}.text{font-size:13px;margin-top:2px}.thumbs{border-top:1px solid #283146;background:#0d1321;padding:9px 12px}.thumbrow{display:flex;gap:8px;overflow:auto}.thumb{min-width:112px;max-width:112px;border:1px solid #33405a;border-radius:8px;background:#101827;padding:5px}.thumb canvas,.thumb .tph{width:100%;height:70px;display:block;border-radius:6px;background:#02040b}.tph{display:grid;place-items:center;border:1px dashed #7686a7;color:#cbd5e6;font-size:10px}.tt{font-size:9px;margin-top:4px;color:#dce4f1;line-height:1.2;max-height:26px;overflow:hidden}.toolbar{display:flex;gap:10px;align-items:center;margin:10px 0}.time{font-size:12px;color:#b7c1d4;min-width:122px}.scrub{flex:1}.timeline{display:flex;gap:5px;overflow:auto;padding:4px 0 10px}.shot{min-width:128px;border:1px solid #33405a;background:#131a28;border-radius:9px;padding:7px;cursor:pointer}.shot.active{outline:2px solid #6f8aff}.shot b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shot small{font-size:9px;color:#9aa7bf}.panel{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:12px}.panel h2{font-size:13px;margin:0 0 8px}.kv{font-size:11px;line-height:1.55;color:#c1cadb;word-break:break-word}.ok{color:var(--ok)}.warn{color:var(--warn)}pre{white-space:pre-wrap;font-size:10px;max-height:360px;overflow:auto;color:#b4c1d6;margin:0}@media(max-width:980px){.layout{grid-template-columns:1fr}header{flex-direction:column}}
</style>
</head>
<body>
<header><div><h1>Cutscene JSON Preview <span class="badge">CURRENT</span></h1><div class="sub">Fast browser check before Unity. Real catalog crops only.</div><div id="status" class="status">Loading visual index...</div></div><div class="controls"><label class="btn primary">LOAD JSON<input id="file" type="file" hidden accept=".json,application/json"></label><button id="loadTest" class="btn test">LOAD 90S TEST</button><button id="play" class="btn" disabled>PLAY</button><button id="prev" class="btn" disabled>PREV</button><button id="next" class="btn" disabled>NEXT</button><a class="btn" href="./">BACK</a></div></header>
<main><div id="drop" class="drop">Drop a Cutscene JSON here, or use LOAD 90S TEST.</div><div class="layout"><section><div class="stageWrap"><div class="stageHead"><div><div id="stitle"><b>No shot loaded</b></div><div id="smeta" class="meta">Waiting for JSON</div></div><div id="sum" class="meta">visuals pending</div></div><div id="stage" class="stage"></div><div class="thumbs"><div class="meta" style="margin-bottom:6px">Shot visuals</div><div id="thumbrow" class="thumbrow"></div></div></div><div class="toolbar"><span id="time" class="time">0.0 / 0.0s</span><input id="scrub" class="scrub" type="range" min="0" max="1000" value="0" disabled></div><div id="timeline" class="timeline"></div></section><aside class="panel"><h2>Diagnostics</h2><div id="diag" class="kv">Nothing loaded.</div><hr><h2>Current Shot JSON</h2><pre id="raw">-</pre></aside></div></main>
<script>
const $=s=>document.querySelector(s),file=$('#file'),loadTest=$('#loadTest'),drop=$('#drop'),stage=$('#stage'),thumbrow=$('#thumbrow'),timeline=$('#timeline'),diag=$('#diag'),raw=$('#raw'),play=$('#play'),prev=$('#prev'),next=$('#next'),scrub=$('#scrub'),time=$('#time'),status=$('#status'),stitle=$('#stitle'),smeta=$('#smeta'),sum=$('#sum');
let data=null,shots=[],index=0,elapsed=0,playing=false,raf=0,lastTick=0,visualReady=false,indexStats='',currentBuild='';
const visualMap=new Map(),castMap=new Map(),INDEX_URL='designer-ai/open-current/FULL_VISUAL_INDEX.json';
const VISUAL_KEY=/(visualAssetId|actorAssetId|vehicleAssetId|portraitAssetId|backgroundAssetId|locationAssetId|environmentAssetId|effectAssetId|spriteAssetId|prefabAssetId|replacementAssetId|speakerPortraitAssetId|listenerPortraitAssetId|dialogueFrameAssetId|speakerBodyAssetId|listenerBodyAssetId|assetId)$/i;
const ACTOR_KEY=/(actorId|entityId|speakerActorId|listenerActorId|targetActorId|reactionActorId)$/i;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=(o,...ks)=>{for(const k of ks)if(o&&o[k]!=null)return o[k];return null};
const num=(v,d=0)=>Number.isFinite(Number(v))?Number(v):d;
const norm=v=>String(v??'').trim().replace(/\\/g,'/').toLowerCase();
const slug=v=>norm(v).replace(/\.[a-z0-9]+$/i,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
function variants(v){const n=norm(v);if(!n)return[];const b=n.split('/').pop(),e=b.replace(/\.[a-z0-9]+$/i,'');return[...new Set([n,b,e,slug(n),slug(b)])]}
function cat(a){const s=String(a.cutscenePrimaryUse||a.category||a.displayName||'').toLowerCase();if(/background|environment|location|space|command|interior|bg|layer/.test(s))return'background';if(/actor|character|portrait|pilot|commander|officer|person|face|robot/.test(s))return'actor';if(/vehicle|ship|fighter|bomber|carrier|probe|bus/.test(s))return'vehicle';if(/vfx|effect|fx|explosion|blast|laser|fire|smoke|warp|impact/.test(s))return'fx';return'prop'}
function infer(path,v){const s=(path+' '+v).toLowerCase();if(/background|environment|location|layer/.test(s))return'background';if(/portrait|actor|character|speaker|listener|pilot|robot/.test(s))return'actor';if(/vehicle|ship|fighter|carrier|bus/.test(s))return'vehicle';if(/effect|vfx|fx|explosion|laser|blast|warp/.test(s))return'fx';return'prop'}
function addKey(id,d,score=100){if(!id)return;for(const k of variants(id)){const old=visualMap.get(k);if(!old||score>old.score)visualMap.set(k,{descriptor:d,id:String(id),score})}}
async function loadIndex(){try{const u=new URL(INDEX_URL,location.href);u.searchParams.set('v',Date.now());const r=await fetch(u,{cache:'no-store'});const j=await r.json();let reps=0;for(const a of j.assets||[]){const slot=Number(a.slot),url=a.pageImageUrl||a.pageImageFile;if(!url||!Number.isFinite(slot))continue;const d={url,slot,cols:3,rows:4,category:cat(a),displayName:a.displayName||a.assetId||''};[a.assetId,a.visualReferenceId,a.displayName,...(a.catalogAssetIds||[]),...(a.visualReferenceIds||[])].filter(Boolean).forEach(id=>addKey(id,d,id===a.displayName?70:220));reps++}try{const c=await fetch('current.json?ts='+Date.now(),{cache:'no-store'});if(c.ok)currentBuild=(await c.json()).buildId||''}catch{}visualReady=true;indexStats=`${reps.toLocaleString()} representatives · ${visualMap.size.toLocaleString()} keys`;status.textContent=`CURRENT ${currentBuild} · ${indexStats}`;status.classList.add('ready');if(shots.length)render()}catch(e){status.textContent='Visual index failed: '+e.message}}
function resolve(id){for(const k of variants(id)){const h=visualMap.get(k);if(h)return h}return null}
function buildCast(root){castMap.clear();for(const c of [...(root?.cast||[]),...(root?.actors||[])]){const id=val(c,'entityId','actorId','id');if(id)castMap.set(String(id),c)}}
function actorAsset(id){const c=castMap.get(String(id));return c?val(c,'visualAssetId','actorAssetId','assetId','portraitAssetId'):null}
function collectShots(root){if(Array.isArray(root))return root;if(Array.isArray(root?.shots))return root.shots;if(Array.isArray(root?.sequences))return root.sequences.flatMap(q=>(q.shots||[]).map(s=>({...s,__sequence:q})));return[]}
const shotDuration=s=>Math.max(.05,num(val(s,'duration','seconds','length'),3));
const label=(s,i)=>String(val(s,'shotId','id','name','title')||`Shot ${i+1}`);
const totalDuration=()=>shots.reduce((a,s)=>a+shotDuration(s),0);
function startOf(i){let t=0;for(let x=0;x<i;x++)t+=shotDuration(shots[x]);return t}
function collectRefs(s){const out=[],unresolvedActors=[],seen=new Set(),aseen=new Set();function asset(id,path,forced){if(typeof id!=='string'||!id.trim())return;const c=forced||infer(path,id),k=norm(id)+'|'+c;if(seen.has(k))return;seen.add(k);out.push({value:id.trim(),path,category:c})}function actor(id,path){if(typeof id!=='string'||!id.trim()||aseen.has(id))return;aseen.add(id);const a=actorAsset(id);if(a)asset(a,path+'.visualAssetId','actor');else unresolvedActors.push({value:id,path,category:'actor',reason:'not mapped in cast'})}function walk(node,path='',depth=0){if(!node||depth>10)return;if(Array.isArray(node)){node.forEach((v,i)=>walk(v,`${path}[${i}]`,depth+1));return}if(typeof node!=='object')return;for(const[k,v]of Object.entries(node)){const p=path?`${path}.${k}`:k;if(typeof v==='string'){if(VISUAL_KEY.test(k)&&!/animationAssetId/i.test(k))asset(v,p);else if(ACTOR_KEY.test(k))actor(v,p)}else walk(v,p,depth+1)}}walk(s,'shot');return{refs:out,unresolvedActors}}
function resolveShot(s){const c=collectRefs(s),resolved=[],unresolved=[...c.unresolvedActors],seen=new Set();for(const r of c.refs){const h=resolve(r.value);if(h){const category=h.descriptor.category||r.category,key=h.descriptor.url+'|'+h.descriptor.slot+'|'+category;if(!seen.has(key)){seen.add(key);resolved.push({...r,descriptor:h.descriptor,matched:h.id,category})}}else unresolved.push({...r,reason:'asset not in visual index'})}return{resolved,unresolved,bg:resolved.find(x=>x.category==='background')||null}}
function rawCell(img,d){const slot=Math.max(1,d.slot)-1,col=slot%3,row=Math.floor(slot/3)%4,cw=img.naturalWidth/3,ch=img.naturalHeight/4,tmp=document.createElement('canvas');tmp.width=Math.round(cw);tmp.height=Math.round(ch);tmp.getContext('2d',{willReadFrequently:true}).drawImage(img,col*cw,row*ch,cw,ch,0,0,tmp.width,tmp.height);return tmp}
function cropMedia(img,d,transparent){const cell=rawCell(img,d),ctx=cell.getContext('2d',{willReadFrequently:true}),im=ctx.getImageData(0,0,cell.width,cell.height),p=im.data;const top=Math.floor(cell.height*.15),bottom=Math.floor(cell.height*.61);let minX=cell.width,minY=bottom,maxX=-1,maxY=-1;for(let y=top;y<bottom;y++)for(let x=0;x<cell.width;x++){const i=(y*cell.width+x)*4,r=p[i],g=p[i+1],b=p[i+2],a=p[i+3],mx=Math.max(r,g,b),mn=Math.min(r,g,b);const white=mx>240&&mx-mn<12;const ink=!white&&a>25;if(ink){if(x<minX)minX=x;if(y<minY)minY=y;if(x>maxX)maxX=x;if(y>maxY)maxY=y}}if(maxX<0){minX=Math.floor(cell.width*.08);maxX=Math.floor(cell.width*.92);minY=top;maxY=bottom}const px=4,py=4;minX=Math.max(0,minX-px);maxX=Math.min(cell.width-1,maxX+px);minY=Math.max(top,minY-py);maxY=Math.min(bottom-1,maxY+py);const out=document.createElement('canvas');out.width=maxX-minX+1;out.height=maxY-minY+1;const o=out.getContext('2d',{willReadFrequently:true});o.drawImage(cell,minX,minY,out.width,out.height,0,0,out.width,out.height);if(transparent){const dta=o.getImageData(0,0,out.width,out.height),q=dta.data;for(let i=0;i<q.length;i+=4){const mx=Math.max(q[i],q[i+1],q[i+2]),mn=Math.min(q[i],q[i+1],q[i+2]);if(mx>228&&mx-mn<18)q[i+3]=Math.max(0,255-(mx-228)*10)}o.putImageData(dta,0,0)}return out}
function canvasFor(desc,category,cls=''){const c=document.createElement('canvas');c.className=`obj ${category} ${cls}`;const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{const src=cropMedia(img,desc,category!=='background'),scale=Math.min(1,800/Math.max(src.width,src.height));c.width=Math.max(1,Math.round(src.width*scale));c.height=Math.max(1,Math.round(src.height*scale));c.getContext('2d').drawImage(src,0,0,c.width,c.height)};img.src=desc.url;return c}
function bgFor(desc){const c=document.createElement('canvas');c.className='bg';const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{const src=cropMedia(img,desc,false);c.width=1600;c.height=900;const ctx=c.getContext('2d'),s=Math.max(c.width/src.width,c.height/src.height),w=src.width*s,h=src.height*s;ctx.drawImage(src,(c.width-w)/2,(c.height-h)/2,w,h)};img.src=desc.url;return c}
function lines(s){const d=val(s,'dialogue','dialogues','lines');return Array.isArray(d)?d:(typeof d==='string'?[{text:d}]:[])}
function render(){if(!shots.length)return;const s=shots[index],r=resolveShot(s);stage.innerHTML='';thumbrow.innerHTML='';stitle.innerHTML=`<b>${esc(label(s,index))}</b>`;smeta.textContent=[val(s,'shotType'),val(s,'cameraIntent'),shotDuration(s).toFixed(1)+'s'].filter(Boolean).join(' · ');sum.textContent=`${r.resolved.length} resolved · ${r.unresolved.length} unresolved`;raw.textContent=JSON.stringify(s,(k,v)=>k==='__sequence'?undefined:v,2);if(r.bg)stage.appendChild(bgFor(r.bg.descriptor));const world=document.createElement('div');world.className='world';stage.appendChild(world);const b={actor:[],vehicle:[],fx:[],prop:[]};for(const x of r.resolved){let c=x.category;if(!b[c]||c==='background')c='prop';if(x.category!=='background')b[c].push(x)}for(const[c,items]of Object.entries(b))items.slice(0,3).forEach((x,i)=>world.appendChild(canvasFor(x.descriptor,c,`slot${i}`)));const uc={actor:0,vehicle:0,fx:0,prop:0};for(const x of r.unresolved){let c=x.category;if(!uc.hasOwnProperty(c))c='prop';if(c==='prop'&&x.reason==='asset not in visual index')continue;if(uc[c]>=2)continue;const p=document.createElement('div');p.className=`ph ${c} slot${uc[c]++}`;p.innerHTML=`<b>${esc(x.value)}</b><br>${esc(x.reason||'unresolved')}`;world.appendChild(p)}const shade=document.createElement('div');shade.className='shade';stage.appendChild(shade);const hud=document.createElement('div');hud.className='hud';hud.innerHTML=`<div class="title">${esc(label(s,index))}</div><div class="meta">${esc([val(s,'shotType'),val(s,'cameraIntent'),shotDuration(s).toFixed(1)+'s'].filter(Boolean).join(' · '))}</div>${val(s,'intention')?`<div class="intent">${esc(val(s,'intention'))}</div>`:''}<div class="dialogue">${lines(s).slice(0,3).map(l=>`<div class="line"><div><span class="speaker">${esc(l.speaker||'')}</span>${l.emotion?`<span class="emotion">${esc(l.emotion)}</span>`:''}</div><div class="text">${esc(l.text||'')}</div></div>`).join('')}</div>`;stage.appendChild(hud);[...r.resolved,...r.unresolved.slice(0,3)].forEach(x=>{const t=document.createElement('div');t.className='thumb';if(x.descriptor){const c=canvasFor(x.descriptor,x.category,'');c.className='';c.style.width='100%';c.style.height='70px';t.appendChild(c)}else{const p=document.createElement('div');p.className='tph';p.textContent=x.category.toUpperCase();t.appendChild(p)}const tt=document.createElement('div');tt.className='tt';tt.textContent=x.value;t.appendChild(tt);thumbrow.appendChild(t)});diag.innerHTML=`<div><span class="${visualReady?'ok':'warn'}">${visualReady?'✓':'…'} ${esc(indexStats)}</span></div><div>Resolved: ${r.resolved.length}</div><div>Unresolved: ${r.unresolved.length}</div><div>Actor IDs resolve through cast.</div><div>Generic unresolved props are hidden from stage.</div>`;[...timeline.children].forEach((e,i)=>e.classList.toggle('active',i===index));updateClock()}
function buildTimeline(){timeline.innerHTML='';shots.forEach((s,i)=>{const e=document.createElement('div');e.className='shot';e.innerHTML=`<b>${esc(label(s,i))}</b><small>${esc(val(s,'cameraIntent')||'')} · ${shotDuration(s).toFixed(1)}s</small>`;e.onclick=()=>{stop();index=i;elapsed=startOf(i);render()};timeline.appendChild(e)})}function updateClock(){const t=totalDuration();time.textContent=`${elapsed.toFixed(1)} / ${t.toFixed(1)}s`;scrub.value=t?Math.round(elapsed/t*1000):0}function seek(t){elapsed=Math.max(0,Math.min(totalDuration(),t));let a=0;for(let i=0;i<shots.length;i++){const d=shotDuration(shots[i]);if(elapsed<a+d||i===shots.length-1){index=i;break}a+=d}render()}function start(){if(!shots.length)return;playing=true;play.textContent='PAUSE';lastTick=performance.now();raf=requestAnimationFrame(tick)}function stop(){playing=false;play.textContent='PLAY';if(raf)cancelAnimationFrame(raf)}function tick(now){if(!playing)return;elapsed+=(now-lastTick)/1000;lastTick=now;if(elapsed>=totalDuration()){elapsed=totalDuration();render();stop();return}let a=0,before=index;for(let i=0;i<shots.length;i++){a+=shotDuration(shots[i]);if(elapsed<a){index=i;break}}if(before!==index)render();else updateClock();raf=requestAnimationFrame(tick)}function loadText(text,name){try{data=JSON.parse(text);buildCast(data);shots=collectShots(data);if(!shots.length)throw new Error('No shots found');index=0;elapsed=0;stop();buildTimeline();render();drop.textContent=`Loaded ${name}: ${shots.length} shots, ${totalDuration().toFixed(1)} seconds`;play.disabled=prev.disabled=next.disabled=scrub.disabled=false}catch(e){drop.textContent='Could not load JSON: '+e.message}}function loadFile(f){if(!f)return;const r=new FileReader();r.onload=()=>loadText(r.result,f.name);r.readAsText(f)}
file.onchange=e=>loadFile(e.target.files[0]);drop.onclick=()=>file.click();drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();loadFile(e.dataTransfer.files[0])};loadTest.onclick=async()=>{const r=await fetch('cutscene-preview-test-90s.json?ts='+Date.now(),{cache:'no-store'});loadText(await r.text(),'CUTSCENE PREVIEW 90S TEST')};play.onclick=()=>playing?stop():start();prev.onclick=()=>{stop();index=Math.max(0,index-1);elapsed=startOf(index);render()};next.onclick=()=>{stop();index=Math.min(shots.length-1,index+1);elapsed=startOf(index);render()};scrub.oninput=()=>{stop();seek(totalDuration()*Number(scrub.value)/1000)};loadIndex();
</script>
</body></html>
