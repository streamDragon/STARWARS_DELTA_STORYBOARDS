<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>STARWARS_DELTA Cutscene Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b12;color:#eef3ff;font-family:Inter,system-ui,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#090b12}
#boot{position:fixed;inset:0;display:grid;place-items:center;z-index:2;background:#090b12;color:#9ca9c0;font-size:14px}
#boot b{color:#eef3ff}
</style>
</head>
<body>
<div id="boot"><div><b>Cutscene Preview CURRENT</b><br>Loading the latest published version...</div></div>
<iframe id="app" title="STARWARS_DELTA Cutscene Preview CURRENT"></iframe>
<script>
(async()=>{
  const frame=document.getElementById('app');
  const boot=document.getElementById('boot');
  let implementation='cutscene-preview-current.html';
  let build='current';
  let preview={};
  try{
    const response=await fetch('current.json?ts='+Date.now(),{cache:'no-store'});
    if(response.ok){
      const current=await response.json();
      preview=current?.cutscenePreview||{};
      implementation=preview.implementationPath||implementation;
      build=current?.buildId||build;
    }
  }catch{}
  const patchPaths=[
    preview.domHotfixPath||'cutscene-preview-dom-hotfix-current.js',
    preview.parserPatchPath||'cutscene-preview-parser-current.js',
    preview.handleRecoveryPatchPath||'cutscene-preview-handle-recovery-current.js',
    preview.filmPatchPath||'cutscene-preview-film-current.js',
    preview.dialoguePatchPath||'cutscene-preview-dialogue-current.js',
    preview.qualityPatchPath||'cutscene-preview-quality-current.js',
    preview.goldenTestPatchPath||'cutscene-preview-golden-test-current.js',
    preview.playbackPatchPath||'cutscene-preview-playback-current.js'
  ].filter((src,index,all)=>src&&all.indexOf(src)===index);
  const url=new URL(implementation,location.href);
  url.searchParams.set('build',build);
  url.searchParams.set('fresh',Date.now());
  frame.onload=()=>{
    try{
      const doc=frame.contentDocument;
      const back=doc.querySelector('a[href="./"]');
      if(back)back.target='_top';
      const inject=(src)=>new Promise(resolve=>{
        const s=doc.createElement('script');
        s.src=src+'?build='+encodeURIComponent(build)+'&fresh='+Date.now();
        s.onload=resolve;s.onerror=resolve;doc.body.appendChild(s);
      });
      (async()=>{
        for(const src of patchPaths)await inject(src);
        boot.style.display='none';
      })();
    }catch{
      boot.style.display='none';
    }
  };
  frame.src=url.href;
})();
</script>
</body>
</html>
