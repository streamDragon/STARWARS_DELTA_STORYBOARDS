<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STARWARS_DELTA Cutscene Preview</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#090b12;color:#f4f5f8}*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f4f5f8}header{padding:18px 22px;border-bottom:1px solid #2b3040;display:flex;gap:16px;align-items:center;justify-content:space-between;position:sticky;top:0;background:#090b12ee;backdrop-filter:blur(10px);z-index:5}h1{font-size:20px;margin:0}.sub{font-size:12px;color:#9fa8bd;margin-top:3px}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #40475d;background:#181d2a;color:white;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:700}.btn.primary{background:#2d5cff;border-color:#2d5cff}.btn:disabled{opacity:.45;cursor:not-allowed}main{max-width:1400px;margin:auto;padding:20px}.drop{border:2px dashed #41485d;border-radius:14px;padding:24px;text-align:center;color:#aeb7ca;margin-bottom:18px;cursor:pointer}.drop.drag{border-color:#6d8cff;background:#11182c}.stage{aspect-ratio:16/9;background:#02030a;border:1px solid #30364a;border-radius:14px;overflow:hidden;position:relative;display:grid;place-items:center}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#000b)}.shotInfo{position:absolute;left:18px;bottom:16px;right:18px;z-index:2;text-shadow:0 2px 8px #000}.shotTitle{font-size:20px;font-weight:800}.shotMeta{font-size:12px;color:#c6cede;margin-top:4px}.dialogue{margin-top:10px;background:#05070bbb;border:1px solid #40475d;border-radius:8px;padding:10px 12px;max-width:850px}.empty{color:#778096;text-align:center;padding:40px}.toolbar{display:flex;align-items:center;gap:10px;margin:12px 0}.time{font-variant-numeric:tabular-nums;color:#b9c1d1;min-width:110px}.scrub{flex:1}.timeline{display:flex;gap:6px;overflow:auto;padding:8px 0 14px}.shot{min-width:150px;max-width:220px;border:1px solid #353c50;background:#141927;border-radius:9px;padding:10px;cursor:pointer}.shot.active{outline:2px solid #6480ff}.shot b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shot small{color:#9ba5b8}.grid{display:grid;grid-template-columns:1fr 360px;gap:16px}.panel{border:1px solid #30364a;background:#101522;border-radius:12px;padding:14px;min-height:150px}.panel h2{font-size:14px;margin:0 0 10px}.kv{font-size:12px;line-height:1.55;color:#bac3d4;word-break:break-word}.ok{color:#68d391}.warn{color:#f6c85f}.bad{color:#ff7b86}pre{white-space:pre-wrap;font-size:11px;color:#aeb8ca;margin:0;max-height:320px;overflow:auto}@media(max-width:900px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div><h1>Cutscene JSON Preview</h1><div class="sub">Fast browser preview. No Unity import required.</div></div><div class="controls"><label class="btn primary">LOAD JSON<input id="file" type="file" accept=".json,application/json" hidden></label><button id="play" class="btn" disabled>PLAY</button><button id="prev" class="btn" disabled>◀</button><button id="next" class="btn" disabled>▶</button><a class="btn" href="./">BACK</a></div></header>
<main>
<div id="drop" class="drop">Drop a Cutscene JSON here, or click LOAD JSON.</div>
<div class="grid">
<section><div id="stage" class="stage"><div class="empty">Load JSON to preview the cutscene.</div></div><div class="toolbar"><span id="time" class="time">0.0 / 0.0s</span><input id="scrub" class="scrub" type="range" min="0" max="1000" value="0" disabled></div><div id="timeline" class="timeline"></div></section>
<aside class="panel"><h2>Diagnostics</h2><div id="diag" class="kv">Nothing loaded.</div><hr style="border-color:#2d3448"><h2>Current shot JSON</h2><pre id="raw">-</pre></aside>
</div>
</main>
<script>
const $=s=>document.querySelector(s);const file=$('#file'),drop=$('#drop'),stage=$('#stage'),timeline=$('#timeline'),diag=$('#diag'),raw=$('#raw'),play=$('#play'),prev=$('#prev'),next=$('#next'),scrub=$('#scrub'),time=$('#time');
let data=null,shots=[],index=0,playing=false,timer=null,elapsed=0,lastTick=0;
function val(o,...keys){for(const k of keys){if(o&&o[k]!=null)return o[k]}return null}
function num(v,d=0){const n=Number(v);return Number.isFinite(n)?n:d}
function shotDuration(s){return Math.max(.15,num(val(s,'duration','durationSeconds','seconds','length','shotDuration'),3))}
function collectShots(root){const direct=val(root,'shots','shotList');if(Array.isArray(direct))return direct;const seqs=val(root,'sequences','sequenceList','scenes');if(Array.isArray(seqs))return seqs.flatMap(q=>Array.isArray(q.shots)?q.shots:[]);if(Array.isArray(root))return root;return []}
function findText(s){const d=val(s,'dialogue','dialogues','lines','subtitle','text');if(typeof d==='string')return d;if(Array.isArray(d))return d.map(x=>typeof x==='string'?x:(val(x,'text','line','content')||'')).filter(Boolean).join('  ');if(d&&typeof d==='object')return val(d,'text','line','content')||'';return ''}
function findImage(s){const candidates=[val(s,'previewImage','image','imageUrl','backgroundUrl','backgroundImage','thumbnail','frame'),s.background&&val(s.background,'url','image','src','path'),s.location&&val(s.location,'previewImage','imageUrl')];for(const c of candidates){if(typeof c==='string'&&(c.startsWith('http://')||c.startsWith('https://')||c.startsWith('./')||c.startsWith('../')||c.startsWith('/')))return c}return null}
function label(s,i){return String(val(s,'shotId','id','name','title')||`Shot ${i+1}`)}
function describe(s){const bits=[];for(const [n,keys] of [['Camera',['cameraIntent','camera','shotType']],['Location',['location','locationId','set']],['Actor',['actor','actorId','subject']],['Move',['move','cinematicMove','movement']]]){let v=val(s,...keys);if(v&&typeof v==='object')v=val(v,'id','name','type','intent');if(v)bits.push(`${n}: ${v}`)}return bits.join(' · ')}
function totalDuration(){return shots.reduce((a,s)=>a+shotDuration(s),0)}
function startOf(i){let t=0;for(let n=0;n<i;n++)t+=shotDuration(shots[n]);return t}
function render(){if(!shots.length)return;const s=shots[index],img=findImage(s),text=findText(s),title=label(s,index),meta=describe(s),dur=shotDuration(s);stage.innerHTML='';if(img){const el=document.createElement('img');el.src=img;el.alt=title;el.onerror=()=>{el.remove();if(!stage.querySelector('.empty'))stage.insertAdjacentHTML('afterbegin','<div class="empty">Image path could not be loaded in browser.</div>')};stage.appendChild(el)}else stage.innerHTML='<div class="empty">No browser-loadable image in this shot.<br>The timing, dialogue and shot data are still previewed.</div>';const shade=document.createElement('div');shade.className='shade';stage.appendChild(shade);const info=document.createElement('div');info.className='shotInfo';info.innerHTML=`<div class="shotTitle">${esc(title)}</div><div class="shotMeta">${esc(meta||'No camera/location metadata detected')} · ${dur.toFixed(1)}s</div>${text?`<div class="dialogue">${esc(text)}</div>`:''}`;stage.appendChild(info);raw.textContent=JSON.stringify(s,null,2);[...timeline.children].forEach((e,i)=>e.classList.toggle('active',i===index));const imageStatus=img?'<span class="ok">✓ browser image found</span>':'<span class="warn">⚠ no browser image reference</span>';const textStatus=text?'<span class="ok">✓ dialogue/text found</span>':'<span class="warn">• no dialogue</span>';diag.innerHTML=`<b>${esc(title)}</b><br>${imageStatus}<br>${textStatus}<br><span class="ok">✓ duration ${dur.toFixed(2)}s</span><br>${meta?'<span class="ok">✓ shot metadata found</span>':'<span class="warn">⚠ minimal metadata</span>'}`;updateClock()}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buildTimeline(){timeline.innerHTML='';shots.forEach((s,i)=>{const e=document.createElement('div');e.className='shot';e.innerHTML=`<b>${esc(label(s,i))}</b><small>${shotDuration(s).toFixed(1)}s</small>`;e.onclick=()=>{stop();index=i;elapsed=startOf(i);render()};timeline.appendChild(e)})}
function updateClock(){const total=totalDuration();time.textContent=`${elapsed.toFixed(1)} / ${total.toFixed(1)}s`;scrub.value=total?Math.round(elapsed/total*1000):0}
function seek(t){const total=totalDuration();elapsed=Math.max(0,Math.min(total,t));let acc=0;for(let i=0;i<shots.length;i++){const d=shotDuration(shots[i]);if(elapsed<acc+d||i===shots.length-1){index=i;break}acc+=d}render()}
function start(){if(!shots.length)return;if(elapsed>=totalDuration())seek(0);playing=true;play.textContent='PAUSE';lastTick=performance.now();timer=requestAnimationFrame(tick)}
function stop(){playing=false;play.textContent='PLAY';if(timer)cancelAnimationFrame(timer);timer=null}
function tick(now){if(!playing)return;const dt=(now-lastTick)/1000;lastTick=now;const before=index;elapsed+=dt;if(elapsed>=totalDuration()){elapsed=totalDuration();render();stop();return}let acc=0;for(let i=0;i<shots.length;i++){acc+=shotDuration(shots[i]);if(elapsed<acc){index=i;break}}if(before!==index)render();else updateClock();timer=requestAnimationFrame(tick)}
function loadText(text,name){try{data=JSON.parse(text);shots=collectShots(data);if(!shots.length)throw new Error('No shots array found');index=0;elapsed=0;stop();buildTimeline();render();drop.textContent=`Loaded ${name}: ${shots.length} shots, ${totalDuration().toFixed(1)} seconds`;play.disabled=prev.disabled=next.disabled=scrub.disabled=false}catch(e){drop.textContent='Could not load JSON: '+e.message;diag.innerHTML='<span class="bad">✕ '+esc(e.message)+'</span>'}}
function loadFile(f){if(!f)return;const r=new FileReader();r.onload=()=>loadText(r.result,f.name);r.readAsText(f)}
file.onchange=e=>loadFile(e.target.files[0]);drop.onclick=()=>file.click();drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');loadFile(e.dataTransfer.files[0])};play.onclick=()=>playing?stop():start();prev.onclick=()=>{stop();index=Math.max(0,index-1);elapsed=startOf(index);render()};next.onclick=()=>{stop();index=Math.min(shots.length-1,index+1);elapsed=startOf(index);render()};scrub.oninput=()=>{stop();seek(totalDuration()*Number(scrub.value)/1000)};
</script>
</body>
</html>
