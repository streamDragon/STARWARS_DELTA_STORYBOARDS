<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>סרטים | STARWARS_DELTA</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#1c3c51,#081420 75%);color:#e9f4fa;font:16px/1.6 system-ui}nav{background:#0d2030;border-bottom:1px solid #35536b;padding:17px 5%;display:flex;gap:20px;flex-wrap:wrap}a{color:#91e7e4}nav a{text-decoration:none}main{max-width:1240px;margin:auto;padding:32px 20px 70px}h1{font-size:clamp(30px,4vw,49px);margin:0 0 8px}p{color:#b9cfdb}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}.card{border:1px solid #37546b;background:#12293c;border-radius:14px;padding:20px}.card h2{font-size:20px;margin:0 0 8px}.card small{color:#f0c789}.links{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.links a{padding:8px 11px;background:#1a4655;border-radius:8px}input{padding:11px 13px;background:#102537;color:#fff;border:1px solid #557c8e;border-radius:9px;font:inherit;width:min(100%,430px);margin:14px 0}#status{font-size:13px}</style></head><body><nav><a href="../">בית</a><a href="../workbench.html?kind=film">סביבת עבודה</a><a href="../cinematic-director.html">בימוי</a><a href="../film-qa.html">Film QA</a></nav><main><h1>סרטים וסטוריבורדים</h1><p>קודם מבינים את הסיפור, אחר כך בונים CURRENT V1, מצלמים ב־Unity ובודקים. נגן דפדפן אינו הוכחת Runtime.</p><input id="q" type="search" placeholder="חיפוש סרט…" aria-label="חיפוש סרטים"><p id="status" role="status">טוען רשימת סרטים…</p><section class="cards" id="cards"></section></main><script>(()=>{'use strict';const cards=document.getElementById('cards'),q=document.getElementById('q'),status=document.getElementById('status');let list=[];function draw(){cards.replaceChildren();for(const p of list.filter(x=>(x.title+' '+x.id).toLowerCase().includes(q.value.toLowerCase()))){const box=document.createElement('article');box.className='card';const h=document.createElement('h2');h.textContent=p.title;const s=document.createElement('small');s.textContent=p.stage+' · גרסה '+p.revision;const links=document.createElement('div');links.className='links';for(const [label,url] of [['תיק עבודה','../workbench.html?id='+encodeURIComponent(p.id)],['סטוריבורד','../storyboard.html?session='+encodeURIComponent(p.id)],['אנימטיק V7',p.id==='fleet30-camera'?'fleet-v7-continuity.html':'../cutscene-preview.html?session='+encodeURIComponent(p.id)]]){const a=document.createElement('a');a.href=url;a.textContent=label;links.append(a)}box.append(h,s,links);cards.append(box)}if(!cards.children.length)cards.textContent='לא נמצאו סרטים.'}q.addEventListener('input',draw);(async()=>{try{const r=await fetch('https://api.github.com/repos/streamDragon/STARWARS_DELTA_STORYBOARDS/git/ref/heads/main?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HEAD '+r.status);const sha=(await r.json()).object.sha;const f=await fetch('https://raw.githubusercontent.com/streamDragon/STARWARS_DELTA_STORYBOARDS/'+sha+'/workbench/index.json',{cache:'no-store'});if(!f.ok)throw Error('INDEX '+f.status);const index=await f.json();list=index.projects.filter(p=>p.kind==='film');status.textContent='נטענו '+list.length+' תיקי סרטים · HEAD '+sha.slice(0,8);draw()}catch(e){status.textContent='שגיאה בטעינה: '+e.message+'. לא מוצגת גרסה מיושנת בשקט.'}})()})();</script></body></html>
