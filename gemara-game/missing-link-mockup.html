<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102630">
<meta name="description" content="החוליה החסרה, משחק גמרא מודרך: דמות מדריכה, פעולה אחת בכל שלב, חקירה קדימה ואחורה.">
<title>החוליה החסרה • משחק מודרך • גמרא גיים</title>
<style>
:root{font-family:Arial,"Noto Sans Hebrew",sans-serif;--ink:#fdf5de;--muted:#c2d6d5;--gold:#ffd98f;--blue:#102d38;--cream:#fff2d0;--mint:#95e1d0;--rose:#ffb2a1}
*{box-sizing:border-box}
html{background:#081a23}body{margin:0;color:var(--ink);background:radial-gradient(ellipse 130% 90% at 50% 10%,#294e54 0%,#17343e 42%,#0d2430 78%,#091b25 100%);min-height:100dvh}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #fff5ba;outline-offset:3px}
[hidden]{display:none!important}
.game{max-width:460px;min-height:100dvh;margin:0 auto;padding:calc(11px + env(safe-area-inset-top,0px)) 17px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:0;position:relative;overflow:hidden}
.game:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,#7ad2c108,transparent 56%);z-index:0}
.game>*{position:relative;z-index:1}
.bar{height:37px;display:flex;align-items:center;justify-content:space-between;flex:none}
.brand{font-size:14px;font-weight:900;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;border:1px solid #e6c48299;background:#183642;color:var(--gold);font:900 21px Georgia}
.back{border:0;background:none;color:#d3e0d8;padding:8px 6px;font-size:13px;min-height:35px}
.meter{height:33px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px;flex:none}
.step-text{font-size:12px;color:#fff1ce;font-weight:800}
.track{display:flex;gap:5px;direction:ltr;align-items:center}.track i{display:block;height:6px;width:31px;background:#476a6c;border-radius:99px}.track i.on{background:var(--gold);box-shadow:0 0 11px #fbc87b72}
.speech{display:flex;align-items:center;gap:12px;flex:none;min-height:104px;margin:6px 0 8px}
.avatar{width:89px;height:101px;flex:none;position:relative;filter:drop-shadow(0 5px 11px #0006)}
.avatar svg{width:100%;height:100%;overflow:visible}.avatar .wave{transform-origin:57px 78px;animation:hello 1.5s ease-in-out infinite alternate}.avatar.quiet .wave{animation:none}
@keyframes hello{from{transform:rotate(-7deg)}to{transform:rotate(18deg)}}@media(prefers-reduced-motion:reduce){.avatar .wave{animation:none!important}}
.talk{position:relative;flex:1;min-width:0;min-height:82px;display:flex;flex-direction:column;justify-content:center;background:#fdf0d4;color:#27343a;padding:10px 15px 12px;border-radius:18px 18px 5px 18px;box-shadow:0 5px 0 #1d3e44,0 10px 22px #0003}
.talk:before{content:"";position:absolute;right:-9px;bottom:18px;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:0;border-right:12px solid #fdf0d4;transform:scaleX(-1)}
.speaker{font-size:11px;font-weight:900;color:#876345;margin-bottom:4px}
.talk-text{font-size:clamp(14px,4vw,16px);font-weight:800;line-height:1.35;letter-spacing:-.12px}
.chapter{height:44px;flex:none;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:2px}
.chapter strong{font-size:clamp(21px,5.8vw,25px);line-height:1.15}.chapter span{font-size:12px;color:#d4e6dc}
.world{position:relative;flex:1 1 auto;min-height:200px;max-height:395px;margin-top:7px;border-radius:27px 27px 18px 18px;background:radial-gradient(ellipse 87% 70% at 50% 48%,#3e6370 0%,#294b56 49%,#163643 100%);border:1px solid #6b95977a;box-shadow:inset 0 0 38px #051b2a6b,0 12px 25px #04151b52;overflow:hidden;isolation:isolate}
.world:before{content:"";position:absolute;inset:10px 11px 0;border-radius:140px 140px 0 0;border:6px solid #e1c99419;border-bottom:0;box-shadow:inset 0 0 0 1px #f7d8a026;pointer-events:none}
.world:after{content:"";position:absolute;z-index:1;inset:auto 0 0;height:15%;background:linear-gradient(0deg,#081f2c8d,transparent);pointer-events:none}
.world svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.world .scene-caption{position:absolute;z-index:2;bottom:11px;left:12px;right:12px;background:#0c2e3899;border:1px solid #aecdc04b;border-radius:13px;text-align:center;padding:7px 9px;color:#fdf4d9;font-size:13px;font-weight:800;line-height:1.25;backdrop-filter:blur(4px)}
.world .scene-caption:empty{display:none}
.action-area{padding:11px 0 2px;flex:none;min-height:79px}
.action-label{color:var(--gold);font-size:13px;font-weight:800;text-align:center;margin:0 0 8px}
.primary{width:100%;height:53px;background:linear-gradient(180deg,#ffe1a3,#efbb70);border:1px solid #ffe7b7;color:#3c2e1f;border-radius:17px;font-weight:900;font-size:18px;box-shadow:0 4px 0 #8a663b,0 7px 15px #0002}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #8a663b}
.answers{display:grid;gap:9px}.answer{position:relative;min-height:54px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(145deg,#355460,#294550);border:1px solid #91bdba94;border-radius:15px;color:#fff8e8;text-align:right;padding:9px 13px;font-size:15px;font-weight:800;line-height:1.2}
.answer .mark{width:29px;min-width:29px;height:29px;display:grid;place-items:center;background:#d6e8d923;color:#dff8e8;border-radius:50%;font-size:15px}
.answer:active{transform:scale(.99)}.answer.was-wrong{border-color:#e8a99c;background:#553c42}.answer[disabled]{opacity:.65}
.hint{margin:4px 0 2px;text-align:center;color:#f9d9a3;font-size:13px;line-height:1.3;min-height:0}
.footer{height:23px;display:flex;justify-content:center;align-items:center;color:#9bb3ad;font-size:10px;flex:none}
.footer a{color:#ead18f;text-decoration:underline}
.points{position:absolute;right:15px;top:12px;z-index:4;font-weight:900;color:#ffe19b;background:#1c363fd9;padding:6px 11px;border:1px solid #f8c78c65;border-radius:20px;font-size:13px}
.burst{position:absolute;z-index:4;right:50%;top:30%;transform:translateX(50%);font-size:36px;color:#fff1b4;font-weight:900;text-shadow:0 0 22px #e7d68d;pointer-events:none;animation:pop .7s ease-out both}
@keyframes pop{0%{opacity:0;transform:translateX(50%) translateY(20px) scale(.65)}40%{opacity:1;transform:translateX(50%) translateY(-7px) scale(1.12)}100%{opacity:1;transform:translateX(50%) translateY(-12px) scale(1)}}
.case-list{display:grid;gap:9px}.case-choice{border:1px solid #b5d4c478;background:#274953;color:#fff1d8;min-height:52px;border-radius:15px;font-size:16px;font-weight:800}
.nav-note{font-size:11px;color:#b3c9c4;text-align:center;margin:7px 0 0}
@media(max-height:730px){.game{padding-top:6px;padding-bottom:6px}.meter{height:25px}.speech{min-height:84px;margin:2px 0 4px;gap:9px}.avatar{width:72px;height:86px}.talk{min-height:75px;padding:8px 10px}.talk-text{font-size:14px}.chapter{height:37px}.chapter strong{font-size:21px}.world{min-height:173px;margin-top:3px}.action-area{padding:7px 0 2px;min-height:66px}.primary{height:49px}.answer{min-height:46px}.footer{height:17px}}
@media(max-width:345px){.game{padding-left:10px;padding-right:10px}.avatar{width:72px}.brand{font-size:12px}.world{min-height:185px}.answer{font-size:13px}}
@media(min-width:530px){.game{border-inline:1px solid #e7d29b21;background:#051d2655}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>

<section class="chapter"><strong id="title">החוליה החסרה</strong><span id="subTitle">משחק של חשיבה, לא של ניחושים</span></section>
<section class="world" id="world" aria-label="זירת משחק מאוירת">

function dataForScreen(){
const c=caseInfo();const s=state.screen;const round=Number(currentRound());
const base={step:"מכירים את המשחק",talk:"",title:"החוליה החסרה",sub:"צעד אחד בכל פעם",art:s,caption:"",cta:"",label:"",question:false};
if(s==="welcome")return {...base,talk:"שלום! אני נרי. אני אעזור לך לגלות למה חכמים חולקים.",sub:"אתה לא צריך לדעת את חוקי המשחק מראש",caption:"אני איתך לאורך החקירה",cta:"המשך ←"};
if(s==="mission")return {...base,step:"המשימה",title:"מה נעשה כאן?",talk:"קודם נראה מה כל צד אומר. אחר כך נמצא את ההיגיון. בסוף אתה תפתור חידה.",sub:"דבר אחד בכל פעם",caption:"שומעים ← מבינים ← מגלים",cta:"אני מוכן להתחיל ←"};
if(s==="dispute")return {...base,step:"שלב 1 מתוך 3 · מכירים את הדעות",title:"על מה חולקים?",sub:c.tag,talk:"תסתכל על שתי הדעות. עדיין לא צריך לענות, רק להבין את ההבדל.",caption:"שתי דעות שונות",cta:"הבנתי. מה השורש? ←"};
if(s==="root")return {...base,step:"שלב 1 מתוך 3 · מבינים את הסברה",title:"למה הם חולקים?",sub:c.tag,talk:state.caseId==="pesach"?"ר׳ חיים מציע: האם צריך מעשה מסוים בחמץ, או רק לדאוג שלא יישאר?":state.caseId==="tzitzit"?"מה קובע? הבגד עצמו, או האדם שלובש אותו?":"מה חשוב יותר: שאני אנקה, או שהבית יהיה נקי?",caption:"זה ההסבר שלנו. לא עוד שאלה.",cta:"עכשיו מקרה חדש ←"};
if(s==="challenge0")return {...base,step:"חידה 1 מתוך 3 · מגלים נפקא מינה",title:"מקרה חדש!",sub:c.name+" · "+c.scenario,talk:"עכשיו תורך. מה יקרה במקרה החדש לפי ההסבר שראינו?",art:s,caption:c.scenario,question:true,round:0};
if(s==="solved0")return {...base,step:"חידה 1 מתוך 3 · הושלמה",title:"מצאת נפקא מינה!",sub:"למדת לחשוב קדימה",talk:c.success[0],art:s,caption:"מחלוקת ← סברה ← נפקא מינה",cta:"עכשיו נחשוב אחורה ←"};
if(s==="intro1")return {...base,step:"חידה 2 מתוך 3 · הולכים אחורה",title:"חסר ההסבר",sub:"יודעים את המחלוקת ואת התוצאה",talk:"הפעם מסתירים את הסברה. תוכל לגלות מה מחבר את שתי העובדות?",art:"challenge1",caption:"שתי עובדות, הסבר אחד חסר",cta:"אני מוכן לחידה ←"};
if(s==="challenge1")return {...base,step:"חידה 2 מתוך 3 · מגלים שורש",title:"מה מחבר ביניהם?",sub:"לחשוב מהתוצאה אל הסברה",talk:"מהו ההסבר המתאים לשתי העובדות שראית?",art:s,caption:"המחלוקת + התוצאה → מה הסברה?",question:true,round:1};
if(s==="solved1")return {...base,step:"חידה 2 מתוך 3 · הושלמה",title:"מצאת את השורש!",sub:"אפשר לחשוב גם אחורה",talk:c.success[1],art:s,caption:"סברה טובה מסבירה כמה עובדות",cta:"עוד חידה אחת ←"};
if(s==="intro2")return {...base,step:"חידה 3 מתוך 3 · ממשיכים אחורה",title:"חסרה המחלוקת",sub:"יודעים את הסברה ואת התוצאה",talk:"עכשיו ננסה לשחזר את הוויכוח המקורי. איזה ויכוח מתאים למה שגילינו?",art:"challenge2",caption:"מה הייתה המחלוקת?",cta:"נמצא את המחלוקת ←"};
if(s==="challenge2")return {...base,step:"חידה 3 מתוך 3 · מגלים מחלוקת",title:"מה הייתה המחלוקת?",sub:"מהתוצאה אל המקור",talk:"אתה מכיר את ההסבר ואת המקרה. בחר איזה ויכוח מתאים להם.",art:s,caption:"סברה + נפקא מינה → מחלוקת?",question:true,round:2};
if(s==="solved2")return {...base,step:"חידה 3 מתוך 3 · הושלמה",title:"כל החוליות התחברו!",sub:"מחלוקת · שורש · נפקא מינה",talk:c.success[2],art:s,caption:"חשבת קדימה וגם אחורה!",cta:"סיכום החקירה ←"};
if(s==="finish")return {...base,step:"סיימת את החקירה",title:"שלוש חוליות. רעיון אחד.",sub:"כל הכבוד!",talk:"זיהית מה אומרים, למה אפשר להסביר זאת, ומה משתנה במקרה חדש.",art:s,caption:c.caveat,cta:"בחר חקירה חדשה ←"};
if(s==="choose")return {...base,step:"בחר חקירה",title:"לאן ממשיכים?",sub:"אפשר להתחיל חקירה חדשה מההתחלה",talk:"מעולה! עכשיו בחר על מה נחקור. מתחילים שוב בהסבר פשוט.",art:"mission",caption:"בכל חקירה אני מלווה אותך",question:false};
return base;
}
function render(){
const c=caseInfo(),info=dataForScreen(),r=info.round;
ui.step.textContent=info.step;ui.talk.textContent=info.talk;ui.title.textContent=info.title;ui.sub.textContent=info.sub;
ui.art.innerHTML=picture(info.art);ui.caption.textContent=info.caption;
ui.action.textContent=info.label||"";ui.action.hidden=!info.label;
ui.score.hidden=state.screen==="welcome"||state.screen==="mission"||state.screen==="choose";
ui.score.textContent="✦ "+state.score+" נק׳";
ui.next.hidden=info.question||state.screen==="choose";ui.next.textContent=info.cta||"המשך ←";
ui.answers.hidden=!info.question;ui.cases.hidden=state.screen!=="choose";ui.hint.textContent="";
ui.avatar.classList.toggle("quiet",state.screen!=="welcome"&&state.screen!=="finish");
ui.burst.hidden=true;
ui.back.disabled=state.screen==="welcome";ui.back.style.opacity=state.screen==="welcome"?".35":"1";
Array.from(document.querySelectorAll(".track i")).forEach((bar,i)=>{let active=state.screen!=="welcome"&&state.screen!=="mission"&&state.screen!=="choose" && (r!==undefined?r>=i:(state.screen==="dispute"||state.screen==="root"?i===0:state.screen==="finish"||state.screen==="solved2"?true:state.screen==="solved0"?i===0:state.screen==="intro1"||state.screen==="solved1"?i<=1:state.screen==="intro2"?i<=2:false));bar.classList.toggle("on",active)});
ui.answers.replaceChildren();
if(info.question){
 let q=c.questions[r];
 ui.action.hidden=false;ui.action.textContent="בחר תשובה אחת";
 q.options.forEach((v,i)=>{let btn=document.createElement("button");btn.className="answer";btn.type="button";btn.dataset.answer=i;btn.innerHTML='<span>'+escaped(v)+'</span><span class="mark">'+(i+1)+'</span>';btn.addEventListener("click",()=>chooseAnswer(i,btn));ui.answers.appendChild(btn);});
}
ui.cases.replaceChildren();
if(state.screen==="choose"){
 Object.entries(cases).forEach(([key,val])=>{let b=document.createElement("button");b.type="button";b.className="case-choice";b.textContent=val.icon+" "+val.name;b.addEventListener("click",()=>{state={caseId:key,screen:"welcome",round:0,score:0,attempts:0,awards:[],wrong:[],history:[]};render();});ui.cases.appendChild(b)});
}
ui.footer.replaceChildren();const small=document.createElement("span");small.textContent="מוקאפ משחק מודרך · תוכן טיוטה";ui.footer.appendChild(small);
if(state.screen==="finish"&&c.sourceUrl){const a=document.createElement("a");a.href=c.sourceUrl;a.target="_blank";a.rel="noopener";a.textContent=" · לעיון במקור";ui.footer.appendChild(a);}
requestAnimationFrame(()=>{const main=$("game");if(main.scrollTop>3)main.scrollTo({top:0,behavior:"instant"});});
}
function chooseAnswer(index,button){
 const m=Number(currentRound()),q=caseInfo().questions[m];
 if(state.screen!=="challenge"+m)return;
 if(index!==q.correct){
  state.attempts+=1;button.classList.add("was-wrong");ui.hint.textContent="עוד לא. "+q.hint;return;
 }
 const pts=state.attempts>0?5:10;
 if(state.awards[m]===undefined){state.score+=pts;state.awards[m]=pts;}
 for(const b of ui.answers.querySelectorAll("button"))b.disabled=true;
 state.history.push(state.screen);
 state.screen="solved"+m;
 render();
 ui.burst.textContent="+"+state.awards[m];ui.burst.hidden=false;
}
function advance(){
 const idx=order.indexOf(state.screen);
 if(idx>=0&&idx<order.length-1){put(order[idx+1]);return;}
 if(state.screen==="finish"){put("choose");}
}
ui.next.addEventListener("click",advance);
ui.back.addEventListener("click",back);
render();
})();
</script>
