.head{display:flex;justify-content:space-between;align-items:center;gap:10px}

.preview{font-size:10px;letter-spacing:.2px;border:1px solid #8fa3a566;background:#dce6e71a;padding:7px 9px;border-radius:20px;color:#e1e9e5;white-space:nowrap}
.topline{display:flex;justify-content:space-between;align-items:center;margin-top:15px;font-size:12px;color:#cbd7d1}
.little-dots{display:flex;gap:6px;align-items:center;direction:ltr}.little-dots i{width:22px;height:5px;border-radius:9px;background:#56707a;display:block}.little-dots i.done{background:var(--gold)}
.title-block{text-align:center;padding:5px 0 7px}
.title-block .eyebrow{font-weight:800;color:var(--gold);font-size:12px;letter-spacing:.5px}
.title-block h1{font-size:clamp(23px,6vw,29px);line-height:1.13;margin:6px 0 6px;font-weight:900}
.title-block p{font-size:16px;line-height:1.35;margin:0;color:#e8ecdf;min-height:22px}
.scene{min-height:300px;flex:1 1 305px;max-height:415px;position:relative;overflow:hidden;border-radius:26px 26px 19px 19px;border:1px solid #70838a55;box-shadow:0 12px 32px #0005,inset 0 0 30px #0004;background:radial-gradient(ellipse at 50% 45%,#52646d 0%,#2c444e 43%,#172934 73%,#0e202a 100%)}

.arch{position:absolute;top:7%;left:5%;right:5%;height:88%;border:10px solid #60717a31;border-bottom:0;border-radius:130px 130px 0 0;box-shadow:inset 0 0 0 2px #e9d5a124}
.art{position:absolute;width:100%;height:100%;inset:0;z-index:2;overflow:visible}
.art .pulse{transition:opacity .25s,transform .25s;transform-origin:center;opacity:.12}
.scene.pick-person .pulse.person{opacity:.85}.scene.pick-object .pulse.object{opacity:.85}
.art .person-tallit{opacity:0;transform:translate(-22px,-10px);transition:transform .45s,opacity .45s}
.scene.show-clothing .person-tallit{opacity:1;transform:translate(0,0)}
.tapzone{position:absolute;z-index:4;top:24%;bottom:15%;width:39%;background:transparent;border:0;border-radius:28px}.tapzone.object{left:4%}.tapzone.person{right:4%}
.tapzone:hover{background:#ffec9910}
.scene-label{position:absolute;z-index:3;bottom:11px;padding:6px 11px;border-radius:12px;font-size:13px;font-weight:900;min-width:102px;text-align:center;backdrop-filter:blur(8px)}
.scene-label.object{left:15px;background:#623b40dc;border:1px solid #df9c8e80;color:#ffe1d9}.scene-label.person{right:15px;background:#244a5bdc;border:1px solid #8ac7d980;color:#dffaff}
.scene .clue{position:absolute;z-index:5;top:10px;right:50%;transform:translateX(50%);font-size:12px;color:#f5e9c4;background:#10252c99;padding:5px 12px;border-radius:20px;border:1px solid #f8dba84a}
.answer-section{margin-top:13px;min-height:100px}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{min-height:63px;background:linear-gradient(165deg,#31566a,#1e3c4c);color:#f9ffff;border:1px solid #7aafc38c;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:900;box-shadow:inset 0 1px #ffffff23,0 5px 10px #0002;transition:transform .1s,filter .2s}
.choice.object{background:linear-gradient(165deg,#8c545a,#54343d);border-color:#d3928e96}.choice.person{background:linear-gradient(165deg,#315d70,#21404f)}.choice:active{transform:scale(.96)}.choice:hover{filter:brightness(1.1)}.choice .pict{font-size:21px}

.result strong{display:block;font-size:21px;color:#ffd68d;margin-bottom:5px}.result p{margin:0;font-size:14px;line-height:1.4}
.next{width:100%;background:linear-gradient(180deg,#ffdda0,#eebc68);border:0;color:#3e2a18;font-size:17px;font-weight:900;border-radius:16px;padding:13px;margin-top:10px;box-shadow:0 3px 0 #a27d45}
.source{font-size:11px;color:#c6c9be;text-align:center;margin:9px 0 0}.source a{color:#f1d19a;text-decoration:underline}
.foot{border-top:1px solid #c5d4c126;margin-top:12px;padding-top:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.case-tab{color:#c5d7d6;background:transparent;border:1px solid transparent;min-height:44px;border-radius:12px;font-size:13px;font-weight:800;padding:7px 2px}
.case-tab.active{border-color:#e5bb7788;color:#ffda96;background:#c6a56c13}.case-tab span{font-size:17px;display:block;margin-bottom:2px}
.disclaimer{font-size:10px;line-height:1.3;color:#849ca0;text-align:center;margin-top:7px}
@media (max-height:760px){.shell{padding-top:10px;padding-bottom:6px}.topline{margin-top:8px}.title-block{padding:2px 0 5px}.title-block h1{margin:3px 0}.scene{min-height:250px;max-height:320px}.answer-section{margin-top:8px}.choice{min-height:52px}.foot{margin-top:7px;padding-top:6px}.case-tab{min-height:35px}.disclaimer{margin-top:3px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

  var choice=value==="object"?0:1;
  if(choice===c.nafqCorrect){step=2;feedback="";}
  else{feedback=idx===0?"האם הטלית בארון מחייבת כבר עכשיו?":idx===1?"״עלי״ אינו ״על כולם״.":"מי ניקה לא משנה את מצב הבית.";}
 }
 update();
}
byId("objectButton").addEventListener("click",function(){choose("object");});
byId("personButton").addEventListener("click",function(){choose("person");});
byId("tapObject").addEventListener("click",function(){choose("object");});
byId("tapPerson").addEventListener("click",function(){choose("person");});
document.querySelectorAll(".case-tab").forEach(function(b){b.addEventListener("click",function(){select(Number(b.getAttribute("data-case")));});});
update();
})();
</script>
