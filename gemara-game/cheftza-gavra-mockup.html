<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102630">
<meta name="description" content="מוקאפ אינטראקטיבי של חפצא וגברא: מתחילים מסיפור בסדנת אבות ובנים, ומגלים את הסברה ואת הנפקא מינה.">
<title>שלוש חקירות למדניות | גמרא גיים</title>
<style>
:root{font-family:Arial,"Noto Sans Hebrew",sans-serif;color:#fff8e9;background:#102630;--gold:#ffcf7d;--sea:#9de5df;--ink:#16313d}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#2e515d,#102630 65%);min-height:100svh}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:3px solid #ffe3aa;outline-offset:3px}
.app{width:min(100%,520px);height:100svh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 11px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.top{height:40px;flex:0 0 40px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-weight:900;font-size:17px;display:flex;align-items:center;gap:9px}
.mark{display:grid;place-items:center;width:33px;height:33px;background:var(--gold);color:#372c20;border-radius:10px;font:900 23px Georgia}
.counter{font-size:13px;color:#c9d9d4;font-weight:700;white-space:nowrap}
.progress{height:5px;flex:0 0 5px;border-radius:12px;background:#43636b;overflow:hidden}
.progress span{display:block;height:100%;width:20%;background:linear-gradient(90deg,#ffe1a5,#f5b65f);border-radius:12px;transition:width .3s}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:27px;border:1px solid #759da07a;background:#325661;isolation:isolate;box-shadow:0 10px 30px #0006}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(180deg,#0c243b99 0%,transparent 23%,transparent 59%,#0a202aba 100%)}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#workshop,#morning{transition:opacity .55s ease;transform-origin:50% 50%}
#morning{opacity:0}
.stage.mode-morning #workshop{opacity:0}
.stage.mode-morning #morning{opacity:1}
#garment,#father,#son,#morningSon,#morningGarment{transition:opacity .35s,filter .35s,transform .35s}
#focusGarment,#focusSon,#focusMorning{opacity:0;transition:opacity .3s}
.stage.focus-cloth #focusGarment,.stage.focus-person #focusSon,.stage.focus-morning #focusMorning{opacity:1}
.stage.focus-cloth #son{opacity:.3}.stage.focus-cloth #father{opacity:.45}
.stage.focus-person #father{opacity:.32}
.stage.focus-person #garment{opacity:.42}
.stage.focus-cloth #garment{filter:drop-shadow(0 0 12px #ffdda4);transform:scale(1.08);transform-origin:230px 450px}
.stage.focus-person #son{filter:drop-shadow(0 0 12px #a7f5ee);transform:scale(1.04);transform-origin:313px 350px}
#morningGarment{opacity:0;transform-origin:210px 385px;transition:opacity .5s}
.stage.show-wearing #morningGarment{opacity:1}
.scene-title{position:absolute;z-index:5;top:79px;left:18px;right:18px;pointer-events:none;text-align:center;text-shadow:0 3px 13px #001b25,0 1px 4px #001a24;background:radial-gradient(ellipse at center,#092a397d 0%,transparent 78%);padding:8px 0 18px}
.scene-title small{display:block;color:#ffe0a8;font-size:12px;font-weight:900;margin-bottom:6px}
.scene-title h1{font-size:clamp(25px,7.5vw,34px);line-height:1.15;margin:0;font-weight:900}
.scene-title p{font-size:14px;line-height:1.35;color:#e4efea;margin:8px 0 0}
.scene-title[hidden]{display:none}
.focus-caption{position:absolute;z-index:6;top:50%;right:50%;transform:translate(50%,0);background:#f9edcd;color:#223e45;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:900;max-width:80%;text-align:center;box-shadow:0 8px 23px #031a2666;pointer-events:none}
.focus-caption[hidden]{display:none}
.hud{position:absolute;z-index:7;bottom:0;left:0;right:0;padding:40px 15px 17px;display:flex;flex-direction:column;gap:12px;align-items:stretch;background:linear-gradient(0deg,#0e2733 15%,#0e2733fa 55%,transparent);text-align:center}
.hud[hidden]{display:none}
.hud-question{font-size:16px;font-weight:900;color:#ffdfa0;line-height:1.35;text-shadow:0 2px 9px #061b28}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:78px;background:#fff2d8;color:#233c43;border:0;border-radius:20px;font-size:16px;font-weight:900;padding:11px 8px;box-shadow:0 4px 0 #d1ad77;display:flex;align-items:center;justify-content:center;gap:4px;flex-direction:column;transition:transform .13s,background .13s}
.opt .ico{font-size:25px}.opt:active{transform:translateY(2px);box-shadow:0 2px 0 #d1ad77}
.opt.aqua{background:#d7f2ee;box-shadow:0 4px 0 #76b9b7}
.opt.selected{outline:3px solid #ffe09a}
.opt small{font-size:12px;opacity:.76;font-weight:700}
.action{border:0;color:#2f3027;background:linear-gradient(#ffe2a7,#f1c16f);font-size:17px;font-weight:900;padding:13px 15px;border-radius:999px;min-height:51px;box-shadow:0 4px 0 #b18142}
.action:active{transform:translateY(2px);box-shadow:0 2px 0 #b18142}
.note{font-size:14px;color:#eef8f2;line-height:1.45;font-weight:700;text-shadow:0 2px 7px #132e39}
.note strong{color:#ffde9d}
.note.warn{color:#ffdccd}
.story-backdrop{position:absolute;z-index:8;inset:0;background:#071c264d;opacity:0;pointer-events:none;transition:opacity .3s}
.story-backdrop.show{opacity:1;pointer-events:auto}
.story-cloud{position:absolute;z-index:9;top:auto;bottom:5%;right:6%;left:6%;background:#fff0d4;color:#243943;border-radius:33px 33px 33px 11px;padding:22px 22px 20px;box-shadow:0 20px 50px #001a2e8c;transition:top .48s,bottom .48s,right .48s,left .48s,width .48s,padding .48s,border-radius .48s,box-shadow .48s;background-clip:padding-box}
.story-cloud:after{content:"";position:absolute;right:32px;bottom:-15px;border-top:19px solid #fff0d4;border-left:23px solid transparent;pointer-events:none}
.story-cloud h2{font-size:24px;margin:0 0 9px;line-height:1.2}
.story-cloud p{font-size:17px;line-height:1.5;margin:0 0 17px}
.story-cloud .story-overline{font-size:12px;font-weight:900;color:#8a5c29;margin-bottom:7px;letter-spacing:.15px}
.story-cloud strong{color:#8d5727}
.story-cloud .action{width:100%}
.story-cloud.mini{top:15px;bottom:auto;right:13px;left:auto;width:112px;border-radius:100px;padding:0;box-shadow:0 5px 17px #09233299}
.story-cloud.mini:after{display:none}
.story-cloud.mini .story-content{display:none}
.story-mini{display:none}
.story-cloud.mini .story-mini{display:flex;align-items:center;justify-content:center;width:100%;min-height:42px;gap:5px;border:0;background:transparent;color:#263b45;border-radius:100px;font-size:13px;font-weight:900;padding:6px}
.story-mini .mini-photo{width:28px;height:28px;border-radius:50%;background:linear-gradient(120deg,#ce9a5c,#6c9eb0);display:grid;place-items:center;font-size:15px}
.paper{position:absolute;z-index:6;right:7%;left:7%;top:29%;background:linear-gradient(175deg,#f7e9cc,#ead4ad);border-radius:15px 15px 32px 32px;color:#253b41;padding:25px 19px;text-align:center;box-shadow:0 15px 30px #081b2677,0 0 0 5px #dfc18b55;border-top:5px solid #8f6140}
.paper[hidden]{display:none}
.paper .verse{font:900 clamp(17px,5vw,22px)/1.62 Georgia,serif;color:#523929;margin:14px 0}
.paper .paper-label{font-weight:900;font-size:12px;color:#825b36}
.paper p{font-size:15px;line-height:1.55;margin:7px 0}
.paper a{color:#254a78;font-weight:900}
@media(max-height:750px){.app{padding-top:6px;padding-bottom:7px;gap:6px}.top{height:36px;flex-basis:36px}.scene-title{top:70px}.scene-title h1{font-size:27px}.scene-title p{margin-top:4px}.story-cloud{bottom:4%;padding:15px 17px}.story-cloud h2{font-size:22px}.story-cloud p{font-size:15px;line-height:1.42;margin-bottom:12px}.story-cloud .action{min-height:43px}.hud{padding:25px 13px 11px;gap:9px}.opt{min-height:65px;padding:7px}.action{min-height:44px;padding:9px}.paper{top:24%;padding:15px}}
@media(max-height:590px){.story-cloud{bottom:3%}.scene-title{top:53px}.scene-title h1{font-size:23px}.scene-title p{font-size:12px}.hud{padding-top:18px}.opt{min-height:52px}.opt .ico{font-size:21px}.story-cloud p{font-size:13px}.paper{top:17%}}
@media(min-width:700px){.app{padding-top:14px;padding-bottom:14px}.stage{max-height:850px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

/* Three linked learning investigations. One visible action plane at a time. */
.stage svg#nederScene,.stage svg#candleScene{opacity:0;pointer-events:none;transition:opacity .35s}
.stage.scene-neder>svg:not(#nederScene),.stage.scene-candle>svg:not(#candleScene){opacity:0;pointer-events:none}
.stage.scene-neder svg#nederScene,.stage.scene-candle svg#candleScene{opacity:1}
.stage.neder-object #nederObjectGlow{opacity:.95!important}
.stage.neder-person #nederPersonGlow{opacity:1!important}
.stage.neder-object #nederBoyOne,.stage.neder-object #nederBoyTwo{opacity:.47}
.stage.neder-person #sukkahRoof{opacity:.55}
.stage.candle-light #candleLightGlow{opacity:1!important}
.stage.candle-place #candlePlaceGlow{opacity:.95!important}
.stage.candle-place #hanukiah{opacity:.48}
.stage.candle-light #hanukiah{filter:drop-shadow(0 0 13px #f4d48d)}
.stage .challenge-hint{max-width:410px;margin:auto;color:#fff0dc;font-size:14px;line-height:1.4;font-weight:800}
.stage .challenge-hint.error{color:#ffbcae}
.stage .challenge-hint.win{color:#a7f4dd}
.scene-title h1{font-size:clamp(25px,7vw,32px)}
.scene-title p{font-size:14px;line-height:1.35}
.options.triple{grid-template-columns:1fr}
.options.triple .opt{min-height:50px;flex-direction:row;justify-content:flex-start;padding:8px 16px;text-align:right;gap:9px}
.options.triple .ico{font-size:23px;flex-shrink:0}
.options.triple .opt small{font-size:12px}
.levelname{color:#ffe2a8;letter-spacing:.1px}
.hud .mini-next{margin-top:2px}
.paper .paper-label{line-height:1.4}
.paper .verse{margin:10px 0;font-size:clamp(17px,4.5vw,20px)}
.paper p{font-size:14px;line-height:1.45}
.paper small{display:block;font-size:11px;color:#4a5555;margin-top:8px}
.story-cloud p{font-size:16px}
@media(max-height:750px){.paper{top:17%}.options.triple .opt{min-height:45px}.scene-title h1{font-size:25px}.scene-title p{font-size:12px}.hud .challenge-hint{font-size:12px}}

</style>
</head>

<script>
(function(){

const D=[

  storyTime:"ערב · סדנת אבות ובנים",storyTitle:"הציצית של יוסי",
  story:"יוסי ואבא שלו יושבים בסדנה וקושרים ציציות לבגד חדש. יוסי מחייך: ״מחר אלבש אותו לבית הספר ואראה לחברים!״ אבל אבא שואל: ״מתי נברך? עכשיו, בסיום הקשירה, או מחר כשילבש?״",
  sourceText:"הגמרא מציעה שתי תפיסות שונות: אם המצווה נתפסת כחובת הטלית, יש מקום לברך עם השלמת עשיית הציצית; אם זו חובת האדם, קיום המצווה בלבישה.",
  verdict:"להלכה: מברכים בשעת הלבישה ולא בזמן קשירת החוטים.",
  caveat:"מקרה לימודי, לא הוראה מעשית לברכה בנסיבות חריגות.",stages:5},
 {name:"נדר או שבועה?",level:"★★ מתקדמים",source:"נדרים ט״ז ע״ב",verse:"הא דאמר ישיבת סוכה עלי, הא דאמר שלא אשב בסוכה",link:"https://he.wikisource.org/wiki/נדרים_טז_ב",
  storyTime:"ערב סוכות · אחרי בניית הסוכה",storyTitle:"שני משפטים, דין שונה",
  story:"יואב ורוני מתווכחים כשהסוכה כמעט מוכנה. יואב אומר בכעס: ״ישיבת הסוכה הזאת עליי בקונם״. רוני אומר: ״אני נשבע שלא אשב בסוכה״. הם חושבים שאמרו אותו דבר. באמת?",
  sourceText:"הנדר אוסר על האדם את ישיבת הסוכה, ואילו השבועה מכוונת אל האדם ופעולתו. כשמתנגשים בחיוב מצווה, ההבדל נעשה משמעותי.",
  verdict:"הנדר עשוי לחול גם על דבר מצווה; שבועה לבטל את המצווה אינה חלה באופן זה.",
  caveat:"התרחיש לימודי בלבד. אין לנדור או להישבע בניסוי; במקרה של נדר ממשי יש לפנות לרב.",stages:6},
 {name:"מה עושה את המצווה?",level:"★★★ אתגר",source:"שבת כ״ב–כ״ג",verse:"מדקא מברכינן ... להדליק נר של חנוכה, שמע מינה הדלקה עושה מצוה",link:"https://he.wikisource.org/wiki/שבת_כג_א",
  storyTime:"חנוכה · רגע אחרי הדלקת הנרות",storyTitle:"החנוכייה שעברה מקום",
  story:"נועם הדליק את החנוכייה על שולחן בחדר, לא במקום שבו היא אמורה לעמוד למצווה. אחר כך העביר אותה, כשהיא דולקת, למקומה ליד החלון. האם ההעברה תיקנה את ההדלקה?",
  sourceText:"הגמרא בודקת אם ההדלקה עצמה היא מעשה המצווה או הנחת הנר. היא גם מזהירה: לפעמים מקרה נכשל מסיבה נוספת, ולכן אינו מכריע בין שתי הסברות.",
  verdict:"למסקנה, הדלקה עושה מצווה; הדלקת הנר צריכה להיות במקום הראוי כבר בשעת ההדלקה.",
  caveat:"זהו מודל של הדיון התלמודי; מקום ההדלקה ודיני חנוכה בפועל תלויים בפרטי המקרה.",stages:6}
];
const E=id=>document.getElementById(id);
let ci=0,step=0,storyOpen=true,lens="",seen={cloth:false,person:false},feedback="",correct=false,selected="",attempts=0,solved=0;
const escapeText=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
const opt=(icon,title,action,detail="",extra="")=>'<button type="button" class="opt '+extra+'" data-action="'+action+'"><span class="ico">'+icon+'</span><span>'+title+(detail?'<small>'+detail+'</small>':'')+'</span></button>';
const options=(items,stack=false)=>'<div class="options '+(stack?'triple':'')+'">'+items.join("")+'</div>';
const button=(s,action)=>'<button type="button" class="action mini-next" data-action="'+action+'">'+s+'</button>';
const message=()=>feedback?'<div class="challenge-hint '+(correct?'win':'error')+'">'+escapeText(feedback)+'</div>':"";
const solvedNext=(s,action)=>correct?message()+button(s,action):message();
const view=(ey,heading,sub,html)=>{E("eyebrow").textContent=ey;E("heading").textContent=heading;E("subheading").textContent=sub;E("hud").innerHTML=html;};
function showStory(open){storyOpen=open;E("storyCloud").classList.toggle("mini",!open);E("backdrop").classList.toggle("show",open);}
function render(){
 const d=D[ci],scene=E("stage");
 E("storyEyebrow").textContent=d.storyTime;
 E("storyHeading").textContent=d.storyTitle;
 E("storyBody").textContent=d.story;
 E("counter").textContent="חקירה "+(ci+1)+"/3 · שלב "+(step+1)+"/"+d.stages;
 E("fill").style.width=((step+1)/d.stages*100)+"%";
 showStory(storyOpen);
 E("title").hidden=step===0||storyOpen;
 E("hud").hidden=step===0||storyOpen;
 E("paper").hidden=(step!==d.stages-1)||storyOpen;
 E("focusCaption").hidden=true;
 const sceneBase=ci===0?(step>=3?" mode-morning":"")+(step===4?" show-wearing":"")+(step===2&&lens==="cloth"?" focus-cloth":step===2&&lens==="person"?" focus-person":step===3?" focus-morning":""):
 ci===1?" scene-neder"+(step===1?" neder-object":step===2?" neder-person":""):
 " scene-candle"+(step===1?" candle-light":step===2||step===3?" candle-place":step===4?" candle-light":"");
 scene.className="stage"+sceneBase;
 if(ci===0)renderTzitzit();
 else if(ci===1)renderNeder();
 else renderHanukkah();
 if(step===d.stages-1){
   E("paperLabel").textContent=d.source;
   E("paperVerse").textContent="״"+d.verse+"״";
   E("paperText").textContent=d.sourceText;
   E("paperVerdict").textContent=d.verdict;
   E("paperCaveat").textContent=d.caveat;
   E("paperLink").href=d.link;
 }
 if(ci===0&&step===2&&lens){
   E("focusCaption").hidden=storyOpen;
   E("focusCaption").textContent=lens==="cloth"?"מתמקדים בבגד":"מתמקדים ביוסי";
   E("focusCaption").style.top=lens==="cloth"?"60%":"50%";
   E("focusCaption").style.right=lens==="cloth"?"50%":"24%";
 }
}
function renderTzitzit(){
 if(step===0)return;
 if(step===1)view(D[0].level,"מתי יוסי יברך?","הלילה הוא קושר. מחר הוא לובש.",
  '<div class="hud-question">בחרו את ההשערה שלכם</div>'+options([opt("🌙","בסיום הקשירה","t-guess-cloth","הלילה"),opt("☀️","בשעת הלבישה","t-guess-person","מחר בבוקר","aqua")]));
 else if(step===2){
  const explanation=lens==="cloth"?"<strong>חובת טלית:</strong> הדגש בבגד המוכן עם הציציות. לכן ייתכן שהשלמת הקשירה היא גמר המצווה.":lens==="person"?"<strong>חובת גברא:</strong> הכנת הבגד היא רק תנאי מוקדם. המצווה מתקיימת במעשה הלבישה.":"על מי מסתכלים כדי להסביר את רגע הברכה?";
  view(D[0].level,"מה עומד במרכז?","געו בכל צד כדי לגלות שתי סברות.",
   '<div class="note">'+explanation+'</div>'+options([opt("🧵","הבגד","t-lens-cloth","",""+(lens==="cloth"?"selected":"")),opt("👦","יוסי","t-lens-person","","aqua "+(lens==="person"?"selected":""))])+
  (seen.cloth&&seen.person?button("בואו נבדוק את הסברה ←","t-test"):""));
 } else if(step===3)view("נפקא מינה · "+D[0].level,"אם החיוב הוא על האדם...","איזה רגע נחשב לגמר המצווה לפי הבנה זו?",
  correct?message()+button("בואו נקרא את הגמרא ←","to-source"):
  '<div class="hud-question">בחרו מתוך הסברה, לא מתוך ניחוש</div>'+options([opt("🌙","קשירת הציציות","t-answer-wrong"),opt("☀️","לבישת הבגד","t-answer-right","","aqua")])+message());
 else view("המקור · "+D[0].level,"זו חקירה למדנית!","נקודת החילוק יוצרת רגע שונה של ברכה.",button("לחקירה השנייה: נדר ושבועה ←","next-case"));
}
function renderNeder(){
 if(step===0)return;
 if(step===1)view(D[1].level,"המשפט של יואב","״ישיבת הסוכה הזאת עליי בקונם״",correct?message()+button("עכשיו נבדוק את רוני ←","n-step2"):
 '<div class="hud-question">על מה מופנה האיסור?</div>'+options([opt("🏠","הישיבה בסוכה נאסרת עליו","n-right1"),opt("👦","יואב נשבע לא לבצע פעולה","n-wrong1","","aqua")])+message());
 else if(step===2)view(D[1].level,"המשפט של רוני","״שבועה שלא אשב בסוכה״",correct?message()+button("חפשו מקרה מבחין ←","n-step3"):
 '<div class="hud-question">מה השבועה אוסרת?</div>'+options([opt("👦","על רוני להימנע ממעשה","n-right2"),opt("🏠","הסוכה עצמה נאסרת","n-wrong2","","aqua")])+message());
 else if(step===3)view("חיפוש נפקא מינה · "+D[1].level,"מה נחליף בניסוי?","אתם מחליטים באיזה מקרה לבחון את ההבדל.",correct?message()+button("נבדוק מה הדין ←","n-step4"):
 '<div class="hud-question">איזו אפשרות תחשוף הבדל?</div>'+options([opt("🍪","עוגייה רגילה","n-wrong3","שני ניסוחים על אכילה"),opt("🌿","מצווה שחייבים לקיים","n-right3","כמו ישיבה בסוכה","aqua")])+message());
 else if(step===4)view("הכרעה · "+D[1].level,"אז מה יקרה בסוכה?","נדר ושבועה נפגשים עם חיוב מצווה.",correct?message()+button("לגלות את המקור ←","to-source"):
 '<div class="hud-question">איזו תוצאה נובעת מן הסברות?</div>'+options([opt("⚖️","נדר יכול לחול, שבועה לבטל מצווה אינה חלה","n-right4"),opt("🔁","אין שום הבדל בין הדינים","n-wrong4","","aqua")])+message());
 else view("המקור · "+D[1].level,"עכשיו מבינים את ההבדל","חפצא וגברא אינם רק שמות; הם מסבירים דין שונה.",button("לחקירה השלישית: חנוכה ←","next-case"));
}
function renderHanukkah(){
 if(step===0)return;
 if(step===1)view(D[2].level,"מהי המצווה?","הדלקת הנר, או הנחתו במקום הנכון?",
 '<div class="hud-question">בחרו השערה כדי להתחיל לחקור</div>'+options([opt("🔥","הדלקה עושה מצווה","h-guess-light"),opt("🪟","הנחה עושה מצווה","h-guess-place","","aqua")]));
 else if(step===2)view("בדיקת ראיה · "+D[2].level,"הדליק בפנים והוציא","הוא לא יצא ידי חובה. האם זה מכריע ביניהן?",
 correct?message()+button("מה הסיבה הנוספת? ←","h-step3"):
 '<div class="hud-question">האם זו ראיה מכרעת?</div>'+options([opt("✅","כן, זה מוכיח שרק ההדלקה קובעת","h-wrong2"),opt("🧐","לא בהכרח; אולי יש סיבה אחרת","h-right2","","aqua")])+message());
 else if(step===3)view("חוקרים לעומק · "+D[2].level,"מה עוד עלול להסביר?","למה גם לפי ״הנחה״ המקרה עלול להיכשל?",
 correct?message()+button("חפשו ניסוי טוב יותר ←","h-step4"):
 '<div class="hud-question">מה מפריע לנו להכריע?</div>'+options([opt("👁️","הרואה חושב שהדליק לצורכו","h-right3"),opt("🛢️","אין מספיק שמן לנר","h-wrong3","","aqua")])+message());
 else if(step===4)view("אתגר · "+D[2].level,"מצא ראיה טובה יותר","בחרו מצב שבו שתי הסברות מנבאות פעולות שונות.",
 correct?message()+button("עכשיו הגמרא מכריעה ←","to-source"):
 '<div class="hud-question">איזה ניסוי מבדיל באמת?</div>'+options([opt("🕯️","נר דלק כל היום; כיבו והדליקו שוב במקומו","h-right4"),opt("↔️","העבירו נר דולק מחדר לחדר","h-wrong4","","aqua")])+message());
 else view("המקור · "+D[2].level,"זאת חשיבה של גמרא","כאן גילינו שגם לנפקא מינה צריך ביקורת.",button("סיימנו! למסע חדש ↻","restart"));
}
function solve(ok,yes,no){
 attempts++;
 if(ok){correct=true;feedback=yes;solved++;}else{correct=false;feedback=no;}
 render();
}
function advance(n){step=n;feedback="";correct=false;attempts=0;lens="";render();}
function nextCase(){
 if(ci<2){ci++;step=0;storyOpen=true;lens="";feedback="";correct=false;seen={cloth:false,person:false};}
 else restart();render();
}
function restart(){ci=0;step=0;storyOpen=true;lens="";seen={cloth:false,person:false};feedback="";correct=false;attempts=0;solved=0;selected="";}
function choose(action){
 switch(action){
 case "t-guess-cloth":case "t-guess-person": selected=action;advance(2);return;
 case "t-lens-cloth":case "t-lens-person":lens=action==="t-lens-cloth"?"cloth":"person";seen[lens]=true;render();return;
 case "t-test":advance(3);return;
 case "t-answer-wrong":solve(false,"","אם האדם חייב, מהו המעשה שהאדם צריך לעשות?");return;
 case "t-answer-right":solve(true,"הסברה הובילה אותך למסקנה: הלבישה קובעת.","");return;
 case "n-right1":solve(true,"נכון: בנדר האיסור חל על הדבר כלפי האדם.","");return;
 case "n-wrong1":solve(false,"","שימו לב: יואב אמר ״עלי בקונם״, לא ״אני נשבע שלא״.");return;
 case "n-right2":solve(true,"נכון: השבועה מכוונת את האדם שלא לפעול.","");return;
 case "n-wrong2":solve(false,"","רוני דיבר על הפעולה שהוא עצמו לא יעשה.");return;
 case "n-right3":solve(true,"מצאת נקודת מבחן: התנגשות בין איסור למצווה.","");return;
 case "n-wrong3":solve(false,"","במקרה רגיל שתי הדרכים יכולות לאסור; חפשו מצב שיבדיל ביניהן.");return;
 case "n-right4":solve(true,"בדיוק: המבנה השונה של האיסור משנה את הדין כשיש מצווה.","");return;
 case "n-wrong4":solve(false,"","חזרו לסברה: האם אדם יכול לאסור על עצמו דבר מצווה באותה דרך שהוא נשבע להימנע מפעולה?");return;
 case "h-guess-light":case "h-guess-place":selected=action;advance(2);return;
 case "h-right2":solve(true,"מצוין: תוצאה זהה לא תמיד מכריעה, אם יש הסבר נוסף.","");return;
 case "h-wrong2":solve(false,"","המקרה יכול להיכשל אפילו אם ההנחה היא המצווה. למה הרואה עלול לחשוב שהדליק?");return;
 case "h-right3":solve(true,"יפה: הגמרא מעלה אפשרות שיחשבו שהנר הודלק לצרכים אישיים.","");return;
 case "h-wrong3":solve(false,"","נסו לחשוב כיצד המעשה נראה לאדם מבחוץ, לא כמה זמן הנר יכול לדלוק.");return;
 case "h-right4":solve(true,"זה הניסוי החזק: אם הדלקה העיקר, די לכבות ולהדליק; אם הנחה העיקר, צריך הנחה חדשה.","");return;
 case "h-wrong4":solve(false,"","כבר ראינו שלהעברת נר דולק יש הסבר נוסף שמפריע להכריע.");return;
 case "n-step2":advance(2);return;case "n-step3":advance(3);return;case "n-step4":advance(4);return;
 case "h-step3":advance(3);return;case "h-step4":advance(4);return;
 case "to-source":advance(D[ci].stages-1);return;
 case "next-case":nextCase();return;
 case "restart":restart();render();return;
 }
}
E("closeStory").addEventListener("click",function(){storyOpen=false;if(step===0)step=1;render()});
E("openStory").addEventListener("click",function(){storyOpen=true;render()});
E("backdrop").addEventListener("click",function(){if(step>0){storyOpen=false;render()}});
E("hud").addEventListener("click",function(ev){const el=ev.target.closest("button[data-action]");if(el)choose(el.getAttribute("data-action"))});
render();
})();</script>
</body></html>
