<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>מפת עולמות הגמרא | גמרא גיים</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;color:#f3f0e8;background:#101a2d}header{padding:24px max(16px,4vw);background:linear-gradient(135deg,#243857,#122336)}h1{margin:8px 0;font-size:clamp(26px,4vw,40px)}p{line-height:1.6;color:#bbceda}a{color:#ffc46c}.layout{display:grid;grid-template-columns: minmax(0,1fr) minmax(290px,370px);gap:20px;margin:24px auto;max-width:1330px;padding:0 16px}#worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}button.world{color:inherit;font:inherit;text-align:right;background:#21344b;border:1px solid #3a5670;border-radius:17px;padding:17px;cursor:pointer;min-height:125px}button.world[aria-pressed="true"]{background:#32475e;border-color:#f4c36b;box-shadow:0 0 0 2px #f4c36b30}.emoji{font-size:32px;display:block;margin-bottom:10px}.world strong{font-size:18px}.world small{display:block;color:#b6c4d1;margin-top:9px}aside{background:#1a2a40;border:1px solid #34485e;border-radius:20px;padding:22px;position:sticky;top:10px;align-self:start}aside h2{margin:6px 0;font-size:24px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 22px}.chip{background:#324358;border-radius:100px;padding:8px 11px;font-size:14px}.source{padding:14px;background:#253b50;border-radius:14px;margin:9px 0}.source b{display:block}.source small{color:#adbed2}.meta{font-size:13px;color:#b9c7d3}.warning{color:#ffd18e;background:#3a3022;border-radius:10px;padding:11px 13px;font-size:14px}select,input{font:inherit;background:#20354c;color:white;border:1px solid #567089;border-radius:10px;padding:12px;min-width:0}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.hidden{display:none}@media(max-width:760px){.layout{display:block}aside{position:static;margin-top:20px}.world{min-height:100px!important}header{padding:18px}}</style>
</head><body><header><div><a href="./index.html">← חזרה למרכז הפיתוח</a></div><h1>🗺️ מפת עולמות הגמרא</h1><p>מהסוגיה אל המקום, המקרה והמשחקון. זוהי מפת תכנון; אין כאן טענה שכבר נבדקו כל דפי הש״ס.</p><div class="filters"><input id="q" type="search" placeholder="חיפוש עולם, מסכת או נושא…" aria-label="חיפוש"><select id="seder" aria-label="סדר"><option value="">כל הסדרים</option></select></div></header>
<div class="layout"><main><div id="count" class="meta"></div><div id="worlds"></div></main><aside id="detail" aria-live="polite"><h2>בחרו עולם</h2><p>לחיצה על מקום תציג את הנושאים והמסכתות המקושרים אליו ואת סוג המשחק המתאים.</p></aside></div>
<script>
let atlas;let chosen='hub';const W=document.getElementById('worlds'),D=document.getElementById('detail'),Q=document.getElementById('q'),S=document.getElementById('seder');
function h(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function list(parent,items){const e=h('div','chips');for(const item of items)e.append(h('span','chip',item));parent.append(e)}
function show(w){chosen=w.id;document.querySelectorAll('.world').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===w.id?'true':'false'));D.replaceChildren(h('h2','',w.icon+' '+w.title),h('p','',w.summary),h('div','warning','מצב הנכסים: '+w.assetState+' | סצנת Unity מאומתת: לא'));D.append(h('h3','','נושאים'));list(D,w.topicIds.map(id=>atlas.topics.find(t=>t.id===id)?.title||id));D.append(h('h3','','מסכתות קשורות'));list(D,atlas.tractates.filter(t=>t.worldIds.includes(w.id)).map(t=>t.he));D.append(h('h3','','סוגי משחקונים'));list(D,w.mechanics);const examples=atlas.examples.filter(e=>e.worldIds.includes(w.id));if(examples.length){D.append(h('h3','','דוגמאות מסומנות'));for(const e of examples){const c=h('div','source');c.append(h('b','',e.he+' | '+e.title),h('small','',e.learningQuestion));const a=h('a','','פתח מקור בספריא ↗');a.href='https://www.sefaria.org/'+encodeURIComponent(e.ref);a.target='_blank';a.rel='noopener noreferrer';c.append(h('div','',null),a);D.append(c)}}D.append(h('p','meta','המסכתות משויכות לפי נושאים כלליים בלבד. כל סוגיה צריכה התאמת דף ומקור וביקורת תורנית לפני פרסום.'))}
function render(){const query=Q.value.trim().toLocaleLowerCase(),s=S.value;W.replaceChildren();let shown=0;for(const w of atlas.worlds){const related=atlas.tractates.filter(t=>t.worldIds.includes(w.id));if(s&&!related.some(t=>t.seder===s))continue;const text=[w.title,w.summary,...w.topicIds.map(id=>atlas.topics.find(t=>t.id===id)?.title||''),...related.map(t=>t.he)].join(' ').toLocaleLowerCase();if(query&&!text.includes(query))continue;shown++;const b=h('button','world');b.type='button';b.dataset.id=w.id;b.setAttribute('aria-pressed',w.id===chosen?'true':'false');b.append(h('span','emoji',w.icon),h('strong','',w.title),h('small','',related.length+' מסכתות מקושרות'));b.addEventListener('click',()=>show(w));W.append(b)}document.getElementById('count').textContent=shown+' עולמות מוצגים מתוך '+atlas.worlds.length;if(!shown)W.append(h('p','','אין עולמות תואמים לחיפוש.'))}
fetch('./world-atlas-v1.json').then(r=>{if(!r.ok)throw Error('Atlas unavailable');return r.json()}).then(a=>{atlas=a;for(const k of [...new Set(a.tractates.map(t=>t.seder))]){const option=h('option','',k);option.value=k;S.append(option)}render();show(a.worlds[0]);Q.addEventListener('input',render);S.addEventListener('change',render)}).catch(e=>{D.replaceChildren(h('p','warning','טעינת מפת העולמות נכשלה: '+e.message))});
</script></body></html>
