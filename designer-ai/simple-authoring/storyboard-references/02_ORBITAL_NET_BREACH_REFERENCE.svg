<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
<defs><style>.t{font-family:Arial,sans-serif;fill:#eef6ff}.m{font-family:Arial,sans-serif;fill:#9fb8c8}.c{font-family:Arial,sans-serif;fill:#43c6f5}.g{font-family:Arial,sans-serif;fill:#78d494}.a{font-family:Arial,sans-serif;fill:#f6b13b}.p{fill:#0b2032;stroke:#2e6f91;stroke-width:2}.h{fill:#081826}.sky{fill:#86bddc}</style><g id="city"><rect x="0" y="72" width="26" height="58" fill="#17344a"/><rect x="30" y="48" width="22" height="82" fill="#244b61"/><rect x="56" y="30" width="31" height="100" fill="#2b5870"/><rect x="91" y="64" width="22" height="66" fill="#17344a"/><rect x="117" y="38" width="19" height="92" fill="#244b61"/><rect x="140" y="16" width="34" height="114" fill="#2b5870"/><rect x="178" y="58" width="25" height="72" fill="#17344a"/><rect x="207" y="34" width="25" height="96" fill="#244b61"/></g><g id="person"><circle cx="0" cy="-16" r="5" fill="#c89772"/><rect x="-5" y="-10" width="10" height="15" rx="2" fill="#50697b"/><path d="M-3 5l-3 11M3 5l3 11" stroke="#15222c" stroke-width="2"/></g><g id="enemy"><path d="M40 0L10-13-34-9-45 0-34 9 10 13Z" fill="#596976" stroke="#0a151d" stroke-width="2"/></g><g id="radar"><rect width="210" height="126" rx="4" fill="#102c40" stroke="#4d91ad" stroke-width="2"/><circle cx="105" cy="63" r="48" fill="none" stroke="#3c7895"/><circle cx="105" cy="63" r="30" fill="none" stroke="#3c7895"/><path d="M20 63h170M105 14v98" stroke="#315e76"/><circle cx="58" cy="38" r="4" fill="#ef675e"/><circle cx="130" cy="73" r="4" fill="#ef675e"/><circle cx="159" cy="42" r="4" fill="#ef675e"/><circle cx="93" cy="92" r="4" fill="#ef675e"/></g></defs>
<rect width="1600" height="1000" fill="#071421"/><rect x="14" y="14" width="1572" height="88" rx="10" class="h" stroke="#2e6f91" stroke-width="2"/><text x="38" y="52" class="t" font-size="29" font-weight="900">STARWARS_DELTA</text><text x="38" y="80" class="a" font-size="20" font-weight="900">ORBITAL NET BREACH</text><text x="520" y="52" class="c" font-size="21" font-weight="800">2D STORYBOARD REFERENCE</text><text x="520" y="80" class="m" font-size="14">Anomaly → distant fleet → public reaction → command escalation → recon</text>
<g transform="translate(14 122)"><rect width="500" height="338" rx="8" class="p"/><rect width="500" height="34" rx="8" class="h"/><text x="12" y="24" class="t" font-size="17" font-weight="800">01 · NETWORK NOMINAL</text><text x="486" y="24" class="g" font-size="12" text-anchor="end">WIDE INTERIOR / HOLD</text><rect x="10" y="46" width="480" height="230" fill="#102431"/><g transform="translate(145 86)"><use href="#radar"/></g><g transform="translate(80 263) scale(.75)"><use href="#person"/></g><g transform="translate(210 263) scale(.72)"><use href="#person"/></g><g transform="translate(345 263) scale(.7)"><use href="#person"/></g><text x="18" y="305" class="t" font-size="14">World information dominates; operators are supporting scale.</text><text x="18" y="326" class="m" font-size="12">No face close-up before the anomaly exists.</text></g>
<g transform="translate(532 122)"><rect width="500" height="338" rx="8" class="p"/><rect width="500" height="34" rx="8" class="h"/><text x="12" y="24" class="t" font-size="17" font-weight="800">02 · ANOMALY DETECTED</text><text x="486" y="24" class="g" font-size="12" text-anchor="end">DETAIL / CUT</text><rect x="10" y="46" width="480" height="230" fill="#0f2637"/><g transform="translate(145 90) scale(1.05)"><use href="#radar"/></g><text x="18" y="305" class="t" font-size="14">Now the detail shot has a reason to exist.</text><text x="18" y="326" class="m" font-size="12">Cut to evidence; do not orbit around a flat monitor.</text></g>
<g transform="translate(1050 122)"><rect width="536" height="338" rx="8" class="p"/><rect width="536" height="34" rx="8" class="h"/><text x="12" y="24" class="t" font-size="17" font-weight="800">03 · DISTANT FLEET</text><text x="522" y="24" class="g" font-size="12" text-anchor="end">EXTREME WIDE / PULL</text><rect x="10" y="46" width="516" height="230" class="sky"/><g transform="translate(18 138) scale(2)"><use href="#city"/></g><g transform="translate(110 92) scale(.33)"><use href="#enemy"/></g><g transform="translate(205 73) scale(.25)"><use href="#enemy"/></g><g transform="translate(300 105) scale(.22)"><use href="#enemy"/></g><g transform="translate(405 68) scale(.2)"><use href="#enemy"/></g><text x="18" y="305" class="t" font-size="14">Fleet reads as a threat because the city gives it scale.</text><text x="18" y="326" class="m" font-size="12">Ships remain distant; negative space stays visible.</text></g>
<g transform="translate(14 478)"><rect width="500" height="338" rx="8" class="p"/><rect width="500" height="34" rx="8" class="h"/><text x="12" y="24" class="t" font-size="17" font-weight="800">04 · PUBLIC REACTION</text><text x="486" y="24" class="g" font-size="12" text-anchor="end">WIDE / HOLD</text><rect x="10" y="46" width="480" height="230" class="sky"/><g transform="translate(18 138) scale(1.85)"><use href="#city"/></g><g transform="translate(85 262) scale(1.05)"><use href="#person"/></g><g transform="translate(170 262) scale(.95)"><use href="#person"/></g><g transform="translate(260 262) scale(.9)"><use href="#person"/></g><g transform="translate(390 85) scale(.25)"><use href="#enemy"/></g><text x="18" y="305" class="t" font-size="14">People react, but the sky and city still explain why.</text><text x="18" y="326" class="m" font-size="12">Characters ≈ 20–30% frame height.</text></g>
<g transform="translate(532 478)"><rect width="500" height="338" rx="8" class="p"/><rect width="500" height="34" rx="8" class="h"/><text x="12" y="24" class="t" font-size="17" font-weight="800">05 · COMMAND ESCALATES</text><text x="486" y="24" class="g" font-size="12" text-anchor="end">WIDE INTERIOR / HOLD</text><rect x="10" y="46" width="480" height="230" fill="#102431"/><g transform="translate(145 86)"><use href="#radar"/></g><g transform="translate(80 263) scale(.78)"><use href="#person"/></g><g transform="translate(210 263) scale(.72)"><use href="#person"/></g><g transform="translate(345 263) scale(.74)"><use href="#person"/></g><text x="18" y="305" class="t" font-size="14">Dialogue supports the map; it does not erase the world evidence.</text><text x="18" y="326" class="m" font-size="12">Hold/cut coverage; avoid decorative movement.</text></g>
<g transform="translate(1050 478)"><rect width="536" height="338" rx="8" class="p"/><rect width="536" height="34" rx="8" class="h"/><text x="12" y="24" class="t" font-size="17" font-weight="800">06 · RECON DEPLOYED</text><text x="522" y="24" class="g" font-size="12" text-anchor="end">EXTREME WIDE / FOLLOW</text><rect x="10" y="46" width="516" height="230" class="sky"/><g transform="translate(18 138) scale(2)"><use href="#city"/></g><path d="M180 160L245 138 330 148 360 162 330 177 245 184Z" fill="#e0e8ed" stroke="#0a151d" stroke-width="3"/><circle cx="182" cy="161" r="9" fill="#65e3ff"/><g transform="translate(450 95) scale(.2)"><use href="#enemy"/></g><text x="18" y="305" class="t" font-size="14">Launch returns to environmental scale, not a cockpit close-up.</text><text x="18" y="326" class="m" font-size="12">Follow in 2D screen space; preserve direction.</text></g>
<rect x="14" y="838" width="1572" height="148" rx="10" class="h" stroke="#2e6f91" stroke-width="2"/><text x="34" y="872" class="c" font-size="18" font-weight="900">WHY THIS IS A GOOD REFERENCE</text><text x="34" y="906" class="t" font-size="14">✓ Starts wide and earns tighter shots</text><text x="370" y="906" class="t" font-size="14">✓ Distant fleet is proportional to city</text><text x="755" y="906" class="t" font-size="14">✓ People do not dominate every panel</text><text x="1120" y="906" class="t" font-size="14">✓ World evidence survives dialogue</text><text x="34" y="940" class="t" font-size="14">✓ Flat 2D staging only</text><text x="370" y="940" class="t" font-size="14">✓ No invented 3D camera orbit</text><text x="755" y="940" class="t" font-size="14">✓ Clear screen direction</text><text x="1535" y="972" class="m" font-size="12" text-anchor="end">COMPOSITION REFERENCE ONLY · EXACT ASSETS COME FROM CURRENT ATLAS</text></svg>