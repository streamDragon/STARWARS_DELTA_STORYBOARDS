<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
<defs>
<style>.t{font-family:Arial,sans-serif;fill:#eaf3fb}.m{font-family:Arial,sans-serif;fill:#9fb8c8}.c{font-family:Arial,sans-serif;fill:#43c6f5}.g{font-family:Arial,sans-serif;fill:#78d494}.p{fill:#0b2032;stroke:#2e6f91;stroke-width:2}.h{fill:#081826}.sky{fill:#86bddc}.floor{fill:#233744}</style>
<g id="city"><rect x="0" y="74" width="22" height="56" fill="#17344a"/><rect x="25" y="48" width="19" height="82" fill="#244b61"/><rect x="47" y="28" width="28" height="102" fill="#2b5870"/><rect x="78" y="63" width="21" height="67" fill="#17344a"/><rect x="102" y="39" width="17" height="91" fill="#244b61"/><rect x="122" y="18" width="31" height="112" fill="#2b5870"/><rect x="156" y="57" width="22" height="73" fill="#17344a"/><rect x="181" y="33" width="27" height="97" fill="#244b61"/><rect x="211" y="70" width="20" height="60" fill="#2b5870"/></g>
