<rect width="1600" height="1000" fill="#071421"/><rect x="14" y="14" width="1572" height="88" rx="10" class="h" stroke="#2e6f91" stroke-width="2"/><text x="38" y="52" class="t" font-size="29" font-weight="900">STARWARS_DELTA</text><text x="38" y="80" font-family="Arial" fill="#f6b13b" font-size="20" font-weight="900">OPENING: SCALE &amp; PROPORTION</text><text x="520" y="53" class="c" font-size="21" font-weight="800">2D STORYBOARD REFERENCE</text><text x="520" y="79" class="m" font-size="14">World first: calm city → distant threat → reaction → command → launch</text>
<!-- row 1 -->
<g transform="translate(14 122)"><rect width="246" height="350" rx="8" class="p"/><rect width="246" height="32" rx="8" class="h"/><text x="10" y="23" class="t" font-size="17" font-weight="800">01</text><text x="48" y="23" class="c" font-size="13" font-weight="800">CALM CITY</text><text x="236" y="23" class="g" font-size="12" text-anchor="end">EXTREME WIDE</text><rect x="7" y="40" width="232" height="254" class="sky"/><g transform="translate(8 164)"><use href="#city"/></g><g transform="translate(34 280) scale(.55)"><use href="#person"/></g><g transform="translate(62 280) scale(.5)"><use href="#person"/></g><g transform="translate(95 280) scale(.46)"><use href="#person"/></g><g transform="translate(142 280) scale(.52)"><use href="#person"/></g><g transform="translate(190 280) scale(.45)"><use href="#person"/></g><rect x="7" y="300" width="232" height="43" fill="#07131e"/><text x="15" y="322" class="t" font-size="13">People are tiny relative to the city.</text><text x="15" y="339" class="m" font-size="11">HOLD · 0–10% character height</text></g>
<g transform="translate(274 122)"><rect width="246" height="350" rx="8" class="p"/><rect width="246" height="32" rx="8" class="h"/><text x="10" y="23" class="t" font-size="17" font-weight="800">02</text><text x="48" y="23" class="c" font-size="13" font-weight="800">DAILY LIFE</text><text x="236" y="23" class="g" font-size="12" text-anchor="end">WIDE / TRACK</text><rect x="7" y="40" width="232" height="254" class="sky"/><g transform="translate(8 164)"><use href="#city"/></g><g transform="translate(36 280) scale(.72)"><use href="#person"/></g><g transform="translate(77 280) scale(.65)"><use href="#person"/></g><g transform="translate(121 280) scale(.7)"><use href="#person"/></g><g transform="translate(166 280) scale(.62)"><use href="#person"/></g><rect x="7" y="300" width="232" height="43" fill="#07131e"/><text x="15" y="322" class="t" font-size="13">Environment remains dominant.</text><text x="15" y="339" class="m" font-size="11">TRACK RIGHT · no close-up</text></g>
<g transform="translate(534 122)"><rect width="246" height="350" rx="8" class="p"/><rect width="246" height="32" rx="8" class="h"/><text x="10" y="23" class="t" font-size="17" font-weight="800">03</text><text x="48" y="23" class="c" font-size="13" font-weight="800">ONE WRONG SHIP</text><text x="236" y="23" class="g" font-size="12" text-anchor="end">WIDE / HOLD</text><rect x="7" y="40" width="232" height="254" class="sky"/><g transform="translate(8 164)"><use href="#city"/></g><g transform="translate(176 88) scale(.45)"><use href="#ship"/></g><rect x="7" y="300" width="232" height="43" fill="#07131e"/><text x="15" y="322" class="t" font-size="13">Threat begins as a small detail.</text><text x="15" y="339" class="m" font-size="11">Negative space does the work.</text></g>
<g transform="translate(794 122)"><rect width="246" height="350" rx="8" class="p"/><rect width="246" height="32" rx="8" class="h"/><text x="10" y="23" class="t" font-size="17" font-weight="800">04</text><text x="48" y="23" class="c" font-size="13" font-weight="800">PEOPLE NOTICE</text><text x="236" y="23" class="g" font-size="12" text-anchor="end">MEDIUM WIDE</text><rect x="7" y="40" width="232" height="254" class="sky"/><g transform="translate(8 164)"><use href="#city"/></g><g transform="translate(42 280) scale(.95)"><use href="#person"/></g><g transform="translate(92 280) scale(.85)"><use href="#person"/></g><g transform="translate(142 280) scale(.9)"><use href="#person"/></g><g transform="translate(188 82) scale(.35)"><use href="#ship"/></g><rect x="7" y="300" width="232" height="43" fill="#07131e"/><text x="15" y="322" class="t" font-size="13">Reaction without filling the frame.</text><text x="15" y="339" class="m" font-size="11">People ≈ 20–30% frame height</text></g>
<g transform="translate(1054 122)"><rect width="246" height="350" rx="8" class="p"/><rect width="246" height="32" rx="8" class="h"/><text x="10" y="23" class="t" font-size="17" font-weight="800">05</text><text x="48" y="23" class="c" font-size="13" font-weight="800">FLEET GROWS</text><text x="236" y="23" class="g" font-size="12" text-anchor="end">EXTREME WIDE / PULL</text><rect x="7" y="40" width="232" height="254" class="sky"/><g transform="translate(8 164)"><use href="#city"/></g><g transform="translate(48 76) scale(.27)"><use href="#enemy"/></g><g transform="translate(98 60) scale(.22)"><use href="#enemy"/></g><g transform="translate(147 88) scale(.2)"><use href="#enemy"/></g><g transform="translate(192 55) scale(.18)"><use href="#enemy"/></g><rect x="7" y="300" width="232" height="43" fill="#07131e"/><text x="15" y="322" class="t" font-size="13">Fleet stays proportional to skyline.</text><text x="15" y="339" class="m" font-size="11">Do not make every ship huge.</text></g>
<g transform="translate(1314 122)"><rect width="246" height="350" rx="8" class="p"/><rect width="246" height="32" rx="8" class="h"/><text x="10" y="23" class="t" font-size="17" font-weight="800">06</text><text x="48" y="23" class="c" font-size="13" font-weight="800">CONCERN SPREADS</text><text x="236" y="23" class="g" font-size="12" text-anchor="end">WIDE / HOLD</text><rect x="7" y="40" width="232" height="254" class="sky"/><g transform="translate(8 164)"><use href="#city"/></g><g transform="translate(42 280) scale(.82)"><use href="#person"/></g><g transform="translate(85 280) scale(.75)"><use href="#person"/></g><g transform="translate(128 280) scale(.78)"><use href="#person"/></g><g transform="translate(176 80) scale(.2)"><use href="#enemy"/></g><g transform="translate(205 58) scale(.16)"><use href="#enemy"/></g><rect x="7" y="300" width="232" height="43" fill="#07131e"/><text x="15" y="322" class="t" font-size="13">Story remains world + people.</text><text x="15" y="339" class="m" font-size="11">No portrait yet.</text></g>
<!-- row 2 -->
<g transform="translate(14 484)"><rect width="246" height="350" rx="8" class="p"/><rect width="246" height="32" rx="8" class="h"/><text x="10" y="23" class="t" font-size="17" font-weight="800">07</text><text x="48" y="23" class="c" font-size="13" font-weight="800">SENSORS SPIKE</text><text x="236" y="23" class="g" font-size="12" text-anchor="end">WIDE INTERIOR</text><rect x="7" y="40" width="232" height="254" fill="#102431"/><g transform="translate(18 72)"><use href="#radar"/></g><g transform="translate(48 284) scale(.72)"><use href="#person"/></g><g transform="translate(120 284) scale(.7)"><use href="#person"/></g><rect x="7" y="300" width="232" height="43" fill="#07131e"/><text x="15" y="322" class="t" font-size="13">Operators + display share frame.</text><text x="15" y="339" class="m" font-size="11">Evidence stays visible.</text></g>
<g transform="translate(274 484)"><rect width="246" height="350" rx="8" class="p"/><rect width="246" height="32" rx="8" class="h"/><text x="10" y="23" class="t" font-size="17" font-weight="800">08</text><text x="48" y="23" class="c" font-size="13" font-weight="800">THREAT MAP</text><text x="236" y="23" class="g" font-size="12" text-anchor="end">DETAIL / CUT</text><rect x="7" y="40" width="232" height="254" fill="#102431"/><g transform="translate(18 92)"><use href="#radar"/></g><rect x="7" y="300" width="232" height="43" fill="#07131e"/><text x="15" y="322" class="t" font-size="13">A detail shot is earned now.</text><text x="15" y="339" class="m" font-size="11">Cut, do not fake camera orbit.</text></g>
<g transform="translate(534 484)"><rect width="246" height="350" rx="8" class="p"/><rect width="246" height="32" rx="8" class="h"/><text x="10" y="23" class="t" font-size="17" font-weight="800">09</text><text x="48" y="23" class="c" font-size="13" font-weight="800">DEREK CALLED</text><text x="236" y="23" class="g" font-size="12" text-anchor="end">MEDIUM / CUT</text><rect x="7" y="40" width="232" height="254" fill="#132531"/><g transform="translate(120 273) scale(2.2)"><use href="#person"/></g><rect x="7" y="300" width="232" height="43" fill="#07131e"/><text x="15" y="322" class="t" font-size="13">Medium is enough for dialogue.</text><text x="15" y="339" class="m" font-size="11">Close-ups are not the default.</text></g>
<g transform="translate(794 484)"><rect width="246" height="350" rx="8" class="p"/><rect width="246" height="32" rx="8" class="h"/><text x="10" y="23" class="t" font-size="17" font-weight="800">10</text><text x="48" y="23" class="c" font-size="13" font-weight="800">RUN TO HANGAR</text><text x="236" y="23" class="g" font-size="12" text-anchor="end">WIDE / TRACK</text><g transform="translate(8 40)"><use href="#corridor"/></g><g transform="translate(140 278) scale(1.15)"><use href="#person"/></g><rect x="7" y="300" width="232" height="43" fill="#07131e"/><text x="15" y="322" class="t" font-size="13">Architecture gives motion scale.</text><text x="15" y="339" class="m" font-size="11">Character remains in environment.</text></g>
<g transform="translate(1054 484)"><rect width="246" height="350" rx="8" class="p"/><rect width="246" height="32" rx="8" class="h"/><text x="10" y="23" class="t" font-size="17" font-weight="800">11</text><text x="48" y="23" class="c" font-size="13" font-weight="800">FIGHTER READY</text><text x="236" y="23" class="g" font-size="12" text-anchor="end">WIDE / HOLD</text><rect x="7" y="40" width="232" height="254" fill="#1a2932"/><g transform="translate(140 160) scale(1.35)"><use href="#ship"/></g><g transform="translate(45 282) scale(.55)"><use href="#person"/></g><g transform="translate(78 282) scale(.5)"><use href="#person"/></g><rect x="7" y="300" width="232" height="43" fill="#07131e"/><text x="15" y="322" class="t" font-size="13">Ship dominates, crew stays small.</text><text x="15" y="339" class="m" font-size="11">Readable hangar scale.</text></g>
<g transform="translate(1314 484)"><rect width="246" height="350" rx="8" class="p"/><rect width="246" height="32" rx="8" class="h"/><text x="10" y="23" class="t" font-size="17" font-weight="800">12</text><text x="48" y="23" class="c" font-size="13" font-weight="800">LAUNCH</text><text x="236" y="23" class="g" font-size="12" text-anchor="end">EXTREME WIDE / FOLLOW</text><rect x="7" y="40" width="232" height="254" class="sky"/><g transform="translate(8 164)"><use href="#city"/></g><g transform="translate(138 132) scale(1.2)"><use href="#ship"/></g><g transform="translate(204 82) scale(.3)"><use href="#enemy"/></g><rect x="7" y="300" width="232" height="43" fill="#07131e"/><text x="15" y="322" class="t" font-size="13">Return to world scale for launch.</text><text x="15" y="339" class="m" font-size="11">FOLLOW in 2D screen space.</text></g>
<rect x="14" y="846" width="1572" height="140" rx="10" class="h" stroke="#2e6f91" stroke-width="2"/><text x="34" y="878" class="c" font-size="18" font-weight="900">2D REFERENCE RULES</text><text x="34" y="912" class="t" font-size="14">✓ Wide shots are normal</text><text x="330" y="912" class="t" font-size="14">✓ People stay small in world shots</text><text x="720" y="912" class="t" font-size="14">✓ No fake 3D orbit</text><text x="1020" y="912" class="t" font-size="14">✓ BG / MG / FG are 2D layers</text><text x="34" y="944" class="t" font-size="14">✓ Screen fraction sets visual size</text><text x="430" y="944" class="t" font-size="14">✓ One clear story change per shot</text><text x="1535" y="972" class="m" font-size="12" text-anchor="end">COMPOSITION REFERENCE ONLY · EXACT ASSETS COME FROM CURRENT ATLAS</text>
