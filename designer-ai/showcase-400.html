<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>STARWARS_DELTA 400S All-Systems Showcase</title><style>:root{color-scheme:dark;font-family:Inter,Segoe UI,Arial,sans-serif;background:#080b12;color:#eef4ff}*{box-sizing:border-box}body{margin:0;background:#080b12}header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 14px;background:#101724;border-bottom:1px solid #30384d}h1{font-size:17px;margin:0}.sub{font-size:11px;color:#99a9bd;margin-top:3px}.actions{display:flex;gap:8px}.btn{border:1px solid #414a61;background:#19202e;color:#fff;border-radius:8px;padding:9px 12px;font-weight:850;text-decoration:none;cursor:pointer}.gold{background:#8c6718;border-color:#c99724}.status{padding:8px 14px;font-size:11px;color:#f2c85b;background:#0b1019;border-bottom:1px solid #242d3c}.status.ok{color:#73e09d}.status.bad{color:#ff7885}iframe{display:block;width:100%;height:calc(100vh - 92px);border:0;background:#080b12}</style></head><body><header><div><h1>400S ALL-SYSTEMS CINEMATIC SHOWCASE</h1><div class="sub">80 short beats · CURRENT-grounded · emotional dialogue · evacuation · semantic animations · combat · VFX/UI · orbit-like 2D parallax · Mars coda</div></div><div class="actions"><button id="download" class="btn gold" disabled>DOWNLOAD 400S JSON</button><a class="btn" href="devora.html">BACK TO DEVORA</a></div></header><div id="status" class="status">Loading verified showcase…</div><iframe id="preview" src="simple-preview.html" title="400s Simple Preview"></iframe><script>
const statusEl=document.getElementById('status'),frame=document.getElementById('preview'),download=document.getElementById('download');let showcase=null;
async function decodePayload(){const m=await fetch('simple-authoring/EXAMPLE_GOLDEN_400S_SYSTEMS_SHOWCASE_MANIFEST.json?t='+Date.now(),{cache:'no-store'});if(!m.ok)throw new Error('manifest HTTP '+m.status);const manifest=await m.json();const p=await fetch('simple-authoring/'+manifest.payload.file+'?t='+Date.now(),{cache:'no-store'});if(!p.ok)throw new Error('payload HTTP '+p.status);const b64=(await p.text()).trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('This browser does not support gzip DecompressionStream');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const text=await new Response(stream).text();const obj=JSON.parse(text);if(obj.schema!=='STARWARS_DELTA_CUTSCENE_SCRIPT'||obj.schemaVersion!==1)throw new Error('decoded payload is not CUTSCENE_SCRIPT_V1');if(obj.durationSeconds!==manifest.durationSeconds||obj.beats?.length!==manifest.beatCount)throw new Error('showcase manifest mismatch');return {manifest,obj};}
function save(obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='STARWARS_DELTA_CUTSCENE_SCRIPT_V1_400_SECONDS_ALL_SYSTEMS.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
(async()=>{try{const {manifest,obj}=await decodePayload();showcase=obj;download.disabled=false;download.onclick=()=>save(showcase);statusEl.className='status ok';statusEl.textContent=`READY · ${obj.durationSeconds}s · ${obj.beats.length} beats · CURRENT ${manifest.currentPublishTransactionId}`;const load=()=>{try{const w=frame.contentWindow;if(typeof w.loadObject==='function'){w.loadObject(obj,'GOLDEN 400S ALL-SYSTEMS SHOWCASE');statusEl.textContent+= ' · loaded into Simple Preview';}else setTimeout(load,250);}catch(e){setTimeout(load,250)}};if(frame.contentDocument?.readyState==='complete')load();else frame.addEventListener('load',load,{once:true});}catch(e){statusEl.className='status bad';statusEl.textContent='SHOWCASE ERROR · '+String(e.message||e)}})();
</script></body></html>
