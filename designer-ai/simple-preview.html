<body><header><div><h1>DEVORA - Simple Cutscene Preview</h1><div class="sub">General cinema uses AUTHORING_HANDLES. Dialogue is exact, case-sensitive, closed-world and comes from the same atomic CURRENT bundle.</div><div id="systemStatus" class="status">Verifying CURRENT…</div></div><div class="controls"><label class="btn primary">LOAD JSON<input id="file" type="file" accept=".json,application/json" hidden></label><button id="prev" class="btn" disabled>PREV</button><button id="next" class="btn" disabled>NEXT</button><a class="btn" href="devora.html">BACK TO DEVORA</a></div></header><div id="drop" class="drop">Drop CUTSCENE_SCRIPT_V1 here.</div><main><div class="grid"><section><div id="stage" class="stage"><div class="fallback"></div></div><div id="timeline" class="timeline"></div></section><aside class="panel"><h2>Preflight</h2><div id="diag" class="kv">Nothing loaded.</div><hr><h2>Current Beat</h2><pre id="raw">-</pre></aside></div></main><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const $=s=>document.querySelector(s),file=$('#file'),drop=$('#drop'),stage=$('#stage'),timeline=$('#timeline'),diag=$('#diag'),raw=$('#raw'),prev=$('#prev'),next=$('#next'),statusEl=$('#systemStatus');const K=['catalogRevision','contractRevision','schemaHash','snapshotContentHash','authoringRuleRegistryRevision'];const same=(a,b)=>K.every(k=>String(a?.[k]??'')!==''&&String(a[k])===String(b?.[k]??'')),tx=o=>String(o?.publishTransactionId||o?.atomicIdentity?.publishTransactionId||o?.provenance?.publishTransactionId||''),exact=v=>String(v??''),blank=v=>v==null||String(v).trim()==='',low=v=>String(v??'').trim().toLowerCase(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cur={ready:false,tx:'',required:null,handles:new Map(),visual:new Map()},dlg={ready:false,reason:'not checked',byActorId:new Map()},root=null,beats=[],index=0,pending=null;async function get(url,kind='json',optional=false){const u=new URL(url,location.href);if(u.origin===location.origin)u.searchParams.set('_p',Date.now()+Math.random());const r=await fetch(u,{cache:'no-store'});if(optional&&r.status===404)return null;if(!r.ok)throw new Error(url+' HTTP '+r.status);return kind==='json'?r.json():kind==='arrayBuffer'?r.arrayBuffer():r.text()}function entries(o){return Array.isArray(o?.entries)?o.entries:Array.isArray(o?.assets)?o.assets:[]}function imgUrl(e){for(const k of ['representativeImageUrl','previewUrl','thumbnailUrl','imageUrl','pageImageUrl'])if(e?.[k])return e[k];return null}function resolveGeneral(handle,route){const e=cur.handles.get(low(handle));return e&&(!route||e.route===route)?e:null}function visualForEntry(e){if(!e)return null;for(const id of [e.runtimeId,e.visualReferenceId]){const u=cur.visual.get(low(id));if(u)return u}return e.pageImageUrl||null}function visualForAssetIdentity(id){return id?cur.visual.get(low(id))||null:null}function verifyRep(rep,source,open){return !!rep&&rep.schema==='STARWARS_DELTA_EMOTIONAL_DIALOG {if(!cur.ready){pending={obj:o,name};drop.textContent='Waiting for CURRENT…';return}if(o?.schema!=='STARWARS_DELTA_CUTSCENE_SCRIPT'||o?.schemaVersion!==1||!Array.isArray(o.beats)){drop.className='drop bad';drop.textContent='Not CUTSCENE_SCRIPT_V1';return}const pre=diagnostics(o);diag.innerHTML=pre.html;if(pre.blocked){root=null;beats=[];drop.className='drop bad';drop.textContent='BLOCKED '+name;prev.disabled=next.disabled=true;return}root=o;beats=o.beats;index=0;drop.className='drop good';drop.textContent=`Loaded ${name} · ${beats.length} beats`;prev.disabled=next.disabled=false;render()}function renderPortrait(actorId,side){const ch=dlg.byActorId.get(exact(actorId));if(!ch)return;const u=visualForAssetIdentity(ch.defaultPresentationHandle);if(u){const im=document.createElement('img');im.className='portrait '+side;im.src=u;stage.appendChild(im)}else{const ph=document.createElement('div');ph.className='ph';ph.style.left=side==='left'?'27%':'73%';ph.style.top='48%';ph.textContent=`${actorId}\n${ch.defaultPresentationHandle}\nNo visual lookup. No substitute used.`;stage.appendChild(ph)}}function render(){stage.innerHTML='<div class="fallback"></div>';timeline.innerHTML='';const b=beats[index];if(!b){raw.textContent='-';return}if(!(b.dialogue||[]).length&&b.locationHandle){const loc=resolveGeneral(b.locationHandle,'Layer'),u=visualForEntry(loc);if(u){const im=document.createElement('img');im.className='background';im.src=u;stage.appendChild(im)}}for(const v of b.visible||[]){const h=resolveGeneral(v.handle,null),u=visualForEntry(h),x=Number.isFinite(+v.screenX)?+v.screenX:.5,y=Number.isFinite(+v.screenY)?+v.screenY:.52,w=Number.isFinite(+v.screenWidthFraction)?+v.screenWidthFraction:.16;if(u){const im=document.createElement('img');im.className='visual';im.src=u;im.style.left=x*100+'%';im.style.top=y*100+'%';im.style.width=w*100+'%';stage.appendChild(im)}}const d=(b.dialogue||[])[0];if(d){renderPortrait(d.speaker,'left');if(d.listener)renderPortrait(d.listener,'right')}const info=document.createElement('div');info.className='info';info.innerHTML=`<b>${esc(b.id)} · ${esc(b.type)}</b>${(b.dialogue||[]).map(x=>`<div class="dialogue"><b>${esc(x.speaker)}</b>: ${esc(x.text)} · ${esc(blank(x.expressionIntent)?dlg.byActorId.get(exact(x.speaker))?.defaultExpression||'':x.expressionIntent)}</div>`).join('')}`;stage.appendChild(info);beats.forEach((x,i)=>{const e=document.createElement('div');e.className='beat'+(i===index?' active':'');e.innerHTML=`<b>${esc(x.id)}</b><small>${esc(x.type)} · ${Number(x.durationSeconds||0).toFixed(1)}s</small>`;e.onclick=()=>{index=i;render()};timeline.appendChild(e)});raw.textContent=JSON.stringify(b,null,2)}prev.onclick=()=>{index=Math.max(0,index-1);render()};next.onclick=()=>{index=Math.min(beats.length-1,index+1);render()};file.onchange=async e=>{const f=e.target.files[0];if(f)try{loadObject(JSON.parse(await f.text()),f.name)}catch(x){drop.className='drop bad';drop.textContent='JSON error · '+x.message}};drop.ondragover=e=>e.preventDefault();drop.ondrop=async e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)try{loadObject(JSON.parse(await f.text()),f.name)}catch(x){drop.className='drop bad';drop.textContent='JSON error · '+x.message}};boot();
