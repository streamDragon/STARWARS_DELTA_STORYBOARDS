<style>
:root{font-family:Segoe UI,Arial,sans-serif;color-scheme:dark;--bg:#080b12;--panel:#111827;--line:#334155;--muted:#94a3b8;--ok:#75e0a0;--warn:#f3c969;--bad:#ff7f8c;--blue:#6ea8ff}html{direction:rtl}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef4ff}header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between}h1{margin:0;font-size:20px}.sub,.status{font-size:11px;color:var(--muted);margin-top:5px}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}.btn{display:inline-block;border:1px solid #475569;background:#172033;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;text-decoration:none;cursor:pointer}.btn.primary{background:#315fff}.btn:disabled{opacity:.4}.drop{margin:14px;padding:16px;text-align:center;border:2px dashed #475569;border-radius:12px;color:#b4c0cf}.drop.good{border-color:#3d7d58}.drop.bad{border-color:#8a3e49;color:#ffd2d7}main{max-width:1480px;margin:auto;padding:0 14px 24px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 450px;gap:12px}.stage{aspect-ratio:16/9;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at 35% 35%,#243352,#070a12 58%,#020309 100%)}

.stage.city::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;z-index:-1;background:linear-gradient(180deg,transparent 0 18%,rgba(4,8,16,.2) 18%),repeating-linear-gradient(90deg,#182235 0 5%,#0b1220 5% 8%,#25314a 8% 13%,#0a101d 13% 17%);clip-path:polygon(0 100%,0 48%,5% 48%,5% 30%,11% 30%,11% 55%,18% 55%,18% 18%,25% 18%,25% 45%,31% 45%,31% 25%,39% 25%,39% 60%,46% 60%,46% 35%,55% 35%,55% 15%,63% 15%,63% 52%,70% 52%,70% 28%,78% 28%,78% 58%,86% 58%,86% 36%,94% 36%,94% 48%,100% 48%,100% 100%)}.background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85;z-index:0}.visual,.portrait{position:absolute;object-fit:contain;transform:translate(-50%,-50%)}.visual.atlas-tile{background-repeat:no-repeat;background-size:300% 400%;background-color:#fff;border-radius:8px;box-shadow:0 7px 24px #0008;overflow:hidden}.portrait{top:48%;height:68%;width:34%;z-index:80}.portrait.left{left:25%}.portrait.right{left:75%}.portrait-placeholder{position:absolute;top:48%;transform:translate(-50%,-50%);width:30%;padding:10px;border:1px dashed var(--warn);border-radius:8px;background:#17120ae8;color:#ffe7a6;font-size:10px;text-align:center;z-index:80}.portrait-placeholder.left{left:25%}.portrait-placeholder.right{left:75%}.dialogue{position:absolute;left:4%;right:4%;bottom:4%;background:#05070bee;border:1px solid #475569;border-radius:8px;padding:9px 11px;font-size:13px;z-index:100}.transport{display:grid;grid-template-columns:auto 1fr 92px auto;gap:10px;align-items:center;padding:10px 2px 2px}.seconds-input{width:92px;background:#0b1321;color:#eef4ff;border:1px solid #475569;border-radius:8px;padding:8px 9px;font:700 12px Consolas,monospace;direction:ltr}.scrub{width:100%;accent-color:var(--blue);cursor:pointer}.timecode{font:700 12px Consolas,monospace;color:#cbd5e1;direction:ltr;white-space:nowrap}.timeline{display:flex;gap:7px;overflow:auto;padding:10px 0}.beat{min-width:150px;border:1px solid #3b465c;background:#151e2e;border-radius:8px;padding:8px;cursor:pointer}.beat.active{outline:2px solid var(--blue)}.beat small{display:block;color:var(--muted);font-size:9px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:12px}.kv{font-size:10px;line-height:1.55;word-break:break-word}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}pre{font-size:9px;white-space:pre-wrap;max-height:360px;overflow:auto}@media(max-width:980px){.grid{grid-template-columns:1fr}}

header{background:linear-gradient(90deg,rgba(18,40,61,.92),rgba(38,29,64,.9))}
.btn.primary{background:linear-gradient(135deg,#1c7ea1,#6658cc)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/ajv/8.17.1/ajv2020.bundle.min.js"></script>

<body>
<header>
<div><h1>דבורה — תצוגת סרט</h1><div class="sub">תצוגה מקדימה על בסיס סכימת CURRENT וה־handles המדויקים. פורטרטים, כמות אובייקטים וניגון Beat מוצגים כאן בלי להמציא התנהגות Runtime של Unity.</div><div id="status" class="status">טוען את חוזה CURRENT...</div></div>
<div><label class="btn primary">טעינת JSON<input id="file" type="file" accept=".json" hidden></label> <button id="play" class="btn" disabled>נגן</button> <button id="prev" class="btn" disabled>הקודם</button> <button id="next" class="btn" disabled>הבא</button> <a class="btn" href="devora.html">חזרה</a></div>
</header>
<div id="drop" class="drop">גרור לכאן קובץ CUTSCENE_SCRIPT_V1.</div>
<main><div class="grid"><section><div id="stage" class="stage"></div><div class="transport"><button id="play2" class="btn" disabled>▶ נגן</button><input id="scrub" class="scrub" type="range" min="0" max="0" step="0.1" value="0"><input id="secondsInput" class="seconds-input" type="number" min="0" max="0" step="0.1" value="0" aria-label="שנייה בסרט"><span id="timecode" class="timecode">00:00.0 / 00:00.0</span></div><div id="timeline" class="timeline"></div></section><aside class="panel"><b>בדיקה מקדימה</b><div id="diag" class="kv">לא נטען קובץ.</div><hr><b>Beat נוכחי</b><pre id="raw">-</pre></aside></div></main>
<script>
const $=s=>document.querySelector(s),E=v=>String(v??''),L=v=>E(v).trim().toLowerCase(),X=v=>E(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K=['catalogRevision','contractRevision','schemaHash','snapshotContentHash','authoringRuleRegistryRevision'];
const same=(a,b)=>K.every(k=>E(a?.[k])!==''&&E(a[k])===E(b?.[k])),tx=o=>E(o?.publishTransactionId||o?.atomicIdentity?.publishTransactionId||o?.provenance?.publishTransactionId);
const file=$('#file'),drop=$('#drop'),stage=$('#stage'),timeline=$('#timeline'),diag=$('#diag'),raw=$('#raw'),play=$('#play'),play2=$('#play2'),scrub=$('#scrub'),secondsInput=$('#secondsInput'),timecode=$('#timecode'),prev=$('#prev'),next=$('#next'),status=$('#status');
let state={ready:false,validate:null,handles:new Map(),visual:new Map(),dialogue:new Map(),audioAvailable:false,beats:[],movie:null,index:0,playing:false,currentTime:0,totalDuration:0,beatStarts:[],raf:0,lastTs:0,secondsEditing:false};
async function get(url,opt=false){const u=new URL(url,location.href);u.searchParams.set('_p',Date.now()+Math.random());const r=await fetch(u,{cache:'no-store'});if(opt&&r.status===404)return null;if(!r.ok)throw Error(url+' HTTP '+r.status);return r.json()}
function entries(o){return Array.isArray(o?.entries)?o.entries:Array.isArray(o?.assets)?o.assets:[]}
function assetUrl(u){u=E(u).trim();if(!u)return'';if(/^https?:\/\//i.test(u)||u.startsWith('data:'))return u;if(u.startsWith('open-current/'))return new URL(u,location.href).href;if(u.startsWith('full-visual-sheets/'))return new URL('open-current/'+u,location.href).href;return new URL(u,location.href).href}
function imageOf(e){for(const k of ['representativeImageUrl','previewUrl','thumbnailUrl','imageUrl','pageImageUrl'])if(e?.[k])return assetUrl(e[k]);return''}
function handle(id,route){const h=state.handles.get(L(id));return h&&(!route||h.route===route)?h:null}
function imageFor(h){if(!h)return'';for(const id of [h.runtimeId,h.visualReferenceId,h.catalogRecordId,h.recordId,h.stableId]){const u=state.visual.get(L(id));if(u)return u}return imageOf(h)||assetUrl(h.pageImageUrl||'')}
function imageForRuntimeId(id){return state.visual.get(L(id))||''}
function expressionPresentation(ch,intent){if(!ch)return null;const expression=E(intent||ch.defaultExpression);const presentationHandle=E(ch.expressionPresentationHandles?.[expression]||(expression===E(ch.defaultExpression)?ch.defaultPresentationHandle:''));return {expression,presentationHandle,image:imageForRuntimeId(presentationHandle)}}
function depthZ(depth){return {far:10,background:20,mid:40,foreground:60,ui:90}[L(depth)]||40}
function cloneOffset(i,n){if(n<=1)return [0,0];const cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols),c=i%cols,r=Math.floor(i/cols);return [(c-(cols-1)/2)*0.035,(r-(rows-1)/2)*0.05]}
async function boot(){try{
 if(typeof ajv2020==='undefined')throw Error('Ajv 8.17.1 failed to load');
 const [source,open,schema,handles,lookup,dialogue]=await Promise.all([
  get('current.json'),get('open-current/OPEN_CURRENT.json'),get('open-current/simple-authoring/CUTSCENE_SCRIPT_V1.schema.json'),get('open-current/simple-authoring/AUTHORING_HANDLES.json'),get('open-current/ASSET_VISUAL_LOOKUP.json'),get('open-current/EMOTIONAL_DIALOGUE_CURRENT.json',true)
 ]);
 if(source.status!=='CURRENT_VERIFIED'||open.status!=='CURRENT_VERIFIED'||tx(source)!==tx(open)||!same(source.requiredCurrent,open.requiredCurrent)||!same(open.requiredCurrent,handles.requiredCurrent)||tx(lookup)!==tx(open))throw Error('CURRENT identity mismatch');
 const ajv=new ajv2020({allErrors:true,strict:false,allowUnionTypes:true});state.validate=ajv.compile(schema);
 for(const h of handles.handles||[]){state.handles.set(L(h.handle),h);if(h.route==='Audio')state.audioAvailable=true;}
 const ve=entries(lookup);for(const map of ['assetIdToEntryIndex','catalogRecordIdToEntryIndex','recordIdToEntryIndex','stableIdToEntryIndex','sourceIdToEntryIndex'])for(const [id,i] of Object.entries(lookup[map]||{})){const u=imageOf(ve[+i]);if(u)state.visual.set(L(id),u)}
 if(dialogue&&dialogue.status==='CURRENT_VERIFIED_EMOTIONAL_DIALOGUE'&&tx(dialogue)===tx(open)&&same(dialogue.requiredCurrent,open.requiredCurrent))for(const c of dialogue.characters||[])if(c.authoringReady===true)state.dialogue.set(E(c.actorId),c);
 state.ready=true;status.className='status ok';status.textContent=`CURRENT ${tx(open)} · הסכמה מוכנה · ${state.handles.size} handles · ${state.dialogue.size} דמויות דיאלוג · חזות מוכנה`;
}catch(e){status.className='status bad';status.textContent='CURRENT לא תקין · '+e.message}}
function schemaErrors(o){const ok=state.validate(o);if(ok)return[];return(state.validate.errors||[]).map(e=>`${e.instancePath||'/'} ${e.message||e.keyword}`)}
function authoringErrors(o){
 const out=[],talkers=new Set();
 for(const b of o.beats||[])for(const d of b.dialogue||[]){if(d.speaker)talkers.add(E(d.speaker));if(d.listener)talkers.add(E(d.listener))}
 for(const c of o.cast||[]){
  const id=E(c.id),identity=E(c.identityHandle),material=E(c.materialHandle);
  if(identity&&material){out.push(`cast.${id} has both identityHandle and materialHandle`);continue}
  if(!identity&&!material){out.push(`cast.${id} requires identityHandle or materialHandle`);continue}
  if(material){
   const mh=handle(material);
   if(!mh)out.push(`cast.${id} materialHandle unresolved: ${material}`);
   if(talkers.has(id))out.push(`cast.${id} dialogue participant requires identityHandle, not materialHandle`);
   continue;
  }
  if(!handle(identity,'Actor'))out.push(`cast.${id} Actor identity unresolved: ${identity}`);
 }
 for(const b of o.beats||[]){
  if(b.locationHandle&&!handle(b.locationHandle,'Layer'))out.push(`beat.${b.id} Layer handle unresolved: ${b.locationHandle}`);
  for(const v of b.visible||[])if(!handle(v.handle))out.push(`beat.${b.id}.${v.id} handle unresolved: ${v.handle}`);
  for(const a of b.actions||[])if(a.animationHandle&&!handle(a.animationHandle,'Animation'))out.push(`beat.${b.id} animationHandle unresolved: ${a.animationHandle}`);
  for(const a of b.audio||[])if(!handle(a.handle,'Audio'))out.push(`beat.${b.id} Audio handle unresolved: ${a.handle}`);
  for(const d of b.dialogue||[]){
   for(const role of ['speaker','listener']){
    const id=E(d[role]);if(!id)continue;
    const cast=(o.cast||[]).find(c=>E(c.id)===id),ch=state.dialogue.get(id);
    if(!cast||!ch||E(cast.identityHandle)!==E(ch.identityHandle))out.push(`beat.${b.id} dialogue ${role} outside CURRENT repertoire: ${id}`);
   }
   const ch=state.dialogue.get(E(d.speaker));
   if(ch){const ex=E(d.expressionIntent||ch.defaultExpression);if(!(ch.supportedExpressions||[]).includes(ex))out.push(`beat.${b.id} unsupported expression ${d.speaker}: ${ex}`)}
  }
 }
 return out
}
function addPortrait(actorId,side,intent){const ch=state.dialogue.get(E(actorId));if(!ch)return;const p=expressionPresentation(ch,intent);if(p?.image){const im=document.createElement('img');im.className='portrait '+side;im.src=p.image;im.alt=`${actorId} ${p.expression}`;stage.appendChild(im);return}const ph=document.createElement('div');ph.className='portrait-placeholder '+side;ph.textContent=`${actorId}\n${p?.expression||''}\nאין כרגע תצוגת פורטרט זמינה`;stage.appendChild(ph)}
function addVisible(v){
 const h=handle(v.handle),u=imageFor(h);if(!u)return;
 const n=Math.max(1,Math.min(64,Number(v.count)||1)),baseX=Number(v.screenX??.5),baseY=Number(v.screenY??.5);
 for(let i=0;i<n;i++){
  const [dx,dy]=cloneOffset(i,n),slot=Number(h?.atlasSlot||h?.visualSheetsSlot||0);
  let el;
  if(slot>=1&&slot<=12&&/full-visual-sheets\//.test(u)){
   el=document.createElement('div');el.className='visual atlas-tile';el.setAttribute('role','img');el.setAttribute('aria-label',E(v.id));
   const col=(slot-1)%3,row=Math.floor((slot-1)/3);
   el.style.backgroundImage='url("'+u.replace(/"/g,'%22')+'")';
   el.style.backgroundPosition=(col*50)+'% '+(row*(100/3))+'%';
   if(v.screenHeightFraction!=null){el.style.height=(Number(v.screenHeightFraction)*100)+'%';el.style.aspectRatio='.923 / 1'}
   else{el.style.width=(Number(v.screenWidthFraction??.18)*100)+'%';el.style.aspectRatio='.923 / 1'}
  }else{
   const im=document.createElement('img');im.className='visual';im.src=u;im.alt=E(v.id);
   im.onerror=()=>{im.style.display='none';const ph=document.createElement('div');ph.className='portrait-placeholder';ph.style.left=im.style.left;ph.style.top=im.style.top;ph.style.width='16%';ph.textContent=E(v.id);stage.appendChild(ph)};
   if(v.screenHeightFraction!=null)im.style.height=(Number(v.screenHeightFraction)*100)+'%';else im.style.width=(Number(v.screenWidthFraction??.18)*100)+'%';
   el=im;
  }
  el.dataset.subject=E(v.id);el.dataset.baseX=String(baseX+dx);el.dataset.baseY=String(baseY+dy);
  el.style.left=((baseX+dx)*100)+'%';el.style.top=((baseY+dy)*100)+'%';el.style.zIndex=String(depthZ(v.depth));stage.appendChild(el);
 }
}
function fmtTime(s){s=Math.max(0,Number(s)||0);const m=Math.floor(s/60),sec=(s-m*60).toFixed(1).padStart(4,'0');return String(m).padStart(2,'0')+':'+sec}
function beatAtTime(t){for(let i=state.beats.length-1;i>=0;i--)if(t>=state.beatStarts[i])return i;return 0}
function localBeatTime(){return state.currentTime-(state.beatStarts[state.index]||0)}
function updateActiveBeat(){[...timeline.children].forEach((el,i)=>el.classList.toggle('active',i===state.index))}
function updateTransport(){scrub.max=String(state.totalDuration||0);scrub.value=String(Math.min(state.currentTime,state.totalDuration));secondsInput.max=String(state.totalDuration||0);if(!state.secondsEditing)secondsInput.value=Number(state.currentTime||0).toFixed(1);timecode.textContent=fmtTime(state.currentTime)+' / '+fmtTime(state.totalDuration);const label=state.playing?'❚❚ השהה':'▶ נגן';play.textContent=state.playing?'השהה':'נגן';play2.textContent=label;updateActiveBeat()}
function updateMotion(localTime){
 const b=state.beats[state.index];if(!b)return;
 for(const el of stage.querySelectorAll('.visual')){el.style.left=(Number(el.dataset.baseX)*100)+'%';el.style.transform='translate(-50%,-50%)';}
 for(const a of b.actions||[]){
  const start=Number(a.startOffset)||0,dur=Math.max(.05,Number(a.duration)||.1),p=(localTime-start)/dur;if(p<0||p>1)continue;
  const els=[...stage.querySelectorAll('.visual')].filter(el=>el.dataset.subject===E(a.subject));
  if(a.type==='move'){
   const rtl=L(a.travelDirection)==='right_to_left',fly=L(a.motionIntent)==='flyby';
   const from=rtl?(fly?1.12:1.02):(fly?-.12:-.02),to=rtl?(fly?-.12:-.02):(fly?1.12:1.02);
   const eased=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
   for(const el of els)el.style.left=((from+(to-from)*eased)*100)+'%';
  }else if(a.type==='react'){
   const pulse=1+Math.sin(Math.PI*p)*.12;for(const el of els)el.style.transform='translate(-50%,-50%) scale('+pulse.toFixed(3)+')';
  }
 }
}
function setTime(t,keepPlaying=true){
 state.currentTime=Math.max(0,Math.min(state.totalDuration,Number(t)||0));
 const ni=beatAtTime(state.currentTime);if(ni!==state.index){state.index=ni;render(false)}
 updateMotion(localBeatTime());updateTransport();
 if(!keepPlaying)pausePlayback();
}
function pausePlayback(){state.playing=false;if(state.raf)cancelAnimationFrame(state.raf);state.raf=0;state.lastTs=0;updateTransport()}
function tick(ts){if(!state.playing)return;if(!state.lastTs)state.lastTs=ts;state.currentTime+=(ts-state.lastTs)/1000;state.lastTs=ts;if(state.currentTime>=state.totalDuration){state.currentTime=state.totalDuration;setTime(state.currentTime);pausePlayback();return}setTime(state.currentTime);state.raf=requestAnimationFrame(tick)}
function togglePlayback(){if(!state.beats.length)return;if(state.playing){pausePlayback();return}if(state.currentTime>=state.totalDuration)state.currentTime=0;state.playing=true;state.lastTs=0;updateTransport();state.raf=requestAnimationFrame(tick)}
function stopPlayback(){pausePlayback()}
function render(rebuildTimeline=true){stage.innerHTML='';stage.classList.toggle('city',/street|city|civilian/i.test(E(state.movie?.creativeIntent)+' '+E(state.movie?.title)));if(rebuildTimeline)timeline.innerHTML='';const b=state.beats[state.index];if(!b)return;const layer=handle(b.locationHandle,'Layer'),bg=imageFor(layer);if(bg){const im=document.createElement('img');im.className='background';im.src=bg;stage.appendChild(im)}for(const v of b.visible||[])addVisible(v);const d=(b.dialogue||[])[0];if(d){addPortrait(d.speaker,'left',d.expressionIntent);if(d.listener)addPortrait(d.listener,'right',null);const box=document.createElement('div');box.className='dialogue';box.innerHTML='<b>'+X(d.speaker)+'</b>: '+X(d.text);stage.appendChild(box)}raw.textContent=JSON.stringify(b,null,2);if(rebuildTimeline)state.beats.forEach((x,i)=>{const e=document.createElement('div');e.className='beat'+(i===state.index?' active':'');e.innerHTML='<b>'+X(x.id)+'</b><small>'+X(x.type)+' · '+X(x.durationSeconds)+'s</small>';e.onclick=()=>{pausePlayback();setTime(state.beatStarts[i]||0)};timeline.appendChild(e)});updateMotion(localBeatTime());play.disabled=!state.beats.length;play2.disabled=!state.beats.length;prev.disabled=state.index<=0;next.disabled=state.index>=state.beats.length-1;updateTransport()}
function load(o,name='JSON'){stopPlayback();if(!state.ready){diag.innerHTML='<span class=bad>חוזה CURRENT עדיין לא מוכן.</span>';return}const se=schemaErrors(o);if(se.length){drop.className='drop bad';diag.innerHTML='<b class=bad>SCRIPT_INVALID</b><br>'+se.slice(0,40).map(x=>'<span class=bad>'+X(x)+'</span>').join('<br>');return}const ae=authoringErrors(o);if(ae.length){drop.className='drop bad';diag.innerHTML='<b class=bad>AUTHORING_INVALID</b><br>'+ae.slice(0,40).map(x=>'<span class=bad>'+X(x)+'</span>').join('<br>');return}state.movie=o;state.beats=o.beats||[];state.index=0;state.currentTime=0;state.beatStarts=[];let acc=0;for(const b of state.beats){state.beatStarts.push(acc);acc+=Math.max(.15,Number(b.durationSeconds)||1)}state.totalDuration=acc;drop.className='drop good';drop.textContent=`${name} · מוכן לתצוגה`;const silentWarning=!state.audioAvailable?'AUDIO_UNAVAILABLE_IN_CURRENT · YELLOW · No CURRENT Audio handles are published. A silent cutscene is legal and non-blocking.<br>':'';diag.innerHTML='<b class=ok>מוכן לתצוגה</b><br><span class=warn>'+silentWarning+'זוהי בדיקת Web מקדימה. הכמויות והפורטרטים מוצגים כאן, ו־Unity נשאר הסמכות הסופית ל־Runtime.</span>';render()}
async function read(f){try{load(JSON.parse(await f.text()),f.name)}catch(e){drop.className='drop bad';diag.innerHTML='<b class=bad>SCRIPT_INVALID</b><br>'+X(e.message)}}
file.onchange=e=>e.target.files[0]&&read(e.target.files[0]);for(const ev of ['dragenter','dragover'])drop.addEventListener(ev,e=>{e.preventDefault()});drop.addEventListener('drop',e=>{e.preventDefault();e.dataTransfer.files[0]&&read(e.dataTransfer.files[0])});play.onclick=togglePlayback;play2.onclick=togglePlayback;scrub.oninput=()=>{pausePlayback();setTime(Number(scrub.value),false)};secondsInput.onfocus=()=>{state.secondsEditing=true};secondsInput.onblur=()=>{const v=Number(secondsInput.value);state.secondsEditing=false;pausePlayback();setTime(v,false)};secondsInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();secondsInput.blur();}};prev.onclick=()=>{if(state.index>0){pausePlayback();setTime(state.beatStarts[state.index-1]||0)}};next.onclick=()=>{if(state.index<state.beats.length-1){pausePlayback();setTime(state.beatStarts[state.index+1]||0)}};boot();
</script>
