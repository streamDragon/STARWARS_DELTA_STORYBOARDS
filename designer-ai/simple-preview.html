<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>DEVORA - Simple Cutscene Preview</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color-scheme:dark;--bg:#080b12;--panel:#111827;--line:#334155;--muted:#94a3b8;--ok:#75e0a0;--warn:#f3c969;--bad:#ff7f8c;--blue:#6ea8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef4ff}header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between}h1{margin:0;font-size:20px}.sub,.status{font-size:11px;color:var(--muted);margin-top:5px}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}.btn{display:inline-block;border:1px solid #475569;background:#172033;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;text-decoration:none;cursor:pointer}.btn.primary{background:#315fff}.btn:disabled{opacity:.4}.drop{margin:14px;padding:16px;text-align:center;border:2px dashed #475569;border-radius:12px;color:#b4c0cf}.drop.good{border-color:#3d7d58}.drop.bad{border-color:#8a3e49;color:#ffd2d7}main{max-width:1480px;margin:auto;padding:0 14px 24px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 450px;gap:12px}.stage{aspect-ratio:16/9;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at 35% 35%,#243352,#070a12 58%,#020309 100%)}.background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85;z-index:0}.visual,.portrait{position:absolute;object-fit:contain;transform:translate(-50%,-50%)}.portrait{top:48%;height:68%;width:34%;z-index:80}.portrait.left{left:25%}.portrait.right{left:75%}.portrait-placeholder{position:absolute;top:48%;transform:translate(-50%,-50%);width:30%;padding:10px;border:1px dashed var(--warn);border-radius:8px;background:#17120ae8;color:#ffe7a6;font-size:10px;text-align:center;z-index:80}.portrait-placeholder.left{left:25%}.portrait-placeholder.right{left:75%}.dialogue{position:absolute;left:4%;right:4%;bottom:4%;background:#05070bee;border:1px solid #475569;border-radius:8px;padding:9px 11px;font-size:13px;z-index:100}.timeline{display:flex;gap:7px;overflow:auto;padding:10px 0}.beat{min-width:150px;border:1px solid #3b465c;background:#151e2e;border-radius:8px;padding:8px;cursor:pointer}.beat.active{outline:2px solid var(--blue)}.beat small{display:block;color:var(--muted);font-size:9px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:12px}.kv{font-size:10px;line-height:1.55;word-break:break-word}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}pre{font-size:9px;white-space:pre-wrap;max-height:360px;overflow:auto}@media(max-width:980px){.grid{grid-template-columns:1fr}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ajv/8.17.1/ajv2020.bundle.min.js"></script>
</head>
<body>
<header>
<div><h1>DEVORA - Simple Cutscene Preview</h1><div class="sub">Exact CURRENT schema and handles. Dialogue portraits, visible counts and beat playback are previewed without inventing Unity runtime behavior.</div><div id="status" class="status">Loading CURRENT contract...</div></div>
<div><label class="btn primary">LOAD JSON<input id="file" type="file" accept=".json" hidden></label> <button id="play" class="btn" disabled>PLAY</button> <button id="prev" class="btn" disabled>PREV</button> <button id="next" class="btn" disabled>NEXT</button> <a class="btn" href="devora.html">BACK</a></div>
</header>
<div id="drop" class="drop">Drop CUTSCENE_SCRIPT_V1 here.</div>
<main><div class="grid"><section><div id="stage" class="stage"></div><div id="timeline" class="timeline"></div></section><aside class="panel"><b>Preflight</b><div id="diag" class="kv">Nothing loaded.</div><hr><b>Current Beat</b><pre id="raw">-</pre></aside></div></main>
<script>
const $=s=>document.querySelector(s),E=v=>String(v??''),L=v=>E(v).trim().toLowerCase(),X=v=>E(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K=['catalogRevision','contractRevision','schemaHash','snapshotContentHash','authoringRuleRegistryRevision'];
const same=(a,b)=>K.every(k=>E(a?.[k])!==''&&E(a[k])===E(b?.[k])),tx=o=>E(o?.publishTransactionId||o?.atomicIdentity?.publishTransactionId||o?.provenance?.publishTransactionId);
const file=$('#file'),drop=$('#drop'),stage=$('#stage'),timeline=$('#timeline'),diag=$('#diag'),raw=$('#raw'),play=$('#play'),prev=$('#prev'),next=$('#next'),status=$('#status');
let state={ready:false,validate:null,handles:new Map(),visual:new Map(),dialogue:new Map(),audioAvailable:false,beats:[],index:0,timer:null,playing:false};
async function get(url,opt=false){const u=new URL(url,location.href);u.searchParams.set('_p',Date.now()+Math.random());const r=await fetch(u,{cache:'no-store'});if(opt&&r.status===404)return null;if(!r.ok)throw Error(url+' HTTP '+r.status);return r.json()}
function entries(o){return Array.isArray(o?.entries)?o.entries:Array.isArray(o?.assets)?o.assets:[]}
function imageOf(e){for(const k of ['representativeImageUrl','previewUrl','thumbnailUrl','imageUrl','pageImageUrl'])if(e?.[k])return e[k];return''}
function handle(id,route){const h=state.handles.get(L(id));return h&&(!route||h.route===route)?h:null}
function imageFor(h){if(!h)return'';for(const id of [h.runtimeId,h.visualReferenceId,h.catalogRecordId,h.recordId,h.stableId]){const u=state.visual.get(L(id));if(u)return u}return imageOf(h)}
function imageForRuntimeId(id){return state.visual.get(L(id))||''}
function expressionPresentation(ch,intent){if(!ch)return null;const expression=E(intent||ch.defaultExpression);const presentationHandle=E(ch.expressionPresentationHandles?.[expression]||(expression===E(ch.defaultExpression)?ch.defaultPresentationHandle:''));return {expression,presentationHandle,image:imageForRuntimeId(presentationHandle)}}
function depthZ(depth){return {far:10,background:20,mid:40,foreground:60,ui:90}[L(depth)]||40}
function cloneOffset(i,n){if(n<=1)return [0,0];const cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols),c=i%cols,r=Math.floor(i/cols);return [(c-(cols-1)/2)*0.035,(r-(rows-1)/2)*0.05]}
async function boot(){try{
 if(typeof ajv2020==='undefined')throw Error('Ajv 8.17.1 failed to load');
 const [source,open,schema,handles,lookup,dialogue]=await Promise.all([
  get('current.json'),get('open-current/OPEN_CURRENT.json'),get('open-current/simple-authoring/CUTSCENE_SCRIPT_V1.schema.json'),get('open-current/simple-authoring/AUTHORING_HANDLES.json'),get('open-current/ASSET_VISUAL_LOOKUP.json'),get('open-current/EMOTIONAL_DIALOGUE_CURRENT.json',true)
 ]);
 if(source.status!=='CURRENT_VERIFIED'||open.status!=='CURRENT_VERIFIED'||tx(source)!==tx(open)||!same(source.requiredCurrent,open.requiredCurrent)||!same(open.requiredCurrent,handles.requiredCurrent)||tx(lookup)!==tx(open))throw Error('CURRENT identity mismatch');
 const ajv=new ajv2020({allErrors:true,strict:false,allowUnionTypes:true});state.validate=ajv.compile(schema);
 for(const h of handles.handles||[]){state.handles.set(L(h.handle),h);if(h.route==='Audio')state.audioAvailable=true;}
 const ve=entries(lookup);for(const map of ['assetIdToEntryIndex','catalogRecordIdToEntryIndex','recordIdToEntryIndex','stableIdToEntryIndex','sourceIdToEntryIndex'])for(const [id,i] of Object.entries(lookup[map]||{})){const u=imageOf(ve[+i]);if(u)state.visual.set(L(id),u)}
 if(dialogue&&dialogue.status==='CURRENT_VERIFIED_EMOTIONAL_DIALOGUE'&&tx(dialogue)===tx(open)&&same(dialogue.requiredCurrent,open.requiredCurrent))for(const c of dialogue.characters||[])if(c.authoringReady===true)state.dialogue.set(E(c.actorId),c);
 state.ready=true;status.className='status ok';status.textContent=`CURRENT ${tx(open)} · SCHEMA READY · ${state.handles.size} handles · ${state.dialogue.size} dialogue characters · PIXELS READY`;
}catch(e){status.className='status bad';status.textContent='CURRENT_INVALID · '+e.message}}
function schemaErrors(o){const ok=state.validate(o);if(ok)return[];return(state.validate.errors||[]).map(e=>`${e.instancePath||'/'} ${e.message||e.keyword}`)}
function authoringErrors(o){const out=[],talkers=new Set();for(const b of o.beats||[])for(const d of b.dialogue||[]){if(d.speaker)talkers.add(E(d.speaker));if(d.listener)talkers.add(E(d.listener))}for(const c of o.cast||[])if(!talkers.has(E(c.id))&&!handle(c.identityHandle,'Actor'))out.push(`cast.${c.id} Actor handle unresolved: ${c.identityHandle}`);for(const b of o.beats||[]){if(b.locationHandle&&!handle(b.locationHandle,'Layer'))out.push(`beat.${b.id} Layer handle unresolved: ${b.locationHandle}`);for(const v of b.visible||[])if(!handle(v.handle))out.push(`beat.${b.id}.${v.id} handle unresolved: ${v.handle}`);for(const a of b.audio||[])if(!handle(a.handle,'Audio'))out.push(`beat.${b.id} Audio handle unresolved: ${a.handle}`);for(const d of b.dialogue||[]){for(const role of ['speaker','listener']){const id=E(d[role]);if(!id)continue;const cast=(o.cast||[]).find(c=>E(c.id)===id),ch=state.dialogue.get(id);if(!cast||!ch||E(cast.identityHandle)!==E(ch.identityHandle))out.push(`beat.${b.id} dialogue ${role} outside CURRENT repertoire: ${id}`)}const ch=state.dialogue.get(E(d.speaker));if(ch){const ex=E(d.expressionIntent||ch.defaultExpression);if(!(ch.supportedExpressions||[]).includes(ex))out.push(`beat.${b.id} unsupported expression ${d.speaker}: ${ex}`)}}}return out}
function addPortrait(actorId,side,intent){const ch=state.dialogue.get(E(actorId));if(!ch)return;const p=expressionPresentation(ch,intent);if(p?.image){const im=document.createElement('img');im.className='portrait '+side;im.src=p.image;im.alt=`${actorId} ${p.expression}`;stage.appendChild(im);return}const ph=document.createElement('div');ph.className='portrait-placeholder '+side;ph.textContent=`${actorId}\n${p?.expression||''}\nportrait pixel evidence unavailable`;stage.appendChild(ph)}
function addVisible(v){const h=handle(v.handle),u=imageFor(h);if(!u)return;const n=Math.max(1,Math.min(64,Number(v.count)||1)),baseX=Number(v.screenX??.5),baseY=Number(v.screenY??.5);for(let i=0;i<n;i++){const [dx,dy]=cloneOffset(i,n),im=document.createElement('img');im.className='visual';im.src=u;im.alt=E(v.id);im.style.left=((baseX+dx)*100)+'%';im.style.top=((baseY+dy)*100)+'%';if(v.screenHeightFraction!=null)im.style.height=(Number(v.screenHeightFraction)*100)+'%';else im.style.width=(Number(v.screenWidthFraction??.18)*100)+'%';im.style.zIndex=String(depthZ(v.depth));stage.appendChild(im)}}
function stopPlayback(){if(state.timer){clearTimeout(state.timer);state.timer=null}state.playing=false;play.textContent='PLAY'}
function scheduleBeat(){stopPlayback();if(!state.beats.length)return;state.playing=true;play.textContent='STOP';const seconds=Math.max(.15,Number(state.beats[state.index]?.durationSeconds)||1);state.timer=setTimeout(()=>{if(state.index<state.beats.length-1){state.index++;render();scheduleBeat()}else stopPlayback()},seconds*1000)}
function render(){stage.innerHTML='';timeline.innerHTML='';const b=state.beats[state.index];if(!b)return;const layer=handle(b.locationHandle,'Layer'),bg=imageFor(layer);if(bg){const im=document.createElement('img');im.className='background';im.src=bg;stage.appendChild(im)}for(const v of b.visible||[])addVisible(v);const d=(b.dialogue||[])[0];if(d){addPortrait(d.speaker,'left',d.expressionIntent);if(d.listener)addPortrait(d.listener,'right',null);const box=document.createElement('div');box.className='dialogue';box.innerHTML='<b>'+X(d.speaker)+'</b>: '+X(d.text);stage.appendChild(box)}raw.textContent=JSON.stringify(b,null,2);state.beats.forEach((x,i)=>{const e=document.createElement('div');e.className='beat'+(i===state.index?' active':'');e.innerHTML='<b>'+X(x.id)+'</b><small>'+X(x.type)+' · '+X(x.durationSeconds)+'s</small>';e.onclick=()=>{stopPlayback();state.index=i;render()};timeline.appendChild(e)});play.disabled=!state.beats.length;prev.disabled=state.index<=0;next.disabled=state.index>=state.beats.length-1}
function load(o,name='JSON'){stopPlayback();if(!state.ready){diag.innerHTML='<span class=bad>CURRENT_INVALID · contract not ready.</span>';return}const se=schemaErrors(o);if(se.length){drop.className='drop bad';diag.innerHTML='<b class=bad>SCRIPT_INVALID</b><br>'+se.slice(0,40).map(x=>'<span class=bad>'+X(x)+'</span>').join('<br>');return}const ae=authoringErrors(o);if(ae.length){drop.className='drop bad';diag.innerHTML='<b class=bad>AUTHORING_INVALID</b><br>'+ae.slice(0,40).map(x=>'<span class=bad>'+X(x)+'</span>').join('<br>');return}state.beats=o.beats||[];state.index=0;drop.className='drop good';drop.textContent=`${name} · PREVIEWABLE`;const silentWarning=!state.audioAvailable?'AUDIO_UNAVAILABLE_IN_CURRENT · YELLOW · No CURRENT Audio handles are published. A silent cutscene is legal and non-blocking.<br>':'';diag.innerHTML='<b class=ok>PREVIEWABLE</b><br><span class=warn>'+silentWarning+'Web preflight only. Counts and dialogue portraits are visualized; Unity remains final runtime authority.</span>';render()}
async function read(f){try{load(JSON.parse(await f.text()),f.name)}catch(e){drop.className='drop bad';diag.innerHTML='<b class=bad>SCRIPT_INVALID</b><br>'+X(e.message)}}
file.onchange=e=>e.target.files[0]&&read(e.target.files[0]);for(const ev of ['dragenter','dragover'])drop.addEventListener(ev,e=>{e.preventDefault()});drop.addEventListener('drop',e=>{e.preventDefault();e.dataTransfer.files[0]&&read(e.dataTransfer.files[0])});play.onclick=()=>state.playing?stopPlayback():scheduleBeat();prev.onclick=()=>{if(state.index>0){stopPlayback();state.index--;render()}};next.onclick=()=>{if(state.index<state.beats.length-1){stopPlayback();state.index++;render()}};boot();
</script>
</body>
</html>
