<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>DEVORA - Simple Cutscene Preview</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color-scheme:dark;--bg:#080b12;--panel:#111827;--line:#334155;--muted:#94a3b8;--ok:#75e0a0;--warn:#f3c969;--bad:#ff7f8c;--blue:#6ea8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef4ff}header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between}h1{margin:0;font-size:20px}.sub,.status{font-size:11px;color:var(--muted);margin-top:5px}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}.btn{display:inline-block;border:1px solid #475569;background:#172033;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;text-decoration:none;cursor:pointer}.btn.primary{background:#315fff}.btn:disabled{opacity:.4}.drop{margin:14px;padding:16px;text-align:center;border:2px dashed #475569;border-radius:12px;color:#b4c0cf}.drop.good{border-color:#3d7d58}.drop.bad{border-color:#8a3e49;color:#ffd2d7}main{max-width:1480px;margin:auto;padding:0 14px 24px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 450px;gap:12px}.stage{aspect-ratio:16/9;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at 35% 35%,#243352,#070a12 58%,#020309 100%)}.background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}.visual{position:absolute;object-fit:contain;transform:translate(-50%,-50%)}.dialogue{position:absolute;left:4%;right:4%;bottom:4%;background:#05070bee;border:1px solid #475569;border-radius:8px;padding:9px 11px;font-size:13px}.timeline{display:flex;gap:7px;overflow:auto;padding:10px 0}.beat{min-width:150px;border:1px solid #3b465c;background:#151e2e;border-radius:8px;padding:8px;cursor:pointer}.beat.active{outline:2px solid var(--blue)}.beat small{display:block;color:var(--muted);font-size:9px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:12px}.kv{font-size:10px;line-height:1.55;word-break:break-word}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}pre{font-size:9px;white-space:pre-wrap;max-height:360px;overflow:auto}@media(max-width:980px){.grid{grid-template-columns:1fr}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ajv/8.17.1/ajv2020.bundle.min.js"></script>
</head>
<body>
<header>
<div><h1>DEVORA - Simple Cutscene Preview</h1><div class="sub">Schema first. Exact CURRENT second. Unity remains final runtime authority.</div><div id="status" class="status">Loading CURRENT contract...</div></div>
<div><label class="btn primary">LOAD JSON<input id="file" type="file" accept=".json" hidden></label> <button id="prev" class="btn" disabled>PREV</button> <button id="next" class="btn" disabled>NEXT</button> <a class="btn" href="devora.html">BACK</a></div>
</header>
<div id="drop" class="drop">Drop CUTSCENE_SCRIPT_V1 here.</div>
<main><div class="grid"><section><div id="stage" class="stage"></div><div id="timeline" class="timeline"></div></section><aside class="panel"><b>Preflight</b><div id="diag" class="kv">Nothing loaded.</div><hr><b>Current Beat</b><pre id="raw">-</pre></aside></div></main>
<script>
const $=s=>document.querySelector(s),E=v=>String(v??''),L=v=>E(v).trim().toLowerCase(),X=v=>E(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K=['catalogRevision','contractRevision','schemaHash','snapshotContentHash','authoringRuleRegistryRevision'];
const same=(a,b)=>K.every(k=>E(a?.[k])!==''&&E(a[k])===E(b?.[k])),tx=o=>E(o?.publishTransactionId||o?.atomicIdentity?.publishTransactionId||o?.provenance?.publishTransactionId);
const file=$('#file'),drop=$('#drop'),stage=$('#stage'),timeline=$('#timeline'),diag=$('#diag'),raw=$('#raw'),prev=$('#prev'),next=$('#next'),status=$('#status');
let state={ready:false,validate:null,handles:new Map(),visual:new Map(),dialogue:new Map(),beats:[],index:0};
async function get(url,opt=false){const u=new URL(url,location.href);u.searchParams.set('_p',Date.now()+Math.random());const r=await fetch(u,{cache:'no-store'});if(opt&&r.status===404)return null;if(!r.ok)throw Error(url+' HTTP '+r.status);return r.json()}
function entries(o){return Array.isArray(o?.entries)?o.entries:Array.isArray(o?.assets)?o.assets:[]}
function imageOf(e){for(const k of ['representativeImageUrl','previewUrl','thumbnailUrl','imageUrl','pageImageUrl'])if(e?.[k])return e[k];return''}
function handle(id,route){const h=state.handles.get(L(id));return h&&(!route||h.route===route)?h:null}
function imageFor(h){if(!h)return'';for(const id of [h.runtimeId,h.visualReferenceId,h.catalogRecordId,h.recordId,h.stableId]){const u=state.visual.get(L(id));if(u)return u}return imageOf(h)}
async function boot(){try{
 if(typeof ajv2020==='undefined')throw Error('Ajv 8.17.1 failed to load');
 const [source,open,schema,handles,lookup,dialogue]=await Promise.all([
  get('current.json'),
  get('open-current/OPEN_CURRENT.json'),
  get('open-current/simple-authoring/CUTSCENE_SCRIPT_V1.schema.json'),
  get('open-current/simple-authoring/AUTHORING_HANDLES.json'),
  get('open-current/ASSET_VISUAL_LOOKUP.json'),
  get('open-current/EMOTIONAL_DIALOGUE_CURRENT.json',true)
 ]);
 if(source.status!=='CURRENT_VERIFIED'||open.status!=='CURRENT_VERIFIED_OPEN'||tx(source)!==tx(open)||!same(source.requiredCurrent,open.requiredCurrent)||!same(open.requiredCurrent,handles.requiredCurrent)||tx(lookup)!==tx(open))throw Error('CURRENT identity mismatch');
 const ajv=new ajv2020({allErrors:true,strict:false,allowUnionTypes:true});state.validate=ajv.compile(schema);
 for(const h of handles.handles||[])state.handles.set(L(h.handle),h);
 const ve=entries(lookup);for(const map of ['assetIdToEntryIndex','catalogRecordIdToEntryIndex','recordIdToEntryIndex','stableIdToEntryIndex','sourceIdToEntryIndex'])for(const [id,i] of Object.entries(lookup[map]||{})){const u=imageOf(ve[+i]);if(u)state.visual.set(L(id),u)}
 if(dialogue&&dialogue.status==='CURRENT_VERIFIED_EMOTIONAL_DIALOGUE'&&tx(dialogue)===tx(open)&&same(dialogue.requiredCurrent,open.requiredCurrent))for(const c of dialogue.characters||[])if(c.authoringReady===true)state.dialogue.set(E(c.actorId),c);
 state.ready=true;status.className='status ok';status.textContent=`CURRENT ${tx(open)} · SCHEMA READY · ${state.handles.size} handles · ${state.dialogue.size} dialogue characters · PIXELS READY`;
}catch(e){status.className='status bad';status.textContent='CURRENT_INVALID · '+e.message}}
function schemaErrors(o){const ok=state.validate(o);if(ok)return[];return(state.validate.errors||[]).map(e=>`${e.instancePath||'/'} ${e.message||e.keyword}`)}
function authoringErrors(o){const out=[],talkers=new Set();for(const b of o.beats||[])for(const d of b.dialogue||[]){if(d.speaker)talkers.add(E(d.speaker));if(d.listener)talkers.add(E(d.listener))}for(const c of o.cast||[])if(!talkers.has(E(c.id))&&!handle(c.identityHandle,'Actor'))out.push(`cast.${c.id} Actor handle unresolved: ${c.identityHandle}`);for(const b of o.beats||[]){if(b.locationHandle&&!handle(b.locationHandle,'Layer'))out.push(`beat.${b.id} Layer handle unresolved: ${b.locationHandle}`);for(const v of b.visible||[])if(!handle(v.handle))out.push(`beat.${b.id}.${v.id} handle unresolved: ${v.handle}`);for(const a of b.audio||[])if(!handle(a.handle,'Audio'))out.push(`beat.${b.id} Audio handle unresolved: ${a.handle}`);for(const d of b.dialogue||[]){for(const role of ['speaker','listener']){const id=E(d[role]);if(!id)continue;const cast=(o.cast||[]).find(c=>E(c.id)===id),ch=state.dialogue.get(id);if(!cast||!ch||E(cast.identityHandle)!==E(ch.identityHandle))out.push(`beat.${b.id} dialogue ${role} outside CURRENT repertoire: ${id}`)}const ch=state.dialogue.get(E(d.speaker));if(ch){const ex=E(d.expressionIntent||ch.defaultExpression);if(!(ch.supportedExpressions||[]).includes(ex))out.push(`beat.${b.id} unsupported expression ${d.speaker}: ${ex}`)}}}return out}
function render(){stage.innerHTML='';timeline.innerHTML='';const b=state.beats[state.index];if(!b)return;const layer=handle(b.locationHandle,'Layer'),bg=imageFor(layer);if(bg){const im=document.createElement('img');im.className='background';im.src=bg;stage.appendChild(im)}for(const v of b.visible||[]){const h=handle(v.handle),u=imageFor(h);if(!u)continue;const im=document.createElement('img');im.className='visual';im.src=u;im.style.left=((v.screenX??.5)*100)+'%';im.style.top=((v.screenY??.5)*100)+'%';im.style.width=((v.screenWidthFraction??.18)*100)+'%';stage.appendChild(im)}const d=(b.dialogue||[])[0];if(d){const box=document.createElement('div');box.className='dialogue';box.innerHTML='<b>'+X(d.speaker)+'</b>: '+X(d.text);stage.appendChild(box)}raw.textContent=JSON.stringify(b,null,2);state.beats.forEach((x,i)=>{const e=document.createElement('div');e.className='beat'+(i===state.index?' active':'');e.innerHTML='<b>'+X(x.id)+'</b><small>'+X(x.type)+' · '+X(x.durationSeconds)+'s</small>';e.onclick=()=>{state.index=i;render()};timeline.appendChild(e)});prev.disabled=state.index<=0;next.disabled=state.index>=state.beats.length-1}
function load(o,name='JSON'){if(!state.ready){diag.innerHTML='<span class=bad>CURRENT_INVALID · contract not ready.</span>';return}const se=schemaErrors(o);if(se.length){drop.className='drop bad';diag.innerHTML='<b class=bad>SCRIPT_INVALID</b><br>'+se.slice(0,40).map(x=>'<span class=bad>'+X(x)+'</span>').join('<br>');return}const ae=authoringErrors(o);if(ae.length){drop.className='drop bad';diag.innerHTML='<b class=bad>AUTHORING_INVALID</b><br>'+ae.slice(0,40).map(x=>'<span class=bad>'+X(x)+'</span>').join('<br>');return}state.beats=o.beats||[];state.index=0;drop.className='drop good';drop.textContent=`${name} · PREVIEWABLE`;diag.innerHTML='<b class=ok>PREVIEWABLE</b><br><span class=warn>Web preflight only. This does not mean UNITY_VALIDATED or PREVIEW_ACCEPTED.</span>';render()}
async function read(f){try{load(JSON.parse(await f.text()),f.name)}catch(e){drop.className='drop bad';diag.innerHTML='<b class=bad>SCRIPT_INVALID</b><br>'+X(e.message)}}
file.onchange=e=>e.target.files[0]&&read(e.target.files[0]);for(const ev of ['dragenter','dragover'])drop.addEventListener(ev,e=>{e.preventDefault()});drop.addEventListener('drop',e=>{e.preventDefault();e.dataTransfer.files[0]&&read(e.dataTransfer.files[0])});prev.onclick=()=>{if(state.index>0){state.index--;render()}};next.onclick=()=>{if(state.index<state.beats.length-1){state.index++;render()}};boot();
</script>
</body>
</html>
