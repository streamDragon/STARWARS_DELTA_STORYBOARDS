<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>DEVORA - Simple Cutscene Preview</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color-scheme:dark;--bg:#080b12;--panel:#101724;--line:#30384d;--muted:#91a1b6;--ok:#73e09d;--warn:#f2c85b;--bad:#ff7885}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef4ff}header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;justify-content:space-between;position:sticky;top:0;background:#080b12f2;z-index:50}h1{font-size:19px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:4px}.status{font-size:10px;margin-top:5px;color:var(--warn);max-width:1050px}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}.controls{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #414a61;background:#19202e;color:#fff;border-radius:8px;padding:9px 12px;font-weight:850;text-decoration:none;cursor:pointer}.btn.primary{background:#315fff;border-color:#315fff}.btn:disabled{opacity:.42}main{max-width:1580px;margin:auto;padding:14px}.drop{border:2px dashed #414a61;border-radius:12px;padding:13px;text-align:center;color:#aab5c8;margin-bottom:12px;cursor:pointer}.drop.good{border-color:#396e50;color:#c9f4d8}.drop.bad{border-color:#813946;color:#ffd2d7}.grid{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:12px}.stage{aspect-ratio:16/9;background:#020309;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}.world{position:absolute;inset:0;z-index:1;transition:transform .35s ease}.background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:.88}.fallback{position:absolute;inset:0;background:radial-gradient(circle at 35% 35%,#243352,#070a12 58%,#020309 100%);z-index:1}.visual,.portrait{position:absolute;object-fit:contain;transform:translate(-50%,-50%);z-index:11;filter:drop-shadow(0 8px 16px #000b)}.portrait{top:52%;height:72%;width:36%}.portrait.left{left:27%}.portrait.right{left:73%}.placeholder{position:absolute;transform:translate(-50%,-50%);z-index:12;padding:8px;border:1px dashed var(--bad);border-radius:7px;background:#2b1015e8;color:#ffd3d7;font-size:9px}.beatInfo{position:absolute;left:14px;right:14px;bottom:12px;z-index:42;text-shadow:0 2px 8px #000}.beatTitle{font-size:17px;font-weight:950}.beatMeta{font-size:10px;color:#c1cbdb;margin-top:3px}.dialogue{margin-top:6px;background:#05070be8;border:1px solid #414a61;border-radius:7px;padding:7px 9px;max-width:850px;font-size:12px}.toolbar{display:flex;align-items:center;gap:10px;margin:10px 0}.scrub{flex:1}.timeline{display:flex;gap:6px;overflow:auto;padding:5px 0 10px}.beat{min-width:150px;border:1px solid #364057;background:#151c2a;border-radius:8px;padding:8px;cursor:pointer}.beat.active{outline:2px solid #6687ff}.beat b{display:block;font-size:11px}.beat small{color:#8f9caf;font-size:9px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:12px}.panel h2{font-size:13px;margin:0 0 8px}.kv{font-size:10px;line-height:1.55;color:#bac4d5;word-break:break-word}.okText{color:var(--ok)}.warnText{color:var(--warn)}.badText{color:var(--bad)}pre{font-size:9px;white-space:pre-wrap;max-height:300px;overflow:auto}.pill{display:inline-block;border:1px solid #3b465e;border-radius:999px;padding:2px 6px;margin:2px;font-size:8px}@media(max-width:1000px){.grid{grid-template-columns:1fr}header{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header><div><h1>DEVORA - Simple Cutscene Preview</h1><div class="sub">General cinema resolves from AUTHORING_HANDLES. Dialogue resolves only from the atomic curated Emotional Dialogue repertoire.</div><div id="systemStatus" class="status">Verifying CURRENT…</div></div><div class="controls"><label class="btn primary">LOAD JSON<input id="file" type="file" accept=".json,application/json" hidden></label><button id="play" class="btn" disabled>PLAY</button><button id="prev" class="btn" disabled>PREV</button><button id="next" class="btn" disabled>NEXT</button><a class="btn" href="devora.html">BACK TO DEVORA</a></div></header>
<main><div id="drop" class="drop">Drop CUTSCENE_SCRIPT_V1 here.</div><div class="grid"><section><div id="stage" class="stage"><div class="fallback"></div></div><div class="toolbar"><span id="time">0.0 / 0.0s</span><input id="scrub" class="scrub" type="range" min="0" max="1000" value="0" disabled></div><div id="timeline" class="timeline"></div></section><aside class="panel"><h2>Preflight</h2><div id="diag" class="kv">Nothing loaded.</div><hr><h2>Current Beat</h2><div id="beatDiag" class="kv">-</div><hr><h2>Current JSON</h2><pre id="raw">-</pre></aside></div></main>
<script>
const $=s=>document.querySelector(s),file=$('#file'),drop=$('#drop'),stage=$('#stage'),timeline=$('#timeline'),diag=$('#diag'),beatDiag=$('#beatDiag'),raw=$('#raw'),playBtn=$('#play'),prev=$('#prev'),next=$('#next'),scrub=$('#scrub'),time=$('#time'),systemStatus=$('#systemStatus');
const K=['catalogRevision','contractRevision','schemaHash','snapshotContentHash','authoringRuleRegistryRevision'];
const same=(a,b)=>K.every(k=>String(a?.[k]??'')!==''&&String(a[k])===String(b?.[k]??''));
const tx=o=>String(o?.publishTransactionId||o?.atomicIdentity?.publishTransactionId||o?.provenance?.publishTransactionId||'');
const low=v=>String(v??'').trim().toLowerCase();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cur={ready:false,tx:'',required:null,handles:new Map(),visual:new Map()},dlg={ready:false,reason:'not checked',byActorId:new Map(),locations:new Map()},root=null,beats=[],index=0,elapsed=0,playing=false,last=0,pending=null;
async function fetchJson(url,optional=false){const u=new URL(url,location.href);u.searchParams.set('_p',Date.now()+Math.random());const r=await fetch(u,{cache:'no-store'});if(optional&&r.status===404)return null;if(!r.ok)throw new Error(url+' HTTP '+r.status);return r.json()}
function entries(o){return Array.isArray(o?.entries)?o.entries:Array.isArray(o?.assets)?o.assets:[]}
function imgUrl(e){for(const k of ['representativeImageUrl','previewUrl','thumbnailUrl','imageUrl','pageImageUrl'])if(e?.[k])return e[k];return null}
function resolveGeneral(handle,route){const e=cur.handles.get(low(handle));return e&&(!route||e.route===route)?e:null}
function visualForEntry(e){if(!e)return null;for(const id of [e.runtimeId,e.visualReferenceId]){const u=cur.visual.get(low(id));if(u)return u}return e.pageImageUrl||null}
async function boot(){try{const [source,open,handles,visual]=await Promise.all([fetchJson('current.json'),fetchJson('open-current/OPEN_CURRENT.json'),fetchJson('open-current/simple-authoring/AUTHORING_HANDLES.json'),fetchJson('open-current/ASSET_VISUAL_LOOKUP.json')]);if(source.status!=='CURRENT_VERIFIED'||open.status!=='CURRENT_VERIFIED_OPEN'||tx(source)!==tx(open)||!same(source.requiredCurrent,open.requiredCurrent)||!same(open.requiredCurrent,handles.requiredCurrent))throw new Error('CURRENT identity mismatch');cur.tx=tx(open);cur.required=open.requiredCurrent;for(const h of handles.handles||[])cur.handles.set(low(h.handle),h);const ve=entries(visual);for(const m of ['assetIdToEntryIndex','catalogRecordIdToEntryIndex','recordIdToEntryIndex','stableIdToEntryIndex','sourceIdToEntryIndex'])for(const [id,i] of Object.entries(visual[m]||{})){const u=imgUrl(ve[Number(i)]);if(u)cur.visual.set(low(id),u)}let rep=null;try{rep=await fetchJson('open-current/EMOTIONAL_DIALOGUE_CURRENT.json',true)}catch(e){dlg.reason='repertoire read error: '+String(e.message||e)}if(!rep)dlg.reason='EMOTIONAL_DIALOGUE_CURRENT.json not published';else if(rep.status!=='CURRENT_VERIFIED_EMOTIONAL_DIALOGUE')dlg.reason='repertoire status is not verified';else if(tx(rep)!==cur.tx||!same(rep.requiredCurrent,cur.required))dlg.reason='repertoire is not atomic with CURRENT';else{for(const c of rep.characters||[])if(c.authoringReady===true)dlg.byActorId.set(String(c.actorId),c);for(const l of rep.locations||[])if(l.authoringReady===true)dlg.locations.set(String(l.locationId),l);dlg.ready=dlg.byActorId.size>0;dlg.reason=dlg.ready?`${dlg.byActorId.size} authoring-ready character(s)`:'zero authoring-ready characters'}cur.ready=true;systemStatus.className='status '+(dlg.ready?'ok':'');systemStatus.textContent=`CURRENT VERIFIED ${cur.tx} · ${cur.handles.size.toLocaleString()} general handles · DIALOGUE ${dlg.ready?'READY: '+dlg.reason:'DISABLED: '+dlg.reason}.`;if(pending){const p=pending;pending=null;loadObject(p.obj,p.name)}}catch(e){systemStatus.className='status bad';systemStatus.textContent='CURRENT ERROR · '+String(e.message||e)}}
function dialogueIds(o){const s=new Set();for(const b of o.beats||[])for(const d of b.dialogue||[]){if(d.speaker)s.add(String(d.speaker));if(d.listener)s.add(String(d.listener))}return s}
function generalRefs(o){const out=[],used=dialogueIds(o);for(const c of o.cast||[]){if(!used.has(String(c.id)))out.push(['Actor',c.identityHandle,`cast.${c.id}.identityHandle`]);if(c.presentationHandle&&!used.has(String(c.id)))out.push([null,c.presentationHandle,`cast.${c.id}.presentationHandle`])}for(const b of o.beats||[]){if(b.locationHandle&&!(b.dialogue||[]).length)out.push(['Layer',b.locationHandle,`beat.${b.id}.locationHandle`]);for(const v of b.visible||[])out.push([null,v.handle,`beat.${b.id}.visible.${v.id}`]);for(const a of b.actions||[]){if(a.viaHandle)out.push([null,a.viaHandle,`beat.${b.id}.viaHandle`]);if(a.effectHandle)out.push(['Effect',a.effectHandle,`beat.${b.id}.effectHandle`])}for(const a of b.audio||[])out.push(['Audio',a.handle,`beat.${b.id}.audio.${a.kind}`])}return out}
function dialoguePreflight(o){const lines=[];for(const b of o.beats||[])for(const d of b.dialogue||[])lines.push({beat:b.id,...d});if(!lines.length)return {errors:[],rows:['<span class="okText">DIALOGUE · none requested</span>']};if(!dlg.ready)return {errors:['dialogue disabled'],rows:[`<span class="badText">DIALOGUE AUTHORING DISABLED · ${esc(dlg.reason)}</span>`]};const cast=new Map((o.cast||[]).map(c=>[String(c.id),c])),errors=[],rows=[],checked=new Set();for(const line of lines){for(const role of ['speaker','listener']){const actorId=line[role];if(!actorId)continue;const c=cast.get(String(actorId));if(!c){errors.push(`SIMPLE_DIALOGUE_SPEAKER_UNKNOWN · ${line.beat}.${role} '${actorId}' is not in cast`);continue}const character=dlg.byActorId.get(String(actorId));if(!character){errors.push(`DIALOGUE_CHARACTER_OUTSIDE_REPERTOIRE · '${actorId}' exists in cast but is not authoring-ready`);continue}if(c.id!==character.actorId){errors.push(`DIALOGUE_IDENTITY_MISMATCH · cast id '${c.id}' must exactly equal actorId '${character.actorId}'`);continue}if(String(c.identityHandle)!==String(character.identityHandle)){errors.push(`DIALOGUE_IDENTITY_MISMATCH · ${actorId}.identityHandle does not equal the repertoire identityHandle`);continue}const key=role+':'+actorId;if(!checked.has(key)){rows.push(`<span class="okText">${role.toUpperCase()} · ${esc(actorId)} · curated identity OK</span>`);checked.add(key)}if(role==='speaker'){const expr=line.expressionIntent||character.defaultExpression;if(!Array.isArray(character.supportedExpressions)||!character.supportedExpressions.includes(expr))errors.push(`DIALOGUE_EXPRESSION_OUTSIDE_REPERTOIRE · ${actorId} '${expr}' · supported: ${(character.supportedExpressions||[]).join(', ')}`);else rows.push(`<span class="okText">EXPRESSION · ${esc(actorId)} → ${esc(expr)}</span>`)}}}return {errors:[...new Set(errors)],rows}}
function diagnostics(o){const rows=[],errors=[],warnings=[];for(const [route,ref,where] of generalRefs(o)){const h=resolveGeneral(ref,route);if(!h){errors.push(`UNRESOLVED/WRONG ROUTE · ${where} · ${ref}`);continue}if(h.safeForPreview===false)errors.push(`NOT PREVIEW SAFE · ${where} · ${h.displayName}`);else if(h.safeForPublish===false)warnings.push(`PREVIEW ONLY / NOT PUBLISH READY · ${where} · ${h.displayName}`);else rows.push(`<span class="okText">RESOLVED · ${esc(where)} · ${esc(h.displayName)}</span>`)}const d=dialoguePreflight(o);errors.push(...d.errors);rows.push(...d.rows);for(const e of errors)rows.push(`<span class="badText">${esc(e)}</span>`);for(const w of warnings)rows.push(`<span class="warnText">${esc(w)}</span>`);rows.unshift(`<b class="${errors.length?'badText':warnings.length?'warnText':'okText'}">${errors.length?`BLOCKED · ${errors.length} root problem(s)`:warnings.length?`PREVIEW WITH ${warnings.length} warning(s)`:'CURRENT + DIALOGUE PREFLIGHT PASS'}</b>`);return {html:rows.join('<br>'),blocked:errors.length>0}}
function duration(o){return (o.beats||[]).reduce((s,b)=>s+Number(b.durationSeconds||0),0)}
function loadObject(o,name='JSON'){if(!cur.ready){pending={obj:o,name};drop.textContent='Waiting for CURRENT verification…';return}if(o?.schema!=='STARWARS_DELTA_CUTSCENE_SCRIPT'||o?.schemaVersion!==1||!Array.isArray(o.beats)){drop.className='drop bad';drop.textContent='Not CUTSCENE_SCRIPT_V1';return}const pre=diagnostics(o);diag.innerHTML=pre.html;if(pre.blocked){root=null;beats=[];drop.className='drop bad';drop.textContent=`BLOCKED ${name} · fix preflight before preview`;playBtn.disabled=prev.disabled=next.disabled=scrub.disabled=true;return}root=o;beats=o.beats;index=0;elapsed=0;drop.className='drop good';drop.textContent=`Loaded ${name} · ${beats.length} beats · ${duration(o).toFixed(1)}s`;playBtn.disabled=prev.disabled=next.disabled=scrub.disabled=false;renderAll()}
window.loadObject=loadObject;
function clearStage(){stage.innerHTML='<div class="fallback"></div>'}
function renderDialoguePortrait(actorId,side){const c=(root.cast||[]).find(x=>String(x.id)===String(actorId)),character=dlg.byActorId.get(String(actorId));if(!c||!character)return;const handle=c.presentationHandle||character.defaultPresentationHandle,entry=resolveGeneral(handle,null),url=visualForEntry(entry);if(!url)return;const img=document.createElement('img');img.className='portrait '+side;img.src=url;stage.appendChild(img)}
function renderStage(){clearStage();if(!beats.length)return;const b=beats[index],world=document.createElement('div');world.className='world';stage.appendChild(world);if(!(b.dialogue||[]).length){const loc=resolveGeneral(b.locationHandle,'Layer'),bg=visualForEntry(loc);if(bg){const im=document.createElement('img');im.className='background';im.src=bg;world.appendChild(im)}}const vis=b.visible||[],spread=.035;for(const v of vis){const h=resolveGeneral(v.handle,null),baseX=Number.isFinite(Number(v.screenX))?Number(v.screenX):.5,y=Number.isFinite(Number(v.screenY))?Number(v.screenY):.52,w=Number.isFinite(Number(v.screenWidthFraction))?Number(v.screenWidthFraction):.16,n=Math.max(1,Math.min(12,Number(v.count||1)));for(let i=0;i<n;i++){const x=baseX+(i-(n-1)/2)*spread,u=visualForEntry(h);if(u){const im=document.createElement('img');im.className='visual';im.src=u;im.style.left=(x*100)+'%';im.style.top=(y*100)+'%';im.style.width=(w*100)+'%';world.appendChild(im)}else{const ph=document.createElement('div');ph.className='placeholder';ph.style.left=(x*100)+'%';ph.style.top=(y*100)+'%';ph.textContent=h?.displayName||v.handle;world.appendChild(ph)}}}const first=(b.dialogue||[])[0];if(first){renderDialoguePortrait(first.speaker,'left');if(first.listener)renderDialoguePortrait(first.listener,'right')}const c=b.camera||{};if(c.movement==='push')world.style.transform='scale(1.05)';else if(c.movement==='pull')world.style.transform='scale(.95)';else if(c.movement==='orbit')world.style.transform='translate(1.5%,-1%) scale(1.02)';else if(c.movement==='drift')world.style.transform='translate(1%,0)';const info=document.createElement('div');info.className='beatInfo';info.innerHTML=`<div class="beatTitle">${esc(b.id)} · ${esc(b.type)}</div><div class="beatMeta">${esc(b.cinematicMove||'')} ${b.energy?'· '+esc(b.energy):''} ${c.movement?'· camera '+esc(c.movement):''}</div>${(b.dialogue||[]).map(d=>`<div class="dialogue"><b>${esc(d.speaker)}</b>: ${esc(d.text)} <span class="pill">${esc(d.expressionIntent||dlg.byActorId.get(String(d.speaker))?.defaultExpression||'')}</span></div>`).join('')}`;stage.appendChild(info)}
function renderTimeline(){timeline.innerHTML='';beats.forEach((b,i)=>{const e=document.createElement('div');e.className='beat'+(i===index?' active':'');e.innerHTML=`<b>${esc(b.id)} · ${esc(b.type)}</b><small>${Number(b.durationSeconds||0).toFixed(1)}s · ${esc(b.cinematicMove||b.camera?.movement||'')}</small>`;e.onclick=()=>{index=i;elapsed=0;renderAll()};timeline.appendChild(e)})}
function renderBeatDiag(){const b=beats[index];if(!b){beatDiag.textContent='-';return}beatDiag.innerHTML=[b.dramaticFunction,b.energy,b.cinematicMove,b.camera?.movement].filter(Boolean).map(x=>`<span class="pill">${esc(x)}</span>`).join('')+'<br>'+esc(b.storyClaim||'')}
function renderAll(){renderStage();renderTimeline();renderBeatDiag();raw.textContent=JSON.stringify(beats[index]||root,null,2);scrub.value=beats.length?Math.round(index/Math.max(1,beats.length-1)*1000):0;time.textContent=`${elapsed.toFixed(1)} / ${duration(root).toFixed(1)}s`}
function step(dir){if(!beats.length)return;index=Math.max(0,Math.min(beats.length-1,index+dir));elapsed=0;renderAll()}prev.onclick=()=>step(-1);next.onclick=()=>step(1);playBtn.onclick=()=>{playing=!playing;playBtn.textContent=playing?'PAUSE':'PLAY';if(playing){last=performance.now();requestAnimationFrame(tick)}};function tick(t){if(!playing)return;const dt=(t-last)/1000;last=t;elapsed+=dt;const d=Number(beats[index]?.durationSeconds||1);if(elapsed>=d){elapsed=0;if(index<beats.length-1)index++;else{playing=false;playBtn.textContent='PLAY'}}renderAll();if(playing)requestAnimationFrame(tick)}scrub.oninput=()=>{if(!beats.length)return;index=Math.round(Number(scrub.value)/1000*(beats.length-1));elapsed=0;renderAll()};file.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{loadObject(JSON.parse(await f.text()),f.name)}catch(x){drop.className='drop bad';drop.textContent='JSON error · '+x.message}};drop.ondragover=e=>e.preventDefault();drop.ondrop=async e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;try{loadObject(JSON.parse(await f.text()),f.name)}catch(x){drop.className='drop bad';drop.textContent='JSON error · '+x.message}};boot();
</script>
</body>
