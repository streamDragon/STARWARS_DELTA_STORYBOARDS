name: TEMP Apply Stale Package Metadata Cleanup

on:
  push:
    branches: [silent-audio-current-policy]
    paths:
      - '.github/workflows/_temp_apply_silent_audio_cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: silent-audio-current-policy
      - name: Remove stale top-level authoringPackage metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def remove_member(path, key):
              p = Path(path)
              s = p.read_text(encoding='utf-8-sig')
              needle = '  "' + key + '": {'
              start = s.find(needle)
              if start < 0:
                  return False
              brace = s.find('{', start)
              depth = 0
              in_string = False
              escaped = False
              end = None
              for i in range(brace, len(s)):
                  c = s[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == '"':
                          in_string = False
                      continue
                  if c == '"':
                      in_string = True
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit('UNBALANCED_' + key + ': ' + path)
              j = end
              while j < len(s) and s[j] in ' \t':
                  j += 1
              if j < len(s) and s[j] == ',':
                  j += 1
              if j < len(s) and s[j] == '\r':
                  j += 1
              if j < len(s) and s[j] == '\n':
                  j += 1
              p.write_text(s[:start] + s[j:], encoding='utf-8')
              return True

          for path in ('designer-ai/current.json', 'designer-ai/open-current/OPEN_CURRENT.json'):
              remove_member(path, 'authoringPackage')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add designer-ai/current.json designer-ai/open-current/OPEN_CURRENT.json
          if git diff --cached --quiet; then
            echo NO_CHANGES
            exit 0
          fi
          git commit -m 'Remove stale authoring package metadata'
          git push origin HEAD:silent-audio-current-policy
