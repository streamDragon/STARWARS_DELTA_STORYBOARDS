name: Publish Designer AI Pages CURRENT

on:
  workflow_run:
    workflows: ["Publish Designer AI Open CURRENT"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-designer-ai-pages-current.yml'

permissions:
  contents: write

concurrency:
  group: designer-ai-pages-current
  cancel-in-progress: true

jobs:
  mirror-pages-current:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 1

      - name: Checkout open current
        uses: actions/checkout@v4
        with:
          ref: designer-ai-open-current
          path: open
          fetch-depth: 1

      - name: Mirror complete Director CURRENT to Pages
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/site/designer-ai/open-current"
          SRC="$GITHUB_WORKSPACE/open"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          find "$SRC" -mindepth 1 -maxdepth 1 ! -name .git -exec cp -a {} "$DEST/" \;

          python3 - <<'PY'
          import json
          import pathlib
          root = pathlib.Path('site/designer-ai/open-current')
          current = json.loads((root / 'OPEN_CURRENT.json').read_text(encoding='utf-8'))
          director = json.loads((root / 'director-view' / 'DIRECTOR_VIEW.json').read_text(encoding='utf-8'))
          atlas_manifest = json.loads((root / 'full-visual-sheets' / 'VISUAL_ATLAS_CURRENT.json').read_text(encoding='utf-8'))
          atlas = root / 'full-visual-sheets' / 'STARWARS_DELTA_CHATGPT_VISUAL_ATLAS_CURRENT.pdf'
          assert current['status'] == 'CURRENT_VERIFIED_OPEN'
          assert current['directorView']['requestScoped'] is False
          assert director['sourceCatalogRecordCount'] > 20000
          assert (root / 'STARWARS_DELTA_CHATGPT_DIRECTOR_CURRENT.zip').is_file()
          assert atlas.is_file() and atlas.stat().st_size > 0
          assert current['visualAtlas']['status'] == 'CURRENT_VERIFIED_VISUAL_ATLAS'
          assert current['visualAtlas']['pdfUrl'] == atlas_manifest['pdfUrl']
          assert current['visualAtlas']['publishTransactionId'] == current['publishTransactionId']
          assert atlas_manifest['representativeCount'] > 0
          assert atlas_manifest['totalPages'] > 0
          print('PAGES_DIRECTOR_CURRENT_VALIDATED')
          print('VISUAL_ATLAS_PAGES', atlas_manifest['totalPages'])
          print('VISUAL_ATLAS_REPRESENTATIVES', atlas_manifest['representativeCount'])
          PY

      - name: Commit Pages CURRENT
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add designer-ai/open-current
          if git diff --cached --quiet; then
            echo 'Pages CURRENT already up to date.'
            exit 0
          fi
          git commit -m 'Publish full Designer AI Director CURRENT for ChatGPT'
          git pull --rebase origin main
          git push origin main
