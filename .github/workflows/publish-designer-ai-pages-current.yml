name: Publish Designer AI Pages CURRENT

on:
  workflow_run:
    workflows: ["Publish Designer AI Open CURRENT"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-designer-ai-pages-current.yml'

permissions:
  contents: write

concurrency:
  group: designer-ai-pages-current
  cancel-in-progress: true

jobs:
  mirror-pages-current:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 1

      - name: Checkout open current
        uses: actions/checkout@v4
        with:
          ref: designer-ai-open-current
          path: open
          fetch-depth: 1

      - name: Mirror ChatGPT visual CURRENT to Pages
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/site/designer-ai/open-current"
          SRC="$GITHUB_WORKSPACE/open"
          rm -rf "$DEST"
          mkdir -p "$DEST/authoring/VISUAL_PACK"
          cp "$SRC/OPEN_CURRENT.json" "$DEST/OPEN_CURRENT.json"
          cp "$SRC/SOURCE_CURRENT.json" "$DEST/SOURCE_CURRENT.json"
          cp "$SRC/CHATGPT_VISUAL_INDEX.json" "$DEST/CHATGPT_VISUAL_INDEX.json"
          cp "$SRC/FULL_VISUAL_INDEX.json" "$DEST/FULL_VISUAL_INDEX.json"
          cp "$SRC/ASSET_VISUAL_LOOKUP.json" "$DEST/ASSET_VISUAL_LOOKUP.json"
          cp "$SRC/VISUAL_UNAVAILABLE.json" "$DEST/VISUAL_UNAVAILABLE.json"
          cp "$SRC/STARWARS_DELTA_CHATGPT_VISUAL_CURRENT.zip" "$DEST/STARWARS_DELTA_CHATGPT_VISUAL_CURRENT.zip"
          cp "$SRC/authoring/CATALOG_SUBSET.json" "$DEST/CATALOG_SUBSET.json"
          cp "$SRC/authoring/INSTRUCTION_SUBSET.json" "$DEST/INSTRUCTION_SUBSET.json"
          cp "$SRC/authoring/VISUAL_PACK/proof_manifest.json" "$DEST/authoring/VISUAL_PACK/proof_manifest.json"
          cp -a "$SRC/authoring/VISUAL_PACK/assets" "$DEST/authoring/VISUAL_PACK/assets"
          cp -a "$SRC/full-visual-index" "$DEST/full-visual-index"
          cp -a "$SRC/full-visual-sheets" "$DEST/full-visual-sheets"

      - name: Commit Pages CURRENT
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add designer-ai/open-current
          if git diff --cached --quiet; then
            echo 'Pages CURRENT already up to date.'
            exit 0
          fi
          git commit -m 'Publish Designer AI direct visual CURRENT for ChatGPT'
          git pull --rebase origin main
          git push origin main
