name: Ensure Designer AI CURRENT

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ensure-designer-ai-current.yml'
      - 'designer-ai/current.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: ensure-designer-ai-current
  cancel-in-progress: true

jobs:
  ensure-current:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source CURRENT
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1

      - name: Checkout active Open CURRENT
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: designer-ai-open-current
          path: active
          fetch-depth: 1

      - name: Compare active and source authoring identity
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib

          keys = (
              'catalogRevision',
              'contractRevision',
              'schemaHash',
              'snapshotContentHash',
              'authoringRuleRegistryRevision',
          )

          source = json.loads(pathlib.Path('source/designer-ai/current.json').read_text(encoding='utf-8-sig'))
          source_required = source.get('requiredCurrent') or {}
          if source.get('status') != 'CURRENT_VERIFIED':
              raise SystemExit('Source current.json is not CURRENT_VERIFIED')
          missing = [key for key in keys if str(source_required.get(key) or '') == '']
          if missing:
              raise SystemExit('Source requiredCurrent is incomplete: ' + ', '.join(missing))

          active_path = pathlib.Path('active/OPEN_CURRENT.json')
          if not active_path.is_file():
              print('needs_rebuild=true')
              print('reason=active branch missing')
              raise SystemExit(0)

          active = json.loads(active_path.read_text(encoding='utf-8-sig'))
          active_required = active.get('requiredCurrent') or {}
          mismatch = [key for key in keys if str(source_required.get(key)) != str(active_required.get(key))]
          if active.get('status') != 'CURRENT_VERIFIED_OPEN':
              mismatch.append('status')

          if mismatch:
              print('needs_rebuild=true')
              print('reason=' + ','.join(mismatch))
          else:
              print('needs_rebuild=false')
              print('reason=already-current')
          PY

      - name: Avoid duplicate publisher runs
        id: running
        if: steps.compare.outputs.needs_rebuild == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-designer-ai-open-current.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Existing publisher runs: $count"

      - name: Rebuild atomic Open CURRENT
        if: steps.compare.outputs.needs_rebuild == 'true' && steps.running.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "CURRENT mismatch: ${{ steps.compare.outputs.reason }}"
          gh workflow run publish-designer-ai-open-current.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Report healthy CURRENT
        if: steps.compare.outputs.needs_rebuild == 'false'
        run: echo 'Designer AI CURRENT is already atomic and synchronized.'
