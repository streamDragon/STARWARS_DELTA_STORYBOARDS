name: Project Designer AI Guidance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'designer-ai/tools/current-source/CHATGPT_START.txt'
      - 'designer-ai/tools/current-source/FILM_AUTHORING_GUIDE_CURRENT.md'
      - 'designer-ai/tools/current-source/simple-authoring/**'
      - 'designer-ai/tools/seal_atomic_current.py'
      - 'designer-ai/tools/sanitize_current_surface.py'
      - '.github/workflows/project-designer-ai-guidance.yml'

permissions:
  contents: write

concurrency:
  group: designer-ai-guidance
  cancel-in-progress: true

jobs:
  project-guidance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Assert verified unchanged CURRENT identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          source=json.loads(pathlib.Path('designer-ai/current.json').read_text(encoding='utf-8-sig'))
          opened=json.loads(pathlib.Path('designer-ai/open-current/OPEN_CURRENT.json').read_text(encoding='utf-8-sig'))
          assert source.get('status')=='CURRENT_VERIFIED'
          assert opened.get('status')=='CURRENT_VERIFIED'
          assert source.get('publishTransactionId')==opened.get('publishTransactionId')
          assert source.get('requiredCurrent')==opened.get('requiredCurrent')
          print('GUIDANCE_BASE_CURRENT_VERIFIED', source.get('publishTransactionId'))
          PY

      - name: Clone existing heavy CURRENT stage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _open_current_stage
          mkdir -p _open_current_stage
          cp -a designer-ai/open-current/. _open_current_stage/
          cp designer-ai/tools/current-source/CHATGPT_START.txt _open_current_stage/CHATGPT_START.txt
          cp designer-ai/tools/current-source/FILM_AUTHORING_GUIDE_CURRENT.md _open_current_stage/FILM_AUTHORING_GUIDE_CURRENT.md
          echo 'GUIDANCE_HEAVY_REBUILD_SKIPPED=YES'

      - name: Seal canonical Simple V1 guidance
        shell: bash
        run: |
          set -euo pipefail
          python3 designer-ai/tools/seal_atomic_current.py

      - name: Remove obsolete authoring surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 designer-ai/tools/sanitize_current_surface.py

      - name: Verify lightweight CURRENT projection
        shell: bash
        run: |
          set -euo pipefail
          python3 designer-ai/tools/sanitize_current_surface.py --check
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('_open_current_stage')
          source=json.loads(pathlib.Path('designer-ai/current.json').read_text(encoding='utf-8-sig'))
          opened=json.loads((root/'OPEN_CURRENT.json').read_text(encoding='utf-8-sig'))
          assert opened.get('publishTransactionId')==source.get('publishTransactionId')
          assert opened.get('requiredCurrent')==source.get('requiredCurrent')
          front=(root/'CHATGPT_START.txt').read_text(encoding='utf-8-sig')
          guide=(root/'FILM_AUTHORING_GUIDE_CURRENT.md').read_text(encoding='utf-8-sig')
          architecture=(root/'simple-authoring/ARCHITECTURE.md').read_text(encoding='utf-8-sig')
          assert '`CUTSCENE_SCRIPT_V1`' in architecture and 'only normal public movie-authoring format' in architecture
          assert 'VISIBLE EFFECTS / PARTICLES' in front
          assert 'CUTSCENE PROJECTILES / MISSILES' in front
          assert 'Accepted fixtures and Golden QA' in guide
          assert not (root/'catalog-contract').exists()
          assert not (root/'instruction-book').exists()
          rules=json.loads((root/'simple-authoring/AUTHORING_RULES_CURRENT.json').read_text(encoding='utf-8-sig'))
          assert all(r.get('id')!='V4_RECIPES_ARE_AUTHORING_ONLY' for r in rules.get('rules',[]))
          print('GUIDANCE_PROJECTION_GATE_PASS')
          print('CATALOG_BUILD=NOT_RUN')
          print('VISUAL_ATLAS_BUILD=NOT_RUN')
          print('DIRECTOR_BUILD=NOT_RUN')
          PY

      - name: Publish guidance-only CURRENT projection
        shell: bash
        run: |
          set -euo pipefail
          rm -rf designer-ai/open-current
          mkdir -p designer-ai/open-current
          cp -a _open_current_stage/. designer-ai/open-current/
          git config user.name 'github-actions[bot]'
          git config user.email '41898280+github-actions[bot]@users.noreply.github.com'
          git add -A designer-ai/open-current
          if git diff --cached --quiet; then
            echo 'GUIDANCE_CURRENT_ALREADY_MATCHES'
            exit 0
          fi
          tx="$(python3 -c "import json; print(json.load(open('designer-ai/current.json',encoding='utf-8-sig'))['publishTransactionId'])")"
          git commit -m "Project Designer AI guidance CURRENT $tx"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "GUIDANCE_CURRENT_COMMITTED transaction=$tx"
