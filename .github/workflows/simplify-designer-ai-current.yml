name: Simplify Designer AI CURRENT

on:
  push:
    branches: [main]
    paths:
      - 'designer-ai/SIMPLIFY_CURRENT_TRIGGER.txt'

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Collapse to one CURRENT pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          seal = root / 'designer-ai/tools/seal_atomic_current.py'
          text = seal.read_text(encoding='utf-8')
          old = '''    required_current = {
              "catalogRevision": director.get("catalogRevision"),
              "contractRevision": current.get("contractRevision"),
              "schemaHash": current.get("schemaHash"),
              "snapshotContentHash": director.get("snapshotContentHash"),
              "authoringRuleRegistryRevision": registry_revision,
          }
          '''
          new = '''    required_current = dict(current.get("requiredCurrent") or {})
          required_keys = (
              "catalogRevision",
              "contractRevision",
              "schemaHash",
              "snapshotContentHash",
              "authoringRuleRegistryRevision",
          )
          missing_required = [
              key for key in required_keys
              if required_current.get(key) is None or str(required_current.get(key)).strip() == ""
          ]
          if missing_required:
              raise SystemExit("CURRENT requiredCurrent is incomplete: " + ", ".join(missing_required))
          if str(required_current["catalogRevision"]) != str(director.get("catalogRevision")):
              raise SystemExit("Director catalogRevision does not match CURRENT requiredCurrent")
          if required_current["contractRevision"] != director.get("contractRevision"):
              raise SystemExit("Director contractRevision does not match CURRENT requiredCurrent")
          if required_current["schemaHash"] != director.get("schemaHash"):
              raise SystemExit("Director schemaHash does not match CURRENT requiredCurrent")
          if required_current["snapshotContentHash"] != director.get("snapshotContentHash"):
              raise SystemExit("Director snapshotContentHash does not match CURRENT requiredCurrent")
          if required_current["authoringRuleRegistryRevision"] != registry_revision:
              raise SystemExit("Rule Registry revision does not match CURRENT requiredCurrent")
          '''
          if old not in text or text.count(old) != 1:
              raise SystemExit('Expected required_current reconstruction block was not found exactly once')
          seal.write_text(text.replace(old, new, 1), encoding='utf-8')

          publisher = r'''name: Publish Designer AI CURRENT

          on:
            workflow_dispatch:
            push:
              branches: [main]
              paths:
                - 'designer-ai/current.json'
                - 'designer-ai/CHATGPT_START.txt'
                - 'designer-ai/FILM_AUTHORING_GUIDE_CURRENT.md'
                - 'designer-ai/chatgpt-current.json'
                - 'designer-ai/simple-authoring/**'
                - 'designer-ai/tools/**'

          permissions:
            contents: write

          concurrency:
            group: designer-ai-current
            cancel-in-progress: true

          jobs:
            publish-current:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout main
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 1

                - name: Install builder dependencies
                  run: python3 -m pip install --disable-pip-version-check pillow pypdf

                - name: Build visual evidence CURRENT
                  env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    REPOSITORY: ${{ github.repository }}
                  run: python3 designer-ai/tools/build_open_current.py

                - name: Build unified Visual Atlas
                  run: python3 designer-ai/tools/build_visual_atlas.py

                - name: Finalize visual evidence
                  env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    REPOSITORY: ${{ github.repository }}
                  run: python3 designer-ai/tools/finalize_open_current.py

                - name: Build Director View
                  env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    REPOSITORY: ${{ github.repository }}
                  run: python3 designer-ai/tools/build_director_view.py

                - name: Finalize Director View
                  env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    REPOSITORY: ${{ github.repository }}
                  run: python3 designer-ai/tools/run_director_finalization.py

                - name: Seal CURRENT identity
                  run: python3 designer-ai/tools/seal_atomic_current.py

                - name: Build simple authoring handles
                  run: python3 designer-ai/tools/build_authoring_handles.py

                - name: Validate the single CURRENT
                  shell: bash
                  run: |
                    set -euo pipefail
                    python3 - <<'PY2'
                    import json
                    import pathlib
                    import zipfile
                    from pypdf import PdfReader

                    root = pathlib.Path('_open_current_stage')
                    source = json.loads(pathlib.Path('designer-ai/current.json').read_text(encoding='utf-8-sig'))
                    current = json.loads((root / 'OPEN_CURRENT.json').read_text(encoding='utf-8'))
                    director = json.loads((root / 'director-view' / 'DIRECTOR_VIEW.json').read_text(encoding='utf-8'))
                    manifest = json.loads((root / 'DIRECTOR_PACK_MANIFEST.json').read_text(encoding='utf-8'))
                    handles = json.loads((root / 'simple-authoring' / 'AUTHORING_HANDLES.json').read_text(encoding='utf-8'))
                    required = dict(source.get('requiredCurrent') or {})
                    expected = {'publishTransactionId': source.get('publishTransactionId'), **required}

                    assert source.get('status') == 'CURRENT_VERIFIED'
                    assert current.get('status') == 'CURRENT_VERIFIED_OPEN'
                    assert current.get('publishTransactionId') == source.get('publishTransactionId')
                    assert current.get('requiredCurrent') == required
                    assert director.get('requiredCurrent') == required
                    assert manifest.get('requiredCurrent') == required
                    assert handles.get('requiredCurrent') == required
                    assert current.get('atomicIdentity') == expected
                    assert director.get('atomicIdentity') == expected
                    assert manifest.get('atomicIdentity') == expected
                    assert str(director.get('catalogRevision')) == str(required.get('catalogRevision'))
                    assert director.get('contractRevision') == required.get('contractRevision')
                    assert director.get('schemaHash') == required.get('schemaHash')
                    assert director.get('snapshotContentHash') == required.get('snapshotContentHash')
                    assert handles.get('count', 0) > 0

                    atlas = root / 'full-visual-sheets' / 'STARWARS_DELTA_CHATGPT_VISUAL_ATLAS_CURRENT.pdf'
                    pack = root / 'STARWARS_DELTA_CHATGPT_DIRECTOR_CURRENT.zip'
                    assert atlas.is_file() and len(PdfReader(str(atlas)).pages) > 0
                    assert pack.is_file() and pack.stat().st_size > 0
                    with zipfile.ZipFile(pack) as archive:
                        zipped = json.loads(archive.read('OPEN_CURRENT.json').decode('utf-8-sig'))
                        assert zipped.get('requiredCurrent') == required
                        assert zipped.get('atomicIdentity') == expected
                    print('SINGLE_CURRENT_VALIDATED', source.get('publishTransactionId'))
                    PY2

                - name: Publish one CURRENT directly to Pages source
                  shell: bash
                  run: |
                    set -euo pipefail
                    rm -rf designer-ai/open-current
                    mkdir -p designer-ai/open-current
                    cp -a _open_current_stage/. designer-ai/open-current/
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git add -A designer-ai/open-current
                    if git diff --cached --quiet; then
                      echo 'CURRENT already matches the built payload.'
                      exit 0
                    fi
                    tx="$(python3 - <<'PY3'
                    import json
                    print(json.load(open('designer-ai/current.json', encoding='utf-8-sig'))['publishTransactionId'])
                    PY3
                    )"
                    git commit -m "Publish Designer AI CURRENT $tx"
                    git pull --rebase origin main
                    git push origin HEAD:main
          '''
          publisher = '\n'.join(line[10:] if line.startswith('          ') else line for line in publisher.splitlines()).lstrip() + '\n'
          (root / '.github/workflows/publish-designer-ai-open-current.yml').write_text(publisher, encoding='utf-8')

          remove = [
              '.github/workflows/ensure-designer-ai-current.yml',
              '.github/workflows/publish-designer-ai-pages-current.yml',
              '.github/workflows/chatgpt-action-smoke.yml',
              '.github/workflows/diagnose-designer-ai-open-current.yml',
              '.github/workflows/patch-seal-idempotence.yml',
              '.github/workflows/simplify-designer-ai-current.yml',
              'designer-ai/CHATGPT_ACTION_TRIGGER.txt',
              'designer-ai/CHATGPT_ACTION_SMOKE_RESULT.txt',
              'designer-ai/OPEN_CURRENT_DIAGNOSTIC.txt',
              'designer-ai/OPEN_CURRENT_DIAGNOSTIC_TRIGGER.txt',
              'designer-ai/PATCH_SEAL_IDEMPOTENCE_TRIGGER.txt',
              'designer-ai/SIMPLIFY_CURRENT_TRIGGER.txt',
              'designer-ai/simple-authoring/PUBLISH_TRIGGER_20260823.txt',
          ]
          for item in remove:
              (root / item).unlink(missing_ok=True)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Collapse Designer AI to one CURRENT pipeline'
          git push origin HEAD:main
