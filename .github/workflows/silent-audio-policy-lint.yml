name: Silent Audio Authoring Policy Lint

on:
  push:
    branches: [main]
    paths:
      - 'designer-ai/current.json'
      - 'designer-ai/open-current/OPEN_CURRENT.json'
      - 'designer-ai/open-current/CHATGPT_START.txt'
      - 'designer-ai/tools/current-source/CHATGPT_START.txt'
      - 'designer-ai/simple-preview.html'
      - '.github/workflows/silent-audio-policy-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'designer-ai/current.json'
      - 'designer-ai/open-current/OPEN_CURRENT.json'
      - 'designer-ai/open-current/CHATGPT_START.txt'
      - 'designer-ai/tools/current-source/CHATGPT_START.txt'
      - 'designer-ai/simple-preview.html'
      - '.github/workflows/silent-audio-policy-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify silent cutscenes are explicitly non-blocking
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SILENT AUDIO POLICY' designer-ai/tools/current-source/CHATGPT_START.txt
          grep -Fq 'SILENT AUDIO POLICY' designer-ai/open-current/CHATGPT_START.txt
          grep -Fq 'AUDIO_UNAVAILABLE_IN_CURRENT' designer-ai/simple-preview.html
          grep -Fq 'A silent cutscene is legal' designer-ai/tools/current-source/CHATGPT_START.txt
          python3 - <<'PY'
          import json
          old_sha='445d9becc9f8a19cac459e0d677b010ad6f49b3652a57abb8a1ec3b6268f36dd'
          old_tag='designer-ai-current-20260906-123745818-dbd6639cac'
          values=[]
          for path in ('designer-ai/current.json','designer-ai/open-current/OPEN_CURRENT.json'):
              with open(path, encoding='utf-8-sig') as f:
                  current=json.load(f)
              pkg=current.get('authoringPackage')
              if pkg:
                  assert pkg.get('sha256') != old_sha, f'STALE_AUTHORING_PACKAGE_SHA: {path}'
                  assert old_tag not in str(pkg.get('downloadUrl','')), f'STALE_AUTHORING_PACKAGE_URL: {path}'
              values.append(pkg)
          assert values[0] == values[1], 'AUTHORING_PACKAGE_METADATA_CURRENT_MISMATCH'
          PY
