name: Release Cutover Inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-cutover-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Devora authoring package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release /tmp/authoring
          gh release download designer-ai-current-20260904-125548729-dbd6639cac \
            --repo streamDragon/STARWARS_DELTA_STORYBOARDS \
            --pattern 'STARWARS_DELTA_CHATGPT_AUTHORING_PACKAGE_CURRENT.zip' \
            --dir /tmp/release
          sha256sum /tmp/release/STARWARS_DELTA_CHATGPT_AUTHORING_PACKAGE_CURRENT.zip
          unzip -q /tmp/release/STARWARS_DELTA_CHATGPT_AUTHORING_PACKAGE_CURRENT.zip -d /tmp/authoring
          test -s /tmp/authoring/MANIFEST.json
          test -s /tmp/authoring/AUTHORING_REQUEST.txt
          test -s /tmp/authoring/CATALOG_SUBSET.json
          test -s /tmp/authoring/INSTRUCTION_SUBSET.json
          test -s /tmp/authoring/VISUAL_PACK/proof_manifest.json
          visual_count=$(find /tmp/authoring/VISUAL_PACK -type f | wc -l)
          catalog_bytes=$(wc -c < /tmp/authoring/CATALOG_SUBSET.json)
          instruction_bytes=$(wc -c < /tmp/authoring/INSTRUCTION_SUBSET.json)
          request_bytes=$(wc -c < /tmp/authoring/AUTHORING_REQUEST.txt)
          test "$visual_count" -gt 1
          test "$catalog_bytes" -gt 1000
          test "$instruction_bytes" -gt 1000
          test "$request_bytes" -gt 10
          echo '=== MANIFEST ==='
          cat /tmp/authoring/MANIFEST.json
          echo
          echo "DEVORA_PACKAGE_VERIFY=PASS"
          echo "VISUAL_FILE_COUNT=$visual_count"
          echo "CATALOG_SUBSET_BYTES=$catalog_bytes"
          echo "INSTRUCTION_SUBSET_BYTES=$instruction_bytes"
          echo "AUTHORING_REQUEST_BYTES=$request_bytes"
