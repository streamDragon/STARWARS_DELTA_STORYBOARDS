name: Inspect Designer AI Current

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-designer-ai-visual-library.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate full Catalog and audit Current
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, tempfile, urllib.request, zipfile
          from collections import Counter

          repo=os.environ['REPOSITORY']; token=os.environ['GITHUB_TOKEN']
          current=json.loads(pathlib.Path('designer-ai/current.json').read_text(encoding='utf-8'))
          tag=current['releaseUrl'].rsplit('/releases/tag/',1)[1]
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'STARWARS-DELTA-current-auditor'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/releases/tags/{tag}',headers=headers)
          with urllib.request.urlopen(req,timeout=120) as r: release=json.load(r)
          assets={a['name']:a for a in release['assets']}

          def dl(name,dst):
              req=urllib.request.Request(assets[name]['browser_download_url'],headers={'User-Agent':'STARWARS-DELTA-current-auditor'})
              with urllib.request.urlopen(req,timeout=600) as r,open(dst,'wb') as f:
                  while True:
                      b=r.read(1024*1024)
                      if not b: break
                      f.write(b)

          with tempfile.TemporaryDirectory() as td0:
              td=pathlib.Path(td0)
              cz=td/'catalog.zip'; dl('STARWARS_DELTA_CHATGPT_CATALOG_CURRENT.zip',cz)
              with zipfile.ZipFile(cz) as z:
                  print('CATALOG_PACKAGE_FILES')
                  for n in z.namelist(): print('FILE',n,'SIZE',z.getinfo(n).file_size)
                  for n in ('catalog_summary.json','diagnostics_summary.json','collections.json','capabilities.json','families.json'):
                      if n in z.namelist():
                          try:
                              data=json.loads(z.read(n).decode('utf-8-sig'))
                              print('SUMMARY',n,json.dumps(data,ensure_ascii=False)[:20000])
                          except Exception as e: print('SUMMARY_PARSE_FAIL',n,type(e).__name__)

              vz=td/'visual.zip'; dl('STARWARS_DELTA_DESIGNER_AI_VISUAL_LIBRARY_CURRENT.zip',vz)
              with zipfile.ZipFile(vz) as z:
                  m=json.loads(z.read('visual_library_manifest.json').decode('utf-8-sig'))
                  visuals=m.get('assets',[]); names=set(z.namelist())
                  print('VISUAL_META',json.dumps({k:v for k,v in m.items() if k not in ('assets','assetToVisualReference','qualityWarnings','compactVisualGuide')},ensure_ascii=False))
                  print('VISUAL_CATEGORY_COUNTS',dict(Counter(str(a.get('category') or 'Other') for a in visuals)))
                  print('VISUAL_SOURCE_KIND_COUNTS',dict(Counter(str(a.get('sourceKind') or 'Unknown') for a in visuals)))
                  print('VISUAL_ENTITY_COUNTS',dict(Counter(str(a.get('entityClassification') or 'Unknown') for a in visuals)))
                  print('VISUAL_PRIMARY_USE_COUNTS',dict(Counter(str(a.get('cutscenePrimaryUse') or 'Unknown') for a in visuals)))
                  print('VISUAL_WITH_PREVIEW',sum(1 for a in visuals if (a.get('primaryPreview') or a.get('thumbnailPath')) in names))
                  print('VISUAL_WITHOUT_PREVIEW',sum(1 for a in visuals if not (a.get('primaryPreview') or a.get('thumbnailPath')) or (a.get('primaryPreview') or a.get('thumbnailPath')) not in names))

              bz=td/'bundle.zip'; dl(next(n for n in assets if n.startswith('STARWARS_DELTA_DESIGNER_AI_BUNDLE_')),bz)
              with zipfile.ZipFile(bz) as z:
                  files=z.namelist()
                  print('BUNDLE_FILE_COUNT',len(files))
                  candidates=[]
                  for n in files:
                      low=n.lower(); info=z.getinfo(n)
                      if any(t in low for t in ('catalog','snapshot','record','asset')) and info.file_size>1000000:
                          candidates.append((info.file_size,n))
                  print('BUNDLE_LARGE_CATALOG_CANDIDATES')
                  for size,n in sorted(candidates,reverse=True)[:40]: print('CANDIDATE',size,n)
                  for size,n in sorted(candidates,reverse=True)[:12]:
                      if not n.lower().endswith(('.json','.jsonl','.txt')) or size>120000000: continue
                      try:
                          raw=z.read(n)
                          text=raw.decode('utf-8-sig')
                          if n.lower().endswith('.json'):
                              data=json.loads(text)
                              if isinstance(data,dict): print('CANDIDATE_KEYS',n,list(data.keys())[:80])
                              if isinstance(data,dict) and isinstance(data.get('records'),list):
                                  records=data['records']; print('FOUND_FULL_RECORDS',n,len(records));
                                  print('RECORD_KEYS',list(records[0].keys()) if records else [])
                                  print('TYPE_COUNTS',dict(Counter(str(r.get('type') or '(empty)') for r in records)))
                                  print('PRIMARY_USE_COUNTS',dict(Counter(str(r.get('cutscenePrimaryUse') or '(empty)') for r in records)))
                                  print('VISION_REVIEW_COUNTS',dict(Counter(str(r.get('visionReviewState') or '(empty)') for r in records)))
                                  print('REVIEW_STATE_COUNTS',dict(Counter(str(r.get('reviewState') or '(empty)') for r in records)))
                                  print('ENTITY_KIND_COUNTS',dict(Counter(str(r.get('entityKind') or '(empty)') for r in records)))
                                  frames=[r for r in records if any('animation frame' in str(v).lower() or 'sequence-frame' in str(v).lower() for v in (r.get('roles') or [])+(r.get('tags') or []))]
                                  print('ANIMATION_FRAME_RECORDS',len(frames)); print('ANIMATION_FAMILIES',len(set((r.get('familyId') or r.get('family') or r.get('displayName')) for r in frames)))
                                  print('SPRITES',sum(1 for r in records if str(r.get('type','')).lower()=='sprite'))
                                  print('PREFABS',sum(1 for r in records if str(r.get('type','')).lower() in ('prefab','gameobject')))
                                  print('AUDIO',sum(1 for r in records if 'audio' in str(r.get('type','')).lower() or str(r.get('cutscenePrimaryUse','')).lower()=='audio'))
                                  print('MATERIALS',sum(1 for r in records if str(r.get('type','')).lower()=='material'))
                                  print('TEXTURES',sum(1 for r in records if 'texture' in str(r.get('type','')).lower()))
                                  print('ANIMATION_CLIPS',sum(1 for r in records if 'animation' in str(r.get('type','')).lower() and str(r.get('type','')).lower()!='sprite'))
                                  print('BLANK_PRESENTATION',sum(1 for r in records if not r.get('cutscenePresentationDescription')))
                                  print('BLANK_LOCATION',sum(1 for r in records if not r.get('cutsceneLocationType')))
                                  raise SystemExit(0)
                      except SystemExit: raise
                      except Exception as e: print('CANDIDATE_READ_FAIL',n,type(e).__name__,str(e)[:120])

          print('FULL_RECORDS_NOT_FOUND')
          PY
