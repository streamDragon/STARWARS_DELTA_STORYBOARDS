name: Inspect Designer AI Visual Library

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-designer-ai-visual-library.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect missing visual preview fallbacks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, tempfile, urllib.request, zipfile
          from collections import Counter

          repo = os.environ['REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          current = json.loads(pathlib.Path('designer-ai/current.json').read_text(encoding='utf-8'))
          tag = current['releaseUrl'].rsplit('/releases/tag/', 1)[1]
          api = f'https://api.github.com/repos/{repo}/releases/tags/{tag}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'STARWARS-DELTA-visual-inspector',
          }
          req = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(req, timeout=120) as r:
              release = json.load(r)
          asset = next(a for a in release['assets'] if a['name'] == 'STARWARS_DELTA_DESIGNER_AI_VISUAL_LIBRARY_CURRENT.zip')

          with tempfile.TemporaryDirectory() as td:
              zp = pathlib.Path(td) / 'visual.zip'
              req = urllib.request.Request(asset['browser_download_url'], headers={'User-Agent': 'STARWARS-DELTA-visual-inspector'})
              with urllib.request.urlopen(req, timeout=600) as r, zp.open('wb') as f:
                  while True:
                      b = r.read(1024 * 1024)
                      if not b:
                          break
                      f.write(b)

              with zipfile.ZipFile(zp) as z:
                  names = set(z.namelist())
                  manifest = json.loads(z.read('visual_library_manifest.json').decode('utf-8-sig'))
                  assets = manifest.get('assets', [])
                  print('VISUAL_IDENTITIES', len(assets))

                  direct = []
                  missing = []
                  for a in assets:
                      preview = a.get('primaryPreview') or a.get('thumbnailPath')
                      if preview and preview in names:
                          direct.append(a)
                      else:
                          missing.append(a)

                  print('DIRECT_PREVIEW', len(direct))
                  print('MISSING_DIRECT_PREVIEW', len(missing))
                  print('MISSING_BY_CATEGORY', dict(Counter(str(a.get('category') or 'Other') for a in missing)))
                  print('MISSING_BY_SOURCE_KIND', dict(Counter(str(a.get('sourceKind') or 'Unknown') for a in missing)))

                  def pathish(value):
                      if isinstance(value, str):
                          return value if value in names else None
                      if isinstance(value, dict):
                          for key in ('path','file','filePath','previewPath','imagePath','contactSheetPath','atlasPath'):
                              candidate = value.get(key)
                              if isinstance(candidate, str) and candidate in names:
                                  return candidate
                      return None

                  fallback_counts = Counter()
                  examples = []
                  for a in missing:
                      fallback = None
                      reason = None

                      contact = pathish(a.get('contactSheet'))
                      if contact:
                          fallback, reason = contact, 'contactSheet'

                      if not fallback:
                          atlas = pathish(a.get('atlas'))
                          if atlas:
                              fallback, reason = atlas, 'atlasPath'

                      if not fallback:
                          atlas_id = a.get('atlasId')
                          if atlas_id:
                              candidates = [
                                  f'atlases/atlas_{atlas_id}.png',
                                  f'atlases/{atlas_id}.png',
                              ]
                              for candidate in candidates:
                                  if candidate in names:
                                      fallback, reason = candidate, 'atlasId'
                                      break

                      if not fallback:
                          frames = a.get('representativeFrames') or []
                          for frame in frames:
                              candidate = pathish(frame)
                              if candidate:
                                  fallback, reason = candidate, 'representativeFrame'
                                  break

                      fallback_counts[reason or 'none'] += 1
                      if len(examples) < 30:
                          examples.append({
                              'displayName': a.get('displayName'),
                              'category': a.get('category'),
                              'sourceKind': a.get('sourceKind'),
                              'assetId': a.get('assetId'),
                              'thumbnailPath': a.get('thumbnailPath'),
                              'primaryPreview': a.get('primaryPreview'),
                              'contactSheet': a.get('contactSheet'),
                              'atlas': a.get('atlas'),
                              'atlasId': a.get('atlasId'),
                              'atlasRect': a.get('atlasRect'),
                              'representativeFrames': a.get('representativeFrames'),
                              'fallbackReason': reason,
                              'fallbackPath': fallback,
                          })

                  print('FALLBACK_COUNTS', dict(fallback_counts))
                  print('EXAMPLES_BEGIN')
                  for e in examples:
                      print(json.dumps(e, ensure_ascii=False))
                  print('EXAMPLES_END')
          PY
