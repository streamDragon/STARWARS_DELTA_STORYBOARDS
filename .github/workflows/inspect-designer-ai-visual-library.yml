name: Inspect Designer AI Current

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-designer-ai-visual-library.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Director metadata completeness and current authoring scope
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, tempfile, urllib.request, zipfile
          from collections import Counter

          repo = os.environ['REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          current = json.loads(pathlib.Path('designer-ai/current.json').read_text(encoding='utf-8'))
          tag = current['releaseUrl'].rsplit('/releases/tag/', 1)[1]
          headers = {
              'Accept':'application/vnd.github+json',
              'Authorization':f'Bearer {token}',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'STARWARS-DELTA-metadata-auditor'
          }
          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/releases/tags/{tag}', headers=headers)
          with urllib.request.urlopen(req, timeout=120) as r:
              release = json.load(r)
          assets = {a['name']: a for a in release['assets']}

          def download(name, dst):
              req = urllib.request.Request(assets[name]['browser_download_url'], headers={'User-Agent':'STARWARS-DELTA-metadata-auditor'})
              with urllib.request.urlopen(req, timeout=600) as r, open(dst, 'wb') as f:
                  while True:
                      chunk = r.read(1024 * 1024)
                      if not chunk:
                          break
                      f.write(chunk)

          def nonempty(record, key):
              value = record.get(key)
              return value not in (None, '', [], {})

          def use(record):
              return str(record.get('cutscenePrimaryUse') or '(none)')

          with tempfile.TemporaryDirectory() as td0:
              td = pathlib.Path(td0)
              catalog_zip = td / 'catalog.zip'
              download('STARWARS_DELTA_CHATGPT_CATALOG_CURRENT.zip', catalog_zip)
              with zipfile.ZipFile(catalog_zip) as z:
                  summary = json.loads(z.read('catalog_summary.json').decode('utf-8-sig'))
                  diagnostics = json.loads(z.read('diagnostics_summary.json').decode('utf-8-sig'))
                  records = []
                  with z.open('catalog_records.jsonl') as f:
                      for raw in f:
                          raw = raw.strip()
                          if raw:
                              records.append(json.loads(raw.decode('utf-8-sig')))

              print('=== FRESHNESS ===')
              print('PUBLISH_TRANSACTION', current.get('publishTransactionId'))
              print('PUBLISHED_UTC', current.get('publishedUtc'))
              print('LAST_COMPLETED_SCAN_UTC', summary.get('lastCompletedScanUtc'))
              print('CATALOG_GENERATED_UTC', summary.get('generatedUtc'))
              print('CATALOG_RECORDS', len(records))
              print('ANNOTATED', diagnostics.get('annotated'))
              print('REVIEWED', diagnostics.get('reviewed'))
              print('NEEDS_REVIEW', diagnostics.get('needsReview'))
              print('STALE', diagnostics.get('stale'))

              all_keys = sorted({key for r in records for key in r.keys()})
              print('RECORD_KEYS', json.dumps(all_keys, ensure_ascii=False))
              interesting = [key for key in all_keys if any(t in key.lower() for t in ('annot','vision','review','stale','scan','utc','presentation','location','scene','lighting'))]
              print('INTERESTING_KEYS', json.dumps(interesting, ensure_ascii=False))

              director_uses = ['Actor','Layer','Effect','Ui','Animation','Audio']
              fields = [
                  'description','roles','tags','capabilities','family','familyId','collections',
                  'cutsceneSemanticFacets','cutscenePresentationDescription','cutsceneLocationType',
                  'cutsceneSceneState','cutsceneLightingMood','cutsceneProportionClass',
                  'compatibleAnimationIds','compatibleDialogueVisualIds'
              ]

              print('=== METADATA COMPLETENESS BY DIRECTOR USE ===')
              for name in director_uses:
                  subset = [r for r in records if use(r).lower() == name.lower()]
                  out = {'use':name,'total':len(subset)}
                  for field in fields:
                      out[field] = sum(1 for r in subset if nonempty(r, field))
                  out['visionReviewed'] = sum(1 for r in subset if str(r.get('visionReviewState') or '').lower() == 'reviewed')
                  out['visionNeedsReview'] = sum(1 for r in subset if str(r.get('visionReviewState') or '').lower() == 'needsreview')
                  out['visionUnreviewed'] = sum(1 for r in subset if str(r.get('visionReviewState') or '').lower() in ('','unreviewed','unknown'))
                  out['entityKnown'] = sum(1 for r in subset if str(r.get('entityKind') or '').lower() not in ('','unknown'))
                  out['safeForPreview'] = sum(1 for r in subset if bool(r.get('cutsceneSafeForPreview')))
                  out['safeForPublish'] = sum(1 for r in subset if bool(r.get('cutsceneSafeForPublish')))
                  out['presentationConfidencePositive'] = sum(1 for r in subset if float(r.get('cutscenePresentationConfidence') or 0) > 0)
                  print(json.dumps(out, ensure_ascii=False))

              print('=== GLOBAL PRESENTATION METADATA ===')
              for field in ('cutsceneFitMode','cutsceneBackgroundCoverage','cutsceneLocationType','cutsceneSceneState','cutsceneLightingMood'):
                  print(field, json.dumps(Counter(str(r.get(field) or '(empty)') for r in records).most_common(30), ensure_ascii=False))
              print('PRESENTATION_DESCRIPTION_NONEMPTY', sum(1 for r in records if nonempty(r,'cutscenePresentationDescription')))
              print('PRESENTATION_CONFIDENCE_POSITIVE', sum(1 for r in records if float(r.get('cutscenePresentationConfidence') or 0) > 0))
              print('SEMANTIC_FACETS_NONEMPTY', sum(1 for r in records if nonempty(r,'cutsceneSemanticFacets')))

              print('=== CANONICAL ACTOR AND ANIMATION KNOWLEDGE ===')
              actor_records = [r for r in records if use(r).lower() == 'actor']
              animation_records = [r for r in records if use(r).lower() == 'animation']
              print('ACTOR_TOTAL', len(actor_records))
              print('PREFERRED_ACTOR_IDENTITIES', sum(1 for r in actor_records if bool(r.get('isPreferredActorIdentity'))))
              print('ACTOR_WITH_PREFERRED_ACTOR_ID', sum(1 for r in actor_records if nonempty(r,'preferredActorAssetId')))
              print('ACTOR_WITH_COMPATIBLE_ANIMATIONS', sum(1 for r in actor_records if nonempty(r,'compatibleAnimationIds')))
              print('ANIMATION_TOTAL', len(animation_records))
              animation_keys = sorted({k for r in animation_records[:100] for k in r.keys()})
              print('ANIMATION_RECORD_KEYS', json.dumps(animation_keys, ensure_ascii=False))
              print('ANIMATION_SAMPLE')
              for r in animation_records[:3]:
                  print(json.dumps({k:r.get(k) for k in ('assetId','displayName','path','description','roles','tags','capabilities','family','familyId','collections','visionReviewState','cutsceneWarnings','compatibleAnimationIds')}, ensure_ascii=False))

              print('=== AUDIO KNOWLEDGE ===')
              audio_records = [r for r in records if use(r).lower() == 'audio']
              print('AUDIO_TOTAL', len(audio_records))
              print('AUDIO_TYPE_COUNTS', json.dumps(Counter(str(r.get('type') or '(none)') for r in audio_records), ensure_ascii=False))
              print('AUDIO_WITH_DESCRIPTION', sum(1 for r in audio_records if nonempty(r,'description')))
              print('AUDIO_WITH_ROLES', sum(1 for r in audio_records if nonempty(r,'roles')))
              print('AUDIO_WITH_TAGS', sum(1 for r in audio_records if nonempty(r,'tags')))
              print('AUDIO_WITH_COLLECTIONS', sum(1 for r in audio_records if nonempty(r,'collections')))
              print('AUDIO_SAFE_PREVIEW', sum(1 for r in audio_records if bool(r.get('cutsceneSafeForPreview'))))
              audio_keys = sorted({k for r in audio_records for k in r.keys()})
              print('AUDIO_RECORD_KEYS', json.dumps(audio_keys, ensure_ascii=False))
              print('AUDIO_SAMPLE')
              for r in audio_records[:5]:
                  print(json.dumps({k:r.get(k) for k in ('assetId','displayName','path','description','roles','tags','capabilities','family','collections','visionReviewState','cutsceneWarnings')}, ensure_ascii=False))

              print('=== CURRENT DIRECT CHATGPT AUTHORING PACKAGE ===')
              authoring_manifest = json.loads(pathlib.Path('designer-ai/open-current/authoring/MANIFEST.json').read_text(encoding='utf-8')) if pathlib.Path('designer-ai/open-current/authoring/MANIFEST.json').exists() else None
              subset_path = pathlib.Path('designer-ai/open-current/CATALOG_SUBSET.json')
              if not subset_path.exists():
                  subset_path = pathlib.Path('designer-ai/open-current/authoring/CATALOG_SUBSET.json')
              subset = json.loads(subset_path.read_text(encoding='utf-8-sig')) if subset_path.exists() else None
              print('AUTHORING_MANIFEST_PRESENT', bool(authoring_manifest))
              if authoring_manifest:
                  print('AUTHORING_MANIFEST', json.dumps(authoring_manifest, ensure_ascii=False))
              print('CATALOG_SUBSET_PRESENT', bool(subset))
              if subset:
                  subset_records = subset.get('records') or []
                  print('CATALOG_SUBSET_SCOPE', subset.get('scope'))
                  print('CATALOG_SUBSET_RECORDS', len(subset_records))
                  print('CATALOG_SUBSET_USE_COUNTS', json.dumps(Counter(use(r) for r in subset_records).most_common(), ensure_ascii=False))
                  print('CATALOG_SUBSET_TYPE_COUNTS', json.dumps(Counter(str(r.get('type') or r.get('kind') or '(none)') for r in subset_records).most_common(), ensure_ascii=False))
                  print('CATALOG_SUBSET_AUDIO', sum(1 for r in subset_records if use(r).lower() == 'audio'))
                  print('CATALOG_SUBSET_ANIMATION', sum(1 for r in subset_records if use(r).lower() == 'animation'))
                  print('CATALOG_SUBSET_PREFERRED_ACTORS', sum(1 for r in subset_records if bool(r.get('isPreferredActorIdentity'))))

          PY
