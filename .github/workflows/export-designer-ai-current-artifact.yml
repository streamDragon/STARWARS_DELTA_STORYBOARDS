name: Export Designer AI CURRENT artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-designer-ai-current-artifact.yml'

permissions:
  contents: read

jobs:
  export-current-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher site
        uses: actions/checkout@v4

      - name: Verify CURRENT Director pack
        run: |
          set -euo pipefail
          test -s designer-ai/open-current/STARWARS_DELTA_CHATGPT_DIRECTOR_CURRENT.zip
          test -s designer-ai/open-current/OPEN_CURRENT.json
          python3 - <<'PY'
          import json
          import pathlib
          import zipfile

          root = pathlib.Path('designer-ai/open-current')
          current = json.loads((root / 'OPEN_CURRENT.json').read_text(encoding='utf-8'))
          assert current['status'] == 'CURRENT_VERIFIED_OPEN'
          pack = root / 'STARWARS_DELTA_CHATGPT_DIRECTOR_CURRENT.zip'
          with zipfile.ZipFile(pack) as archive:
              required = {
                  'OPEN_CURRENT.json',
                  'FULL_VISUAL_INDEX.json',
                  'full-visual-sheets/STARWARS_DELTA_CHATGPT_VISUAL_ATLAS_CURRENT.pdf',
                  'director-view/DIRECTOR_VIEW.json',
                  'director-view/actors.json',
                  'director-view/layers.json',
                  'director-view/effects.json',
                  'director-view/ui.json',
                  'director-view/animations.json',
                  'director-view/audio.json',
                  'catalog-contract/CUTSCENE_AUTHORING_CONTRACT.json',
              }
              names = set(archive.namelist())
              missing = sorted(required - names)
              assert not missing, f'Missing CURRENT Director files: {missing}'
              zip_current = json.loads(archive.read('OPEN_CURRENT.json').decode('utf-8-sig'))
              assert zip_current['atomicIdentity'] == current['atomicIdentity']
          print('CURRENT_DIRECTOR_ARTIFACT_VERIFIED', current['publishTransactionId'])
          PY

      - name: Upload CURRENT Director pack
        uses: actions/upload-artifact@v4
        with:
          name: STARWARS_DELTA_CHATGPT_DIRECTOR_CURRENT
          path: designer-ai/open-current/STARWARS_DELTA_CHATGPT_DIRECTOR_CURRENT.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
