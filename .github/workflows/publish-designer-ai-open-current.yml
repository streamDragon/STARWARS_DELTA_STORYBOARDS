name: Publish Designer AI Open CURRENT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'designer-ai/current.json'
      - '.github/workflows/publish-designer-ai-open-current.yml'

permissions:
  contents: write

concurrency:
  group: designer-ai-open-current
  cancel-in-progress: true

jobs:
  publish-open-current:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher site
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install contact-sheet dependency
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Build open CURRENT payload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import tempfile
          import urllib.request
          import zipfile
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          repo = os.environ['REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          current_path = pathlib.Path('designer-ai/current.json')
          current = json.loads(current_path.read_text(encoding='utf-8'))

          if current.get('status') != 'CURRENT_VERIFIED':
              raise SystemExit('designer-ai/current.json is not CURRENT_VERIFIED')

          tx = current.get('publishTransactionId')
          release_url = current.get('releaseUrl', '')
          if not tx or '/releases/tag/' not in release_url:
              raise SystemExit('CURRENT is missing publishTransactionId or releaseUrl')

          tag = release_url.rsplit('/releases/tag/', 1)[1]
          api_url = f'https://api.github.com/repos/{repo}/releases/tags/{tag}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'STARWARS-DELTA-open-current-publisher',
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.load(r)

          def download(url, dst):
              req = urllib.request.Request(url, headers={'User-Agent': headers['User-Agent']})
              with urllib.request.urlopen(req, timeout=300) as r, open(dst, 'wb') as f:
                  shutil.copyfileobj(r, f)

          release = get_json(api_url)
          assets = {a['name']: a for a in release.get('assets', [])}
          wanted = {
              'authoring': 'STARWARS_DELTA_CHATGPT_AUTHORING_PACKAGE_CURRENT.zip',
              'visual-proof': 'STARWARS_DELTA_DESIGNER_AI_VISUAL_PROOF_CURRENT.zip',
          }

          missing = [name for name in wanted.values() if name not in assets]
          if missing:
              raise SystemExit('Release is missing required ChatGPT open-current assets: ' + ', '.join(missing))

          root = pathlib.Path('_open_current_stage')
          if root.exists():
              shutil.rmtree(root)
          root.mkdir(parents=True)

          files_by_group = {}
          with tempfile.TemporaryDirectory() as td:
              td = pathlib.Path(td)
              for group, asset_name in wanted.items():
                  zip_path = td / asset_name
                  download(assets[asset_name]['browser_download_url'], zip_path)
                  out = root / group
                  out.mkdir(parents=True)
                  with zipfile.ZipFile(zip_path) as z:
                      for member in z.infolist():
                          target = (out / member.filename).resolve()
                          if not str(target).startswith(str(out.resolve()) + os.sep) and target != out.resolve():
                              raise SystemExit(f'Unsafe ZIP path: {member.filename}')
                      z.extractall(out)
                  files_by_group[group] = sorted(
                      str(p.relative_to(root)).replace(os.sep, '/')
                      for p in out.rglob('*') if p.is_file()
                  )

          proof_manifest_path = root / 'authoring' / 'VISUAL_PACK' / 'proof_manifest.json'
          proof = json.loads(proof_manifest_path.read_text(encoding='utf-8-sig'))
          proof_assets = [a for a in proof.get('assets', []) if a.get('proofFilePath')]

          raw_base = f'https://raw.githubusercontent.com/{repo}/designer-ai-open-current'
          visual_index_assets = []
          for a in proof_assets:
              relative = 'authoring/VISUAL_PACK/' + a['proofFilePath'].replace('\\', '/')
              visual_index_assets.append({
                  'visualReferenceId': a.get('visualReferenceId'),
                  'assetId': a.get('assetId'),
                  'displayName': a.get('displayName'),
                  'category': a.get('category'),
                  'representativePurpose': a.get('representativePurpose'),
                  'pixelQuality': a.get('pixelQuality'),
                  'previewPath': relative,
                  'previewUrl': raw_base + '/' + relative,
              })

          page_w, page_h = 1240, 1754
          margin = 54
          cols, rows = 2, 4
          cell_w = (page_w - margin * 2) // cols
          cell_h = (page_h - margin * 2 - 86) // rows
          font_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          title_font = ImageFont.truetype(bold_path, 30)
          name_font = ImageFont.truetype(bold_path, 18)
          meta_font = ImageFont.truetype(font_path, 12)
          pages = []

          for offset in range(0, len(proof_assets), cols * rows):
              page = Image.new('RGB', (page_w, page_h), 'white')
              draw = ImageDraw.Draw(page)
              draw.text((margin, 28), f'STARWARS_DELTA Visual Contact Sheet | CURRENT {tx}', fill='black', font=title_font)
              batch = proof_assets[offset:offset + cols * rows]
              for i, a in enumerate(batch):
                  r, c = divmod(i, cols)
                  x = margin + c * cell_w
                  y = margin + 70 + r * cell_h
                  draw.rectangle((x, y, x + cell_w - 18, y + cell_h - 18), outline='black', width=2)
                  img_path = root / 'authoring' / 'VISUAL_PACK' / a['proofFilePath']
                  try:
                      with Image.open(img_path) as src:
                          src = src.convert('RGBA')
                          bg = Image.new('RGBA', src.size, 'white')
                          bg.alpha_composite(src)
                          src = bg.convert('RGB')
                          thumb = ImageOps.contain(src, (cell_w - 50, cell_h - 112), Image.Resampling.LANCZOS)
                          px = x + (cell_w - 18 - thumb.width) // 2
                          py = y + 18
                          page.paste(thumb, (px, py))
                  except Exception as exc:
                      draw.text((x + 18, y + 40), f'Preview unavailable: {exc}', fill='black', font=meta_font)
                  text_y = y + cell_h - 100
                  name = str(a.get('displayName') or '(unnamed)')[:62]
                  draw.text((x + 14, text_y), name, fill='black', font=name_font)
                  draw.text((x + 14, text_y + 25), f"{a.get('category','')} | {a.get('representativePurpose','')}", fill='black', font=meta_font)
                  draw.text((x + 14, text_y + 43), str(a.get('assetId') or ''), fill='black', font=meta_font)
              pages.append(page)

          pdf_path = root / 'VISUAL_CONTACT_SHEET.pdf'
          if pages:
              pages[0].save(pdf_path, 'PDF', resolution=150, save_all=True, append_images=pages[1:])

          visual_index = {
              'schema': 'STARWARS_DELTA_CHATGPT_VISUAL_INDEX',
              'schemaVersion': 1,
              'status': 'CURRENT_VERIFIED_OPEN',
              'publishTransactionId': tx,
              'assetCount': len(visual_index_assets),
              'contactSheetPdfUrl': raw_base + '/VISUAL_CONTACT_SHEET.pdf',
              'openCurrentManifestUrl': raw_base + '/OPEN_CURRENT.json',
              'assets': visual_index_assets,
          }
          (root / 'CHATGPT_VISUAL_INDEX.json').write_text(
              json.dumps(visual_index, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )

          (root / 'SOURCE_CURRENT.json').write_text(
              json.dumps(current, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )

          manifest = {
              'schema': 'STARWARS_DELTA_DESIGNER_AI_OPEN_CURRENT',
              'schemaVersion': 2,
              'status': 'CURRENT_VERIFIED_OPEN',
              'publishTransactionId': tx,
              'publishedUtc': current.get('publishedUtc'),
              'releaseUrl': release_url,
              'contractRevision': current.get('contractRevision'),
              'schemaHash': current.get('schemaHash'),
              'sourceCurrentPath': 'SOURCE_CURRENT.json',
              'chatgptVisualIndexPath': 'CHATGPT_VISUAL_INDEX.json',
              'visualContactSheetPath': 'VISUAL_CONTACT_SHEET.pdf',
              'visualContactSheetUrl': raw_base + '/VISUAL_CONTACT_SHEET.pdf',
              'groups': files_by_group,
              'usage': {
                  'rule': 'Inspect actual image pixels in VISUAL_CONTACT_SHEET.pdf or previewUrl before making visual claims or storyboards.',
                  'authoring': 'Use authoring/ for compact ChatGPT-ready catalog, instruction, and visual references.',
                  'visualProof': 'Use visual-proof/ for published visual QA evidence.',
                  'chatgpt': 'Start with CHATGPT_VISUAL_INDEX.json and VISUAL_CONTACT_SHEET.pdf. Metadata alone is not visual evidence.'
              }
          }
          (root / 'OPEN_CURRENT.json').write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          print(f'Prepared open CURRENT {tx}')
          print(f"Visual assets: {len(visual_index_assets)}")
          print(f"Contact sheet pages: {len(pages)}")
          PY

      - name: Publish clean open-current branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          STAGE="$(pwd)/_open_current_stage"
          TMP="$(mktemp -d)"
          cp -a "$STAGE/." "$TMP/"

          git checkout --orphan designer-ai-open-current-tmp
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$TMP/." .

          git add -A
          git commit -m "Publish Designer AI open CURRENT"
          git push --force origin HEAD:designer-ai-open-current
