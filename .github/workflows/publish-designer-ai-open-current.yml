name: Publish Designer AI CURRENT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'designer-ai/current.json'
      - 'designer-ai/tools/stage_release_simple_schema.py'
      - 'designer-ai/tools/seal_atomic_current.py'
      - 'designer-ai/tools/current-source/CHATGPT_START.txt'
      - 'designer-ai/tools/current-source/FILM_AUTHORING_GUIDE_CURRENT.md'
      - 'designer-ai/tools/current-source/simple-authoring/**'
      - '.github/workflows/publish-designer-ai-open-current.yml'

permissions:
  contents: write

concurrency:
  group: designer-ai-current
  cancel-in-progress: true

jobs:
  publish-current:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine CURRENT publish mode
        shell: bash
        run: |
          set -euo pipefail
          mode="$(python3 - <<'PY'
          import json
          value = str(json.load(open('designer-ai/current.json', encoding='utf-8-sig')).get('publishMode') or 'FULL').upper()
          if value not in {'FULL', 'DELTA'}:
              raise SystemExit('CURRENT_PUBLISH_MODE_INVALID: ' + value)
          print(value)
          PY
          )"
          echo "PUBLISH_MODE=$mode" >> "$GITHUB_ENV"
          echo "PUBLISH_MODE=$mode"

      - name: Prepare DELTA CURRENT fast path
        if: env.PUBLISH_MODE == 'DELTA'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 designer-ai/tools/apply_delta_current.py

      - name: Install FULL builder dependencies
        if: env.PUBLISH_MODE == 'FULL'
        run: python3 -m pip install --disable-pip-version-check pillow pypdf

      - name: Build visual evidence CURRENT
        if: env.PUBLISH_MODE == 'FULL'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 designer-ai/tools/build_open_current.py

      - name: Build unified Visual Atlas
        if: env.PUBLISH_MODE == 'FULL'
        run: python3 designer-ai/tools/build_visual_atlas.py

      - name: Finalize visual evidence
        if: env.PUBLISH_MODE == 'FULL'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 designer-ai/tools/finalize_open_current.py

      - name: Build Director View
        if: env.PUBLISH_MODE == 'FULL'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 designer-ai/tools/build_director_view.py

      - name: Finalize Director View
        if: env.PUBLISH_MODE == 'FULL'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 designer-ai/tools/run_director_finalization.py

      - name: Build grouped visual scan report
        if: env.PUBLISH_MODE == 'FULL'
        run: python3 designer-ai/tools/build_visual_scan_report.py

      - name: Stage Simple V1 schema from published CURRENT release
        if: env.PUBLISH_MODE == 'FULL'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 designer-ai/tools/stage_release_simple_schema.py

      - name: Build Simple V1 authoring handles
        if: env.PUBLISH_MODE == 'FULL'
        run: python3 designer-ai/tools/build_authoring_handles.py

      - name: Carry Emotional Dialogue CURRENT into stage
        if: env.PUBLISH_MODE == 'FULL'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          source = json.loads(pathlib.Path('designer-ai/current.json').read_text(encoding='utf-8-sig'))
          metadata = dict(source.get('emotionalDialogue') or {})
          expected = 'CURRENT_VERIFIED_EMOTIONAL_DIALOGUE'
          stage = pathlib.Path('_open_current_stage/EMOTIONAL_DIALOGUE_CURRENT.json')
          if metadata.get('status') != expected:
              if stage.exists(): stage.unlink()
              print('EMOTIONAL_DIALOGUE_NOT_PUBLISHED_FOR_CURRENT')
              raise SystemExit(0)
          release_url = str(source.get('releaseUrl') or '')
          if '/releases/tag/' not in release_url:
              raise SystemExit('CURRENT_RELEASE_URL_MISSING')
          tag = release_url.rsplit('/releases/tag/', 1)[1]
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/EMOTIONAL_DIALOGUE_CURRENT.json"
          req = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'User-Agent':'STARWARS_DELTA_CURRENT'})
          raw = urllib.request.urlopen(req, timeout=90).read()
          dialogue = json.loads(raw.decode('utf-8-sig'))
          required = dict(source.get('requiredCurrent') or {})
          ready = [c for c in dialogue.get('characters',[]) if c.get('authoringReady') is True]
          assert dialogue.get('schema') == 'STARWARS_DELTA_EMOTIONAL_DIALOGUE_CURRENT'
          assert dialogue.get('status') == expected
          assert dialogue.get('publishTransactionId') == source.get('publishTransactionId')
          assert dialogue.get('requiredCurrent') == required
          assert len(ready) == int(metadata.get('authoringReadyCharacterCount') or 0) > 0
          assert hashlib.sha256(raw).hexdigest().lower() == str(metadata.get('sha256') or '').lower()
          assert len(raw) == int(metadata.get('sizeBytes') or 0)
          stage.parent.mkdir(parents=True, exist_ok=True)
          stage.write_bytes(raw)
          print('EMOTIONAL_DIALOGUE_STAGED', len(ready))
          PY

      - name: Project Unity validation registry into stage
        if: env.PUBLISH_MODE == 'FULL'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, pathlib
          source = json.loads(pathlib.Path('designer-ai/current.json').read_text(encoding='utf-8-sig'))
          registry = dict(source.get('authoringRuleRegistry') or {})
          rules = list(registry.get('rules') or [])
          required = dict(source.get('requiredCurrent') or {})
          assert rules, 'CURRENT authoringRuleRegistry.rules is empty'
          ids = [r.get('ruleId') or r.get('diagnosticCode') or r.get('code') for r in rules]
          assert all(ids) and len(set(ids)) == len(ids)
          payload = {
            'schema':'STARWARS_DELTA_CUTSCENE_VALIDATION_CURRENT','schemaVersion':1,
            'status':'CURRENT_VERIFIED_CUTSCENE_VALIDATION','publishTransactionId':source.get('publishTransactionId'),
            'catalogRevision':str(required.get('catalogRevision') or ''),
            'revision':str(registry.get('revision') or source.get('authoringRuleRegistryRevision') or ''),
            'generatedUtc':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
            'requiredCurrent':{**required,'catalogRevision':str(required.get('catalogRevision') or '')},'rules':rules}
          out = pathlib.Path('_open_current_stage/CUTSCENE_VALIDATION_CURRENT.json')
          out.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('CUTSCENE_VALIDATION_PROJECTED', len(rules))
          PY

      - name: Align and verify Simple V1 timing guidance
        if: env.PUBLISH_MODE == 'FULL'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess

          seal_path = pathlib.Path('designer-ai/tools/seal_atomic_current.py')
          seal = seal_path.read_text(encoding='utf-8')
          old = 'Simple V1 action objects do not carry per-action timing/order. Do not place several sequential locomotion phases for the same subject in one beat. Split approach/pass/bank/exit style choreography across adjacent beats; one primary locomotion phase may coexist with compatible fire/impact/reveal events.'
          new = 'Simple V1 action objects may use explicit startOffset/duration, but actions[] array order is never a sequencing language. Use legal explicit intervals for staggering or concurrency. Distinct semantic locomotion phases such as approach/pass/bank/exit should use adjacent beats unless one continuous precise path represents them unambiguously; one primary locomotion phase may coexist with compatible timed fire/impact/reveal events.'
          if old in seal:
              seal = seal.replace(old, new, 1)
              seal_path.write_text(seal, encoding='utf-8')
              subprocess.run(['git', 'add', '--', str(seal_path)], check=True)
              print('AUTHORING_RULE_GENERATOR_TIMING_GUIDANCE_ALIGNED')
          elif new not in seal:
              raise SystemExit('AUTHORING_RULE_GENERATOR_TIMING_GUIDANCE_UNKNOWN')
          else:
              print('AUTHORING_RULE_GENERATOR_TIMING_GUIDANCE_ALREADY_ALIGNED')

          front = pathlib.Path('designer-ai/tools/current-source/CHATGPT_START.txt').read_text(encoding='utf-8-sig')
          assert 'visible[].startOffsetSeconds' in front and 'visible[].durationSeconds' in front
          assert 'startOffset is an optional ACTION field' in front and 'array order' in front

          guide = pathlib.Path('designer-ai/tools/current-source/simple-authoring/SEMANTIC_CINEMATIC_AUTHORING_GUIDE.md').read_text(encoding='utf-8-sig')
          assert '## Action timing and sequencing' in guide
          assert '`visible[].startOffsetSeconds`' in guide and '`visible[].durationSeconds`' in guide

          qa = json.loads(pathlib.Path('designer-ai/tools/current-source/simple-authoring/CINEMATIC_INTENT_QA_RULES.json').read_text(encoding='utf-8-sig'))
          assert int(qa.get('schemaVersion') or 0) >= 6
          semantics = qa.get('simpleV1Semantics') or {}
          assert 'startOffset' in str(semantics.get('actionTiming') or '')
          assert 'startOffsetSeconds' in str(semantics.get('effectTiming') or '')

          schema = json.loads(pathlib.Path('designer-ai/tools/current-source/simple-authoring/CUTSCENE_SCRIPT_V1.schema.json').read_text(encoding='utf-8-sig'))
          action = (((schema.get('$defs') or {}).get('action') or {}).get('properties') or {})
          visible = (((schema.get('$defs') or {}).get('visibleElement') or {}).get('properties') or {})
          assert 'startOffset' in action and 'duration' in action
          assert 'startOffsetSeconds' in visible and 'durationSeconds' in visible
          print('SIMPLE_V1_TIMING_GUIDANCE_SOURCE_PASS')
          PY

      - name: Seal and validate FULL CURRENT
        if: env.PUBLISH_MODE == 'FULL'
        run: python3 designer-ai/tools/seal_atomic_current.py

      - name: Validate staged CURRENT before switch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('_open_current_stage')
          source = json.loads(pathlib.Path('designer-ai/current.json').read_text(encoding='utf-8-sig'))
          opened = json.loads((root/'OPEN_CURRENT.json').read_text(encoding='utf-8-sig'))
          required = {k:str(v) for k,v in (source.get('requiredCurrent') or {}).items()}
          opened_required = {k:str(v) for k,v in (opened.get('requiredCurrent') or {}).items()}
          assert opened.get('status') == 'CURRENT_VERIFIED'
          assert opened.get('publishTransactionId') == source.get('publishTransactionId')
          assert opened_required == required
          for rel in ['director-view/DIRECTOR_VIEW.json','simple-authoring/AUTHORING_HANDLES.json','simple-authoring/AUTHORING_RULES_CURRENT.json','simple-authoring/CUTSCENE_SCRIPT_V1.schema.json','simple-authoring/CINEMATIC_INTENT_QA_RULES.json','simple-authoring/SEMANTIC_CINEMATIC_AUTHORING_GUIDE.md','full-visual-sheets/VISUAL_ATLAS_CURRENT.json','CUTSCENE_VALIDATION_CURRENT.json','CHATGPT_START.txt']:
              assert (root/rel).is_file(), 'ATOMIC_CURRENT_MISSING '+rel
          handles = json.loads((root/'simple-authoring/AUTHORING_HANDLES.json').read_text(encoding='utf-8-sig'))
          assert {k:str(v) for k,v in handles.get('requiredCurrent',{}).items()} == required
          assert (handles.get('countsByRoute') or {}).get('Audio',0) > 0
          schema = json.loads((root/'simple-authoring/CUTSCENE_SCRIPT_V1.schema.json').read_text(encoding='utf-8-sig'))
          assert schema.get('$id') == 'STARWARS_DELTA_CUTSCENE_SCRIPT_V1'
          visible = (((schema.get('$defs') or {}).get('visibleElement') or {}).get('properties') or {})
          action = (((schema.get('$defs') or {}).get('action') or {}).get('properties') or {})
          start = visible.get('startOffsetSeconds') or {}
          duration = visible.get('durationSeconds') or {}
          assert start.get('type') == 'number' and start.get('minimum') == 0, 'ATOMIC_CURRENT_EFFECT_OFFSET_SCHEMA_MISSING_OR_INVALID'
          assert duration.get('type') == 'number' and duration.get('exclusiveMinimum') == 0, 'ATOMIC_CURRENT_EFFECT_DURATION_SCHEMA_MISSING_OR_INVALID'
          assert (action.get('startOffset') or {}).get('minimum') == 0, 'ATOMIC_CURRENT_ACTION_OFFSET_SCHEMA_MISSING_OR_INVALID'
          assert (action.get('duration') or {}).get('exclusiveMinimum') == 0, 'ATOMIC_CURRENT_ACTION_DURATION_SCHEMA_MISSING_OR_INVALID'

          front = (root/'CHATGPT_START.txt').read_text(encoding='utf-8-sig')
          assert 'visible[].startOffsetSeconds' in front and 'visible[].durationSeconds' in front
          assert 'array order' in front
          guide = (root/'simple-authoring/SEMANTIC_CINEMATIC_AUTHORING_GUIDE.md').read_text(encoding='utf-8-sig')
          assert '## Action timing and sequencing' in guide and '`visible[].startOffsetSeconds`' in guide
          qa = json.loads((root/'simple-authoring/CINEMATIC_INTENT_QA_RULES.json').read_text(encoding='utf-8-sig'))
          assert int(qa.get('schemaVersion') or 0) >= 6
          rules = json.loads((root/'simple-authoring/AUTHORING_RULES_CURRENT.json').read_text(encoding='utf-8-sig'))
          rule = next(r for r in rules.get('rules',[]) if r.get('id') == 'NO_UNTIMED_MULTI_PHASE_LOCOMOTION')
          assert 'startOffset/duration' in rule.get('instruction','') and 'array order' in rule.get('instruction','')
          print('ATOMIC_EFFECT_TIMING_SCHEMA_READY')
          print('ATOMIC_ACTION_TIMING_GUIDANCE_READY')
          print('ATOMIC_DEVORA_GUIDANCE_ALIGNED')
          print('ATOMIC_OPEN_CURRENT_READY', source.get('publishTransactionId'), 'mode', source.get('publishMode') or 'FULL')
          PY

      - name: Publish one CURRENT directly to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf designer-ai/open-current
          mkdir -p designer-ai/open-current
          cp -a _open_current_stage/. designer-ai/open-current/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+streamDragon@users.noreply.github.com'
          git add -A designer-ai/open-current
          if git diff --cached --quiet; then
            echo 'CURRENT already matches complete staged payload.'
            exit 0
          fi
          tx="$(python3 -c "import json; print(json.load(open('designer-ai/current.json',encoding='utf-8-sig'))['publishTransactionId'])")"
          git commit -m "Publish Designer AI ${PUBLISH_MODE} CURRENT $tx"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "CURRENT_COMMITTED mode=$PUBLISH_MODE transaction=$tx"

      - name: DELTA performance proof
        if: env.PUBLISH_MODE == 'DELTA'
        run: |
          echo '[DELTA_UPLOAD_SUMMARY]'
          echo 'catalogBuild=NOT_RUN'
          echo 'visualEvidenceBuild=NOT_RUN'
          echo 'atlasBuild=NOT_RUN'
          echo 'directorBuild=NOT_RUN'
          echo 'baseBundleDownload=NOT_RUN'
          echo 'baseBundleUpload=NOT_RUN'
          echo 'result=PASS'
