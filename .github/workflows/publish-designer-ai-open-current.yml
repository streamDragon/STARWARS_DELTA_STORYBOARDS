name: Publish Designer AI Open CURRENT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'designer-ai/current.json'
      - 'designer-ai/tools/build_open_current.py'
      - '.github/workflows/publish-designer-ai-open-current.yml'

permissions:
  contents: write

concurrency:
  group: designer-ai-open-current
  cancel-in-progress: true

jobs:
  publish-open-current:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher site
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install visual builder dependency
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Build open CURRENT payload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 designer-ai/tools/build_open_current.py

      - name: Publish clean open-current branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          STAGE="$(pwd)/_open_current_stage"
          TMP="$(mktemp -d)"
          cp -a "$STAGE/." "$TMP/"
          git checkout --orphan designer-ai-open-current-tmp
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$TMP/." .
          git add -A
          git commit -m "Publish Designer AI open CURRENT"
          git push --force origin HEAD:designer-ai-open-current
