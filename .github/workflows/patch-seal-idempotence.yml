name: Patch Seal Idempotence

on:
  push:
    branches: [main]
    paths:
      - 'designer-ai/PATCH_SEAL_IDEMPOTENCE_TRIGGER.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch seal_atomic_current.py
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('designer-ai/tools/seal_atomic_current.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if old_identity_block in text:\n        text = text.replace(old_identity_block, new_identity_block, 1)\n    elif new_identity_block not in text:\n        raise SystemExit("CHATGPT_START CURRENT identity block marker is missing")\n'''
          new = '''    identity_header = "CURRENT AUTHORING COMPATIBILITY - REQUIRED CURRENT"\n    if old_identity_block in text:\n        text = text.replace(old_identity_block, new_identity_block, 1)\n    elif identity_header not in text:\n        raise SystemExit("CHATGPT_START CURRENT identity block marker is missing")\n'''
          if old not in text:
              raise SystemExit('Expected non-idempotent identity gate was not found exactly once')
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one non-idempotent identity gate')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add designer-ai/tools/seal_atomic_current.py
          git commit -m 'Make Open CURRENT sealer idempotent'
          git push origin HEAD:main
