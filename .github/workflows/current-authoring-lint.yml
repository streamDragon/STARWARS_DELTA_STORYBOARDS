name: CURRENT Authoring Source Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'designer-ai/current.json'
      - 'designer-ai/open-current/**'
      - 'designer-ai/devora.html'
      - 'designer-ai/simple-preview.html'
      - 'designer-ai/tools/current-source/**'
      - '.github/workflows/current-authoring-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'designer-ai/current.json'
      - 'designer-ai/open-current/**'
      - 'designer-ai/devora.html'
      - 'designer-ai/simple-preview.html'
      - 'designer-ai/tools/current-source/**'
      - '.github/workflows/current-authoring-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema

      - name: Validate canonical source and live CURRENT
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          from jsonschema import Draft202012Validator

          root=pathlib.Path('designer-ai')
          live=root/'open-current'
          source=root/'tools'/'current-source'
          source_simple=source/'simple-authoring'
          simple=live/'simple-authoring'

          obsolete=[
              root/'delta', root/'authoring-only', root/'simple-authoring', root/'CHATGPT_START.txt',
              root/'00_READ_ME_FIRST.txt', root/'01_CHATGPT_START.txt', root/'FILM_AUTHORING_GUIDE_CURRENT.md',
              root/'ARCHITECTURE.md', root/'OPEN_CURRENT.json', root/'debora.html',
              pathlib.Path('current.json'), root/'AGENT_ALIGNMENT_CURRENT.md', root/'AUTHORING_VALIDATION_GATE.md',
          ]
          present=[str(p) for p in obsolete if p.exists()]
          assert not present, 'DUPLICATE_OR_STALE_CURRENT_SURFACE_REAPPEARED: '+', '.join(present)

          forbidden_live=[
              live/'CHATGPT_READ_FIRST.txt',
              live/'DIRECTOR_PACK_MANIFEST.json',
              live/'SOURCE_CURRENT.json',
              live/'STARWARS_DELTA_CHATGPT_DIRECTOR_CURRENT.zip',
          ]
          stale_live=[str(p) for p in forbidden_live if p.exists()]
          assert not stale_live, 'LEGACY_PUBLIC_CURRENT_SURFACE_REAPPEARED: '+', '.join(stale_live)

          required_source=[
              source/'CHATGPT_START.txt',
              source/'FILM_AUTHORING_GUIDE_CURRENT.md',
              source_simple/'ARCHITECTURE.md',
              source_simple/'AUTHORING_PACK_GATE_POLICY.md',
              source_simple/'CINEMATIC_INTENT_QA_RULES.json',
              source_simple/'CUTSCENE_SCRIPT_V1.schema.json',
              source_simple/'CUTSCENE_SCRIPT_V1_CANONICAL_EXAMPLE.json',
              source_simple/'CUTSCENE_VALIDATION_CURRENT.schema.json',
              source_simple/'EMOTIONAL_DIALOGUE_AUTHORING_POLICY.json',
              source_simple/'FAIL_SOFT_MOVIE_AUTHORING_POLICY.md',
              source_simple/'LEARNING_CASES_POLICY.md',
              source_simple/'SEMANTIC_CINEMATIC_AUTHORING_GUIDE.md',
          ]
          missing=[str(p) for p in required_source if not p.is_file()]
          assert not missing, 'CANONICAL_AUTHORING_SOURCE_MISSING: '+', '.join(missing)

          # Maintained guidance has one engineering source and one sealed public copy.
          # These pairs must be byte-identical; publication is not allowed to invent a second rulebook.
          maintained_pairs=[
              (source/'CHATGPT_START.txt', live/'CHATGPT_START.txt'),
              (source/'FILM_AUTHORING_GUIDE_CURRENT.md', live/'FILM_AUTHORING_GUIDE_CURRENT.md'),
              (source_simple/'ARCHITECTURE.md', simple/'ARCHITECTURE.md'),
              (source_simple/'AUTHORING_PACK_GATE_POLICY.md', simple/'AUTHORING_PACK_GATE_POLICY.md'),
              (source_simple/'CINEMATIC_INTENT_QA_RULES.json', simple/'CINEMATIC_INTENT_QA_RULES.json'),
              (source_simple/'CUTSCENE_SCRIPT_V1.schema.json', simple/'CUTSCENE_SCRIPT_V1.schema.json'),
              (source_simple/'CUTSCENE_SCRIPT_V1_CANONICAL_EXAMPLE.json', simple/'CUTSCENE_SCRIPT_V1_CANONICAL_EXAMPLE.json'),
              (source_simple/'CUTSCENE_VALIDATION_CURRENT.schema.json', simple/'CUTSCENE_VALIDATION_CURRENT.schema.json'),
              (source_simple/'EMOTIONAL_DIALOGUE_AUTHORING_POLICY.json', simple/'EMOTIONAL_DIALOGUE_AUTHORING_POLICY.json'),
          ]
          parity_missing=[str(dst) for _,dst in maintained_pairs if not dst.is_file()]
          assert not parity_missing, 'SEALED_GUIDANCE_COPY_MISSING: '+', '.join(parity_missing)
          parity_drift=[f'{src} != {dst}' for src,dst in maintained_pairs if src.read_bytes()!=dst.read_bytes()]
          assert not parity_drift, 'SEALED_GUIDANCE_PARITY_DRIFT: '+', '.join(parity_drift)

          forbidden_source=[
              source_simple/'CUTSCENE_GOLDEN_QA_POLICY.md',
              source_simple/'INTEGRATION_STATUS_CURRENT.md',
          ]
          assert not any(p.exists() for p in forbidden_source), 'RUNTIME_STATUS_SURFACE_REAPPEARED'

          schema=json.loads((simple/'CUTSCENE_SCRIPT_V1.schema.json').read_text(encoding='utf-8-sig'))
          example=json.loads((simple/'CUTSCENE_SCRIPT_V1_CANONICAL_EXAMPLE.json').read_text(encoding='utf-8-sig'))
          Draft202012Validator.check_schema(schema)
          errors=list(Draft202012Validator(schema).iter_errors(example))
          assert not errors, 'CANONICAL_SIMPLE_V1_SCHEMA_INVALID: '+' | '.join(e.message for e in errors[:10])

          projectile=schema['$defs']['action']['properties']['projectileId']['enum']
          expected=['CS_PROJECTILE_BLUE_BOLT','CS_PROJECTILE_PURPLE_BOLT','CS_PROJECTILE_POWERBALL']
          assert projectile==expected, f'PROJECTILE_SCHEMA_DRIFT: {projectile}'
          action=schema['$defs']['action']['properties']
          visible=schema['$defs']['visibleElement']['properties']
          assert 'startOffset' in action and 'duration' in action, 'ACTION_TIMING_SCHEMA_MISSING'
          assert 'startOffsetSeconds' in visible and 'durationSeconds' in visible, 'EFFECT_TIMING_SCHEMA_MISSING'

          current=json.loads((root/'current.json').read_text(encoding='utf-8-sig'))
          opened=json.loads((live/'OPEN_CURRENT.json').read_text(encoding='utf-8-sig'))
          assert current.get('status')=='CURRENT_VERIFIED', 'CURRENT_POINTER_NOT_VERIFIED'
          assert opened.get('status')=='CURRENT_VERIFIED', 'OPEN_CURRENT_NOT_VERIFIED'
          assert current.get('publishTransactionId')==opened.get('publishTransactionId'), 'CURRENT_TRANSACTION_MISMATCH'
          assert current.get('requiredCurrent')==opened.get('requiredCurrent'), 'CURRENT_IDENTITY_MISMATCH'

          handles=json.loads((simple/'AUTHORING_HANDLES.json').read_text(encoding='utf-8-sig'))
          assert handles.get('requiredCurrent')==opened.get('requiredCurrent'), 'AUTHORING_HANDLES_IDENTITY_MISMATCH'
          counts=handles.get('countsByRoute') or {}
          direct_handles=handles.get('handles',[])
          for route in ('Actor','Audio','Effect','Layer','Ui'):
              assert route in counts, f'AUTHORING_ROUTE_COUNT_MISSING: {route}'
              actual_count=sum(1 for h in direct_handles if h.get('route')==route)
              assert counts.get(route)==actual_count, f'AUTHORING_ROUTE_COUNT_DRIFT: route={route} declared={counts.get(route)} actual={actual_count}'
          assert all(h.get('route')!='Animation' for h in direct_handles), 'RAW_ANIMATION_HANDLE_EXPOSED'

          rules=json.loads((simple/'AUTHORING_RULES_CURRENT.json').read_text(encoding='utf-8-sig'))
          actual=[r.get('id') for r in rules.get('rules',[])]
          expected_rule_ids=[
              'CURRENT_ONLY',
              'HANDLE_ONLY',
              'ANIMATION_SEMANTIC_ONLY',
              'DIALOGUE_CLOSED_WORLD',
              'DIALOGUE_IDENTITY',
              'DIALOGUE_EXPRESSION',
              'DIALOGUE_LOCKED_STAGING',
              'ONE_PRESENTATION_SOURCE',
              'VISUAL_EVIDENCE',
              'BACKEND_FIELDS_OMITTED',
              'SEMANTIC_CAMERA_SUBJECT',
              'ACTOR_ORBIT_FIXED_CENTER_ONLY',
              'NO_UNTIMED_MULTI_PHASE_LOCOMOTION',
              'SEMANTIC_SPEED_ONLY',
              'WARNING_FIRST',
              'SCHEMA_ONLY',
              'V4_RECIPES_ARE_AUTHORING_ONLY',
          ]
          assert len(actual)==17, f'SIMPLE_V1_RULE_COUNT_DRIFT: {len(actual)}'
          assert set(actual)==set(expected_rule_ids), f'SIMPLE_V1_RULE_SET_DRIFT: actual={sorted(actual)} expected={sorted(expected_rule_ids)}'

          assert not (live/'catalog-contract').exists(), 'LEGACY_CATALOG_CONTRACT_REAPPEARED'
          assert not (live/'instruction-book').exists(), 'LEGACY_INSTRUCTION_BOOK_REAPPEARED'

          start=(live/'CHATGPT_START.txt').read_text(encoding='utf-8-sig')
          source_start=(source/'CHATGPT_START.txt').read_text(encoding='utf-8-sig')
          guide=(live/'FILM_AUTHORING_GUIDE_CURRENT.md').read_text(encoding='utf-8-sig')
          arch=(simple/'ARCHITECTURE.md').read_text(encoding='utf-8-sig')
          failsoft=(source_simple/'FAIL_SOFT_MOVIE_AUTHORING_POLICY.md').read_text(encoding='utf-8-sig')

          forbidden_phrases=[
              'Create a current V5 package',
              'CURRENT AUTHORITATIVE RULES\nV2.7',
              'CUTSCENE_GOLDEN_QA_POLICY.md',
              'Required entrypoint: read `00_CHATGPT_READ_FIRST.txt`',
          ]
          for label,text in [('CHATGPT_START',start),('SOURCE_CHATGPT_START',source_start),('FILM_GUIDE',guide),('ARCHITECTURE',arch),('FAIL_SOFT_SOURCE',failsoft)]:
              hits=[p for p in forbidden_phrases if p in text]
              assert not hits, f'{label}_LEGACY_GUIDANCE: {hits}'

          assert 'VISIBLE EFFECTS / PARTICLES' in start, 'LIVE_START_EFFECT_GUIDANCE_MISSING'
          assert 'CUTSCENE PROJECTILES / MISSILES' in start, 'LIVE_START_PROJECTILE_GUIDANCE_MISSING'
          assert 'NORMAL FLOW LOCK' in source_start, 'SOURCE_NORMAL_FLOW_LOCK_MISSING'
          assert 'REPAIR FLOW' in source_start, 'SOURCE_REPAIR_FLOW_MISSING'
          assert 'Do not ask for, generate, or depend on a COPY REQUEST / REQUEST REPORT step for normal NEW authoring.' in source_start, 'SOURCE_REQUEST_REPORT_BAN_MISSING'
          assert 'Do not use an old V5 package as a template for NEW authoring.' in source_start, 'SOURCE_LEGACY_V5_BAN_MISSING'
          assert 'Action timing' in arch or 'Actor motion and timing' in arch, 'ARCHITECTURE_ACTION_TIMING_GUIDANCE_MISSING'
          assert 'Do **not** require a meaningless `reveal`' in failsoft, 'FAIL_SOFT_REVEAL_POLICY_MISSING'
          assert 'Accepted fixtures and Golden QA' in guide, 'GOLDEN_FIXTURE_GUIDANCE_MISSING'

          generated_root='Assets/_Game/MY_Core/MY_Data/Cutscenes/Generated'
          projection_paths=[live/'ASSET_VISUAL_LOOKUP.json', live/'FULL_VISUAL_INDEX.json', live/'VISUAL_UNAVAILABLE.json', simple/'AUTHORING_HANDLES.json']
          director=live/'director-view'
          for name in ('actors.json','animations.json','asset-lookup.json','audio.json','effects.json','layers.json','ui.json'):
              projection_paths.append(director/name)
          leaked=[str(p) for p in projection_paths if p.is_file() and generated_root in p.read_text(encoding='utf-8-sig',errors='replace')]
          assert not leaked, 'GENERATED_CUTSCENE_SOURCE_LEAK_IN_PUBLIC_CURRENT: '+', '.join(leaked)

          print('CURRENT_AUTHORING_SOURCE_LINT_PASS')
          print('CURRENT', current.get('publishTransactionId'))
          print('CATALOG', current.get('requiredCurrent',{}).get('catalogRevision'))
          print('SIMPLE_V1_RULE_COUNT', len(actual))
          print('AUDIO_DIRECT_HANDLES', counts.get('Audio'))
          print('SEALED_GUIDANCE_PARITY_PAIRS', len(maintained_pairs))
          print('LEGACY_PUBLIC_SURFACES', len(stale_live))
          print('GENERATED_ROOT_PUBLIC_PROJECTION_LEAKS', len(leaked))
          PY
