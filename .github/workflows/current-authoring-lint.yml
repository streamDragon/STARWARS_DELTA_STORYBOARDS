name: CURRENT Authoring Source Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'designer-ai/current.json'
      - 'designer-ai/open-current/**'
      - 'designer-ai/devora.html'
      - 'designer-ai/simple-preview.html'
      - 'designer-ai/tools/**'
      - '.github/workflows/current-authoring-lint.yml'
      - '.github/workflows/project-designer-ai-guidance.yml'
      - '.github/workflows/publish-designer-ai-open-current.yml'
      - '.github/workflows/sanitize-designer-ai-current.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema

      - name: Validate canonical source and live CURRENT
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, zipfile
          from jsonschema import Draft202012Validator

          root=pathlib.Path('designer-ai')
          live=root/'open-current'
          source=root/'tools'/'current-source'
          source_simple=source/'simple-authoring'
          simple=live/'simple-authoring'

          obsolete=[
              root/'delta', root/'authoring-only', root/'simple-authoring', root/'CHATGPT_START.txt',
              root/'00_READ_ME_FIRST.txt', root/'01_CHATGPT_START.txt', root/'FILM_AUTHORING_GUIDE_CURRENT.md',
              root/'ARCHITECTURE.md', root/'OPEN_CURRENT.json', root/'debora.html',
              pathlib.Path('current.json'), root/'AGENT_ALIGNMENT_CURRENT.md', root/'AUTHORING_VALIDATION_GATE.md',
          ]
          present=[str(p) for p in obsolete if p.exists()]
          assert not present, 'DUPLICATE_OR_STALE_CURRENT_SURFACE_REAPPEARED: '+', '.join(present)

          required_source=[
              source/'CHATGPT_START.txt',
              source/'FILM_AUTHORING_GUIDE_CURRENT.md',
              source_simple/'ARCHITECTURE.md',
              source_simple/'AUTHORING_PACK_GATE_POLICY.md',
              source_simple/'CINEMATIC_INTENT_QA_RULES.json',
              source_simple/'CUTSCENE_SCRIPT_V1.schema.json',
              source_simple/'CUTSCENE_SCRIPT_V1_CANONICAL_EXAMPLE.json',
              source_simple/'CUTSCENE_VALIDATION_CURRENT.schema.json',
              source_simple/'EMOTIONAL_DIALOGUE_AUTHORING_POLICY.json',
              source_simple/'FAIL_SOFT_MOVIE_AUTHORING_POLICY.md',
              source_simple/'LEARNING_CASES_POLICY.md',
              source_simple/'SEMANTIC_CINEMATIC_AUTHORING_GUIDE.md',
          ]
          missing=[str(p) for p in required_source if not p.is_file()]
          assert not missing, 'CANONICAL_AUTHORING_SOURCE_MISSING: '+', '.join(missing)

          forbidden_source=[
              source_simple/'CUTSCENE_GOLDEN_QA_POLICY.md',
              source_simple/'INTEGRATION_STATUS_CURRENT.md',
          ]
          assert not any(p.exists() for p in forbidden_source), 'RUNTIME_STATUS_SURFACE_REAPPEARED'

          schema=json.loads((simple/'CUTSCENE_SCRIPT_V1.schema.json').read_text(encoding='utf-8-sig'))
          example=json.loads((simple/'CUTSCENE_SCRIPT_V1_CANONICAL_EXAMPLE.json').read_text(encoding='utf-8-sig'))
          Draft202012Validator.check_schema(schema)
          errors=list(Draft202012Validator(schema).iter_errors(example))
          assert not errors, 'CANONICAL_SIMPLE_V1_SCHEMA_INVALID: '+' | '.join(e.message for e in errors[:10])

          projectile=schema['$defs']['action']['properties']['projectileId']['enum']
          expected=['CS_PROJECTILE_BLUE_BOLT','CS_PROJECTILE_PURPLE_BOLT','CS_PROJECTILE_POWERBALL']
          assert projectile==expected, f'PROJECTILE_SCHEMA_DRIFT: {projectile}'
          action=schema['$defs']['action']['properties']
          visible=schema['$defs']['visibleElement']['properties']
          assert 'startOffset' in action and 'duration' in action, 'ACTION_TIMING_SCHEMA_MISSING'
          assert 'startOffsetSeconds' in visible and 'durationSeconds' in visible, 'EFFECT_TIMING_SCHEMA_MISSING'

          current=json.loads((root/'current.json').read_text(encoding='utf-8-sig'))
          opened=json.loads((live/'OPEN_CURRENT.json').read_text(encoding='utf-8-sig'))
          assert current.get('status')=='CURRENT_VERIFIED'
          assert opened.get('status')=='CURRENT_VERIFIED'
          assert current.get('publishTransactionId')==opened.get('publishTransactionId')
          assert current.get('requiredCurrent')==opened.get('requiredCurrent')

          handles=json.loads((simple/'AUTHORING_HANDLES.json').read_text(encoding='utf-8-sig'))
          assert handles.get('requiredCurrent')==opened.get('requiredCurrent')
          assert (handles.get('countsByRoute') or {}).get('Audio',0)>0
          assert all(h.get('route')!='Animation' for h in handles.get('handles',[])), 'RAW_ANIMATION_HANDLE_EXPOSED'

          rules=json.loads((simple/'AUTHORING_RULES_CURRENT.json').read_text(encoding='utf-8-sig'))
          ids={r.get('id') for r in rules.get('rules',[])}
          assert 'V4_RECIPES_ARE_AUTHORING_ONLY' not in ids, 'LEGACY_V4_RECIPE_RULE_REAPPEARED'

          assert not (live/'catalog-contract').exists(), 'LEGACY_CATALOG_CONTRACT_REAPPEARED'
          assert not (live/'instruction-book').exists(), 'LEGACY_INSTRUCTION_BOOK_REAPPEARED'

          start=(live/'CHATGPT_START.txt').read_text(encoding='utf-8-sig')
          guide=(live/'FILM_AUTHORING_GUIDE_CURRENT.md').read_text(encoding='utf-8-sig')
          arch=(simple/'ARCHITECTURE.md').read_text(encoding='utf-8-sig')
          failsoft=(source_simple/'FAIL_SOFT_MOVIE_AUTHORING_POLICY.md').read_text(encoding='utf-8-sig')

          forbidden_phrases=[
              'Create a current V5 package',
              'CURRENT AUTHORITATIVE RULES\nV2.7',
              'V4_RECIPES_ARE_AUTHORING_ONLY',
              'CUTSCENE_GOLDEN_QA_POLICY.md',
          ]
          for label,text in [('CHATGPT_START',start),('FILM_GUIDE',guide),('ARCHITECTURE',arch),('FAIL_SOFT_SOURCE',failsoft)]:
              hits=[p for p in forbidden_phrases if p in text]
              assert not hits, f'{label}_LEGACY_GUIDANCE: {hits}'

          assert 'VISIBLE EFFECTS / PARTICLES' in start
          assert 'CUTSCENE PROJECTILES / MISSILES' in start
          assert 'Action timing' in arch or 'Actor motion and timing' in arch
          assert 'Do **not** require a meaningless `reveal`' in failsoft
          assert 'Accepted fixtures and Golden QA' in guide

          generated_root='Assets/_Game/MY_Core/MY_Data/Cutscenes/Generated'
          projection_paths=[live/'ASSET_VISUAL_LOOKUP.json', live/'FULL_VISUAL_INDEX.json', live/'VISUAL_UNAVAILABLE.json', simple/'AUTHORING_HANDLES.json']
          director=live/'director-view'
          for name in ('actors.json','animations.json','asset-lookup.json','audio.json','effects.json','layers.json','ui.json'):
              projection_paths.append(director/name)
          leaked=[str(p) for p in projection_paths if p.is_file() and generated_root in p.read_text(encoding='utf-8-sig',errors='replace')]
          assert not leaked, 'GENERATED_CUTSCENE_SOURCE_LEAK_IN_PUBLIC_CURRENT: '+', '.join(leaked)

          pack=live/'STARWARS_DELTA_CHATGPT_DIRECTOR_CURRENT.zip'
          if pack.is_file():
              with zipfile.ZipFile(pack,'r') as z:
                  names=[n.replace('\\','/') for n in z.namelist()]
                  stale=[n for n in names if n.startswith('catalog-contract/') or n.startswith('instruction-book/')]
                  assert not stale, 'LEGACY_SURFACE_INSIDE_DIRECTOR_PACK: '+', '.join(stale[:20])

          print('CURRENT_AUTHORING_SOURCE_LINT_PASS')
          print('CURRENT', current.get('publishTransactionId'))
          print('CATALOG', current.get('requiredCurrent',{}).get('catalogRevision'))
          print('LEGACY_PUBLIC_SURFACES', 0)
          print('GENERATED_ROOT_PUBLIC_PROJECTION_LEAKS', len(leaked))
          PY
