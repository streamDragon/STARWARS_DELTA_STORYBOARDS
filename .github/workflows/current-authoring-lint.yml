name: CURRENT Authoring Source Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'designer-ai/current.json'
      - 'designer-ai/open-current/**'
      - 'designer-ai/devora.html'
      - 'designer-ai/index.html'
      - 'designer-ai/simple-preview.html'
      - 'designer-ai/tools/**'
      - 'designer-ai/delta/**'
      - 'designer-ai/authoring-only/**'
      - 'designer-ai/00_READ_ME_FIRST.txt'
      - 'designer-ai/01_CHATGPT_START.txt'
      - 'designer-ai/simple-authoring/**'
      - 'designer-ai/CHATGPT_START.txt'
      - 'designer-ai/FILM_AUTHORING_GUIDE_CURRENT.md'
      - 'designer-ai/ARCHITECTURE.md'
      - 'designer-ai/OPEN_CURRENT.json'
      - 'designer-ai/debora.html'
      - 'current.json'
      - 'site-build.json'
      - 'README.md'
      - '.github/workflows/current-authoring-lint.yml'
      - '.github/workflows/cutscene-film-qa.yml'
      - '.github/workflows/publish-designer-ai-open-current.yml'
      - '.github/workflows/project-designer-ai-guidance.yml'
      - 'tools/cutscene-film-qa.mjs'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema

      - name: Lint one live CURRENT and one canonical source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('designer-ai')
          live = root / 'open-current'
          simple = live / 'simple-authoring'
          source_root = root / 'tools' / 'current-source'
          source_simple = source_root / 'simple-authoring'

          schema = json.loads((simple / 'CUTSCENE_SCRIPT_V1.schema.json').read_text(encoding='utf-8-sig'))
          example = json.loads((simple / 'CUTSCENE_SCRIPT_V1_CANONICAL_EXAMPLE.json').read_text(encoding='utf-8-sig'))
          Draft202012Validator.check_schema(schema)
          errors = list(Draft202012Validator(schema).iter_errors(example))
          assert not errors, 'CANONICAL_SIMPLE_V1_SCHEMA_INVALID: ' + ' | '.join(e.message for e in errors[:10])

          projectile = schema['$defs']['action']['properties']['projectileId']['enum']
          expected = ['CS_PROJECTILE_BLUE_BOLT','CS_PROJECTILE_PURPLE_BOLT','CS_PROJECTILE_POWERBALL']
          assert projectile == expected, f'PROJECTILE_SCHEMA_DRIFT: {projectile}'

          # CANONICAL SOURCE INVARIANT: one live CURRENT tree and one engineering source tree only.
          # No legacy/compatibility authoring copies or archived CURRENT trees are permitted.
          obsolete = [
              root / 'delta', root / 'authoring-only', root / 'simple-authoring', root / 'CHATGPT_START.txt',
              root / '00_READ_ME_FIRST.txt', root / '01_CHATGPT_START.txt',
              root / 'FILM_AUTHORING_GUIDE_CURRENT.md', root / 'ARCHITECTURE.md',
              root / 'OPEN_CURRENT.json', root / 'debora.html',
              Path('current.json'), Path('.github/workflows/cutscene-film-qa.yml'), Path('tools/cutscene-film-qa.mjs')
          ]
          present = [str(p) for p in obsolete if p.exists()]
          assert not present, 'DUPLICATE_OR_STALE_CURRENT_SURFACE_REAPPEARED: ' + ', '.join(present)

          site_build = json.loads(Path('site-build.json').read_text(encoding='utf-8-sig'))
          assert site_build.get('schema') == 'STARWARS_DELTA_SITE_BUILD'
          assert site_build.get('role') == 'SITE_CACHE_BUST_ONLY'

          duplicate_source_names = [
              'ARCHITECTURE.md',
              'AUTHORING_PACK_GATE_POLICY.md',
              'CINEMATIC_INTENT_QA_RULES.json',
              'CUTSCENE_SCRIPT_V1.schema.json',
              'CUTSCENE_SCRIPT_V1_CANONICAL_EXAMPLE.json',
              'CUTSCENE_VALIDATION_CURRENT.schema.json',
              'EMOTIONAL_DIALOGUE_AUTHORING_POLICY.json',
              'SEMANTIC_CINEMATIC_AUTHORING_GUIDE.md',
          ]
          duplicate_source_paths = [str(source_root / name) for name in duplicate_source_names if (source_root / name).exists()]
          assert not duplicate_source_paths, 'DUPLICATE_SIMPLE_SOURCE_REAPPEARED: ' + ', '.join(duplicate_source_paths)

          required_source = [
              source_root / 'CHATGPT_START.txt',
              source_root / 'FILM_AUTHORING_GUIDE_CURRENT.md',
              source_simple / 'ARCHITECTURE.md',
              source_simple / 'AUTHORING_PACK_GATE_POLICY.md',
              source_simple / 'CINEMATIC_INTENT_QA_RULES.json',
              source_simple / 'CUTSCENE_SCRIPT_V1.schema.json',
              source_simple / 'CUTSCENE_SCRIPT_V1_CANONICAL_EXAMPLE.json',
              source_simple / 'CUTSCENE_VALIDATION_CURRENT.schema.json',
              source_simple / 'EMOTIONAL_DIALOGUE_AUTHORING_POLICY.json',
              source_simple / 'FAIL_SOFT_MOVIE_AUTHORING_POLICY.md',
              source_simple / 'LEARNING_CASES_POLICY.md',
              source_simple / 'SEMANTIC_CINEMATIC_AUTHORING_GUIDE.md',
          ]
          missing_source = [str(p) for p in required_source if not p.is_file()]
          assert not missing_source, 'CANONICAL_AUTHORING_SOURCE_MISSING: ' + ', '.join(missing_source)

          architecture = (source_simple / 'ARCHITECTURE.md').read_text(encoding='utf-8-sig')
          assert 'Native-first Timeline ownership' in architecture, 'NATIVE_FIRST_TIMELINE_ARCHITECTURE_MISSING'
          assert 'Visible obligations and Effect lowering' in architecture, 'VISIBLE_EFFECT_OBLIGATION_ARCHITECTURE_MISSING'
          assert 'Binding-aware materialization coverage' in architecture, 'MATERIALIZATION_COVERAGE_ARCHITECTURE_MISSING'
          assert 'viewport-proportional' in architecture.lower(), 'VIEWPORT_PROPORTIONAL_MOTION_ARCHITECTURE_MISSING'
          assert 'BAD NEW CANDIDATE != DESTROY LAST GOOD PREVIEW' in architecture, 'LAST_GOOD_PREVIEW_INVARIANT_MISSING'

          source_start = (source_root / 'CHATGPT_START.txt').read_text(encoding='utf-8-sig')
          assert 'VISIBLE EFFECTS' in source_start, 'SOURCE_CHATGPT_VISIBLE_EFFECT_RULE_MISSING'
          assert 'Do not add meaningless reveal/activate actions merely to force an Effect to exist.' in source_start, 'SOURCE_CHATGPT_EFFECT_WORKAROUND_RULE_MISSING'
          assert 'Repeated identical Effect handles remain distinct generated instances' in source_start, 'SOURCE_CHATGPT_EFFECT_INSTANCE_RULE_MISSING'
          assert 'viewport-authored motion against the active Cutscene camera' in source_start, 'SOURCE_CHATGPT_VIEWPORT_MOTION_RULE_MISSING'

          designer_index = (root / 'index.html').read_text(encoding='utf-8')
          assert "location.replace('devora.html')" in designer_index, 'DESIGNER_INDEX_NOT_DEVORA_REDIRECT'

          source = json.loads((root / 'current.json').read_text(encoding='utf-8-sig'))
          current = json.loads((live / 'OPEN_CURRENT.json').read_text(encoding='utf-8-sig'))
          assert source.get('status') == 'CURRENT_VERIFIED', 'SOURCE_CURRENT_STATUS_INVALID'
          assert current.get('status') == 'CURRENT_VERIFIED', 'OPEN_CURRENT_STATUS_INVALID'
          assert source.get('publishTransactionId') == current.get('publishTransactionId'), 'COMMITTED_CURRENT_TRANSACTION_MISMATCH'
          assert source.get('requiredCurrent') == current.get('requiredCurrent'), 'COMMITTED_CURRENT_FINGERPRINT_MISMATCH'

          handles = json.loads((simple / 'AUTHORING_HANDLES.json').read_text(encoding='utf-8-sig'))
          assert handles.get('requiredCurrent') == current.get('requiredCurrent'), 'AUTHORING_HANDLES_CURRENT_MISMATCH'
          assert (handles.get('countsByRoute') or {}).get('Audio', 0) > 0, 'AUTHORING_HANDLES_AUDIO_EMPTY'

          start = (live / 'CHATGPT_START.txt').read_text(encoding='utf-8-sig')
          forbidden = ['CS_PROJECTILE_LASER','CS_PROJECTILE_AXE','CS_PROJECTILE_ROCKET']
          hits = [x for x in forbidden if x in start]
          assert not hits, 'STALE_PROJECTILE_VOCAB_IN_CHATGPT_START: ' + ', '.join(hits)

          devora = (root / 'devora.html').read_text(encoding='utf-8')
          assert "open.status!=='CURRENT_VERIFIED'" in devora, 'DEVORA_CANONICAL_CURRENT_STATUS_CONTRACT_MISSING'
          assert 'CURRENT_VERIFIED_OPEN' not in devora, 'DEVORA_OBSOLETE_CURRENT_STATUS_REAPPEARED'
          assert "open-current/CHATGPT_START.txt','bytes'" in devora, 'DEVORA_CANONICAL_START_NOT_LOADED'

          preview = (root / 'simple-preview.html').read_text(encoding='utf-8')
          assert "open.status!=='CURRENT_VERIFIED'" in preview, 'SIMPLE_PREVIEW_CANONICAL_CURRENT_STATUS_CONTRACT_MISSING'
          assert 'CURRENT_VERIFIED_OPEN' not in preview, 'SIMPLE_PREVIEW_OBSOLETE_CURRENT_STATUS_REAPPEARED'
          assert 'PREVIEWABLE' in preview, 'SIMPLE_PREVIEW_PREVIEWABLE_STATUS_MISSING'
          assert 'Web preflight only' in preview and 'Unity remains final runtime authority' in preview, 'SIMPLE_PREVIEW_AUTHORITY_BOUNDARY_MISSING'

          generated_root = 'Assets/_Game/MY_Core/MY_Data/Cutscenes/Generated'
          projection_paths = [
              live / 'ASSET_VISUAL_LOOKUP.json', live / 'FULL_VISUAL_INDEX.json',
              live / 'VISUAL_UNAVAILABLE.json', simple / 'AUTHORING_HANDLES.json'
          ]
          director = live / 'director-view'
          for name in ('actors.json','animations.json','asset-lookup.json','audio.json','effects.json','layers.json','ui.json'):
              projection_paths.append(director / name)
          leaked = [str(p) for p in projection_paths if p.is_file() and generated_root in p.read_text(encoding='utf-8-sig', errors='replace')]
          assert not leaked, 'GENERATED_CUTSCENE_SOURCE_LEAK_IN_PUBLIC_CURRENT: ' + ', '.join(leaked)

          print('CURRENT_AUTHORING_SOURCE_LINT_PASS')
          print('CURRENT', source.get('publishTransactionId'))
          print('CATALOG', source.get('requiredCurrent', {}).get('catalogRevision'))
          print('AUDIO_HANDLES', (handles.get('countsByRoute') or {}).get('Audio', 0))
          print('GENERATED_ROOT_PUBLIC_PROJECTION_LEAKS', len(leaked))
          print('DUPLICATE_SIMPLE_SOURCE_FILES', len(duplicate_source_paths))
          PY
