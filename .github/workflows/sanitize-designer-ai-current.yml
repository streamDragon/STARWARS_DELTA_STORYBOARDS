name: Sanitize Designer AI CURRENT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'designer-ai/open-current/**'
      - 'designer-ai/tools/sanitize_current_surface.py'
      - '.github/workflows/sanitize-designer-ai-current.yml'

permissions:
  contents: write

concurrency:
  group: sanitize-designer-ai-current
  cancel-in-progress: true

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Stage current published surface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _open_current_stage
          mkdir -p _open_current_stage
          cp -a designer-ai/open-current/. _open_current_stage/

      - name: Sanitize public CURRENT
        shell: bash
        run: |
          set -euo pipefail
          python3 designer-ai/tools/sanitize_current_surface.py
          python3 designer-ai/tools/sanitize_current_surface.py --check

      - name: Verify CURRENT identity unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          source=json.loads(pathlib.Path('designer-ai/current.json').read_text(encoding='utf-8-sig'))
          staged=json.loads(pathlib.Path('_open_current_stage/OPEN_CURRENT.json').read_text(encoding='utf-8-sig'))
          assert source.get('status')=='CURRENT_VERIFIED'
          assert staged.get('status')=='CURRENT_VERIFIED'
          assert source.get('publishTransactionId')==staged.get('publishTransactionId')
          assert source.get('requiredCurrent')==staged.get('requiredCurrent')
          print('SANITIZED_CURRENT_IDENTITY_PASS', source.get('publishTransactionId'))
          PY

      - name: Commit sanitized CURRENT if needed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf designer-ai/open-current
          mkdir -p designer-ai/open-current
          cp -a _open_current_stage/. designer-ai/open-current/
          git config user.name 'github-actions[bot]'
          git config user.email '41898280+github-actions[bot]@users.noreply.github.com'
          git add -A designer-ai/open-current
          if git diff --cached --quiet; then
            echo 'SANITIZED_CURRENT_ALREADY_CLEAN'
            exit 0
          fi
          git commit -m 'Sanitize Designer AI CURRENT legacy surfaces'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'SANITIZED_CURRENT_COMMITTED'
