name: ChatGPT Action Smoke

on:
  push:
    branches: [main]
    paths:
      - 'designer-ai/CHATGPT_ACTION_TRIGGER.txt'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write smoke result
        shell: bash
        run: |
          set -euo pipefail
          printf 'CHATGPT_ACTION_SMOKE_OK\n%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > designer-ai/CHATGPT_ACTION_SMOKE_RESULT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add designer-ai/CHATGPT_ACTION_SMOKE_RESULT.txt
          git commit -m 'Record ChatGPT Actions smoke result'
          git push origin HEAD:main
